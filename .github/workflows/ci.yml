name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Generated API code is up to date
        run: |
          go tool ogen --target internal/api/gen --package gen --clean ../api/openapi.yaml
          git diff --exit-code -- internal/api/gen
          test -z "$(git status --porcelain -- internal/api/gen)"
      - name: go mod tidy is clean
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: server
      - name: ffmpeg for the subtitle sync tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: go test ./... -race

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated API types are up to date
        run: pnpm gen:api && git diff --exit-code -- src/api/schema.gen.ts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  clients:
    # The shared download client contract suite against real clients (the
    # cheap ones; scripts/test-clients.sh runs all seven locally).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Contract suite against qBittorrent, Transmission and SABnzbd
        env:
          LOCARR_CLIENTS_TMP: ${{ runner.temp }}
        run: ./scripts/test-clients.sh qbittorrent transmission sabnzbd

  sources:
    # Importing an existing setup from real applications (the importer only
    # reads them); scripts/test-sources.sh runs every application locally.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Import from real Sonarr, Radarr and qBittorrent
        env:
          LOCARR_SOURCES_TMP: ${{ runner.temp }}
        run: ./scripts/test-sources.sh sonarr radarr qbittorrent

  streamero:
    # A real Streamero uses Locarr's Seerr/Radarr/Sonarr compatible routes
    # for discover, requests and upcoming releases (D-079).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Discover and requests from a real Streamero
        run: ./scripts/test-streamero-compat.sh

  e2e:
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v4
      - name: Start the compose stack
        working-directory: deploy
        run: |
          cp .env.example .env
          {
            echo "LOCARR_SETUP_CODE=E2E-SETUP"
            # The suite signs in many times from one address; the limiter has its own tests.
            echo "LOCARR_AUTH_RATE_LIMIT=0"
            echo "CONFIG_DIR=$RUNNER_TEMP/locarr/config"
            echo "DATA_DIR=$RUNNER_TEMP/locarr/data"
            echo "PUID=$(id -u)"
            echo "PGID=$(id -g)"
            echo "LOCARR_BUILD_COMMIT=$GITHUB_SHA"
            # The fake TMDb of scripts/dev-fakes.sh (compose.dev.yml passes it on).
            echo "LOCARR_TMDB_URL=http://fake-indexer:9117/tmdb"
            # The fake MusicBrainz and Cover Art Archive (one request per second, like the real one).
            echo "LOCARR_MUSICBRAINZ_URL=http://fake-indexer:9117/musicbrainz"
            echo "LOCARR_COVERART_URL=http://fake-indexer:9117/musicbrainz/coverart"
            # The fake subtitle providers (OpenSubtitles.com, SubDL, Jimaku).
            echo "LOCARR_OPENSUBTITLES_URL=http://fake-indexer:9117/opensubtitles/api/v1"
            echo "LOCARR_SUBDL_URL=http://fake-indexer:9117/subdl/api/v1"
            echo "LOCARR_JIMAKU_URL=http://fake-indexer:9117/jimaku/api"
          } >> .env
          mkdir -p "$RUNNER_TEMP/locarr/data/media/movies" "$RUNNER_TEMP/locarr/data/media/tv" "$RUNNER_TEMP/locarr/data/media/music" "$RUNNER_TEMP/locarr/data/downloads/fake-seed"
          docker compose -f docker-compose.yml -f compose.dev.yml up -d --build --wait
          curl -fsS http://127.0.0.1:8484/api/v1/system/info
      - name: Start the fake indexers and TMDb
        run: LOCARR_FAKES_SEED_DIR="$RUNNER_TEMP/locarr/data/downloads/fake-seed" ./scripts/dev-fakes.sh up
      - name: Start Transmission for the download client and movie tests
        run: |
          # It sees the data folder under the same /data path as Locarr and saves into the
          # folder where the fakes put the data of their tiny torrents.
          docker run -d --name transmission --network locarr-net -e PUID="$(id -u)" -e PGID="$(id -g)" \
            -e USER=locarr -e PASS=locarr-e2e -v "$RUNNER_TEMP/locarr/data:/data" lscr.io/linuxserver/transmission:latest
          rpc() { docker run --rm --network locarr-net curlimages/curl:8.11.1 -s -u locarr:locarr-e2e "$@" http://transmission:9091/transmission/rpc; }
          for _ in $(seq 1 60); do
            sid="$(rpc -o /dev/null -D - | tr -d '\r' | awk 'tolower($1)=="x-transmission-session-id:" {print $2}')"
            [ -n "$sid" ] && break
            sleep 1
          done
          rpc -H "X-Transmission-Session-Id: $sid" \
            -d '{"method":"session-set","arguments":{"download-dir":"/data/downloads/fake-seed","incomplete-dir-enabled":false}}'
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm e2e
        env:
          E2E_SETUP_CODE: E2E-SETUP
          E2E_DATA_DIR: ${{ runner.temp }}/locarr/data
      - name: Compose logs on failure
        if: failure()
        working-directory: deploy
        run: |
          docker compose -f docker-compose.yml -f compose.dev.yml logs
          docker logs locarr-fakes || true
          docker logs transmission || true
