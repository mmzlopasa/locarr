name: android
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
    # Path filters do not apply to tags: every release tag builds the .apk.
    tags: ["v*"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the version of non-release builds
      - name: Version
        # versionCode = major*10000 + minor*100 + patch (app/build.gradle.kts). A tag build uses
        # the tag; other builds the last release tag plus "-dev.N", so they never outrank the next release.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
          else
            tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)"
            name="${tag#v}-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "APK=Locarr-v$name.apk" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug
      - name: Restore signing key
        # Without the secret the release .apk is signed with the debug key (it installs,
        # but cannot update an app signed with the real key).
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the .apk is signed with the debug key"
          fi
      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: locarr-apk
          path: |
            android/dist/*.apk
            android/app/build/reports/lint-results-debug.html
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The maintainer usually creates the release (gh release create); give that a moment,
          # then create it ourselves. The iOS workflow may create it at the same time, so a
          # failed create is fine as long as the release exists afterwards.
          for _ in $(seq 1 8); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 15
          done
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG" || gh release view "$TAG" >/dev/null
          fi
          gh release upload "$TAG" "dist/$APK" --clobber
    permissions:
      contents: write
