# Locarr: one service, one port. See docs/INSTALL.md.
#   cp .env.example .env    # adjust paths and PUID/PGID
#   docker compose up -d
#   docker compose logs locarr   # shows the first-run setup code
name: locarr

services:
  locarr:
    image: ghcr.io/mmzlopasa/locarr:${LOCARR_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-127.0.0.1:8484}:8484"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      UMASK: ${UMASK:-002}
      TZ: ${TZ:-Etc/UTC}
      LOCARR_LOG_LEVEL: ${LOCARR_LOG_LEVEL:-info}
      LOCARR_TRUSTED_PROXIES: ${LOCARR_TRUSTED_PROXIES:-}
      LOCARR_SETUP_CODE: ${LOCARR_SETUP_CODE:-}
      LOCARR_AUTH_RATE_LIMIT: ${LOCARR_AUTH_RATE_LIMIT:-10,10}
    volumes:
      # Database and secret key. Back this folder up.
      - ${CONFIG_DIR:-./config}:/config
      # Media AND downloads under ONE mount, so imports can hardlink instead of copy:
      #   /data/media/{movies,tv,music}   /data/downloads/{torrents,usenet}
      - ${DATA_DIR:-./data}:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Only what the entrypoint needs to hand /config to PUID:PGID and drop root.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /tmp

networks:
  default:
    name: ${NETWORK_NAME:-locarr-net}
