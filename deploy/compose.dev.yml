# Builds the image from this checkout instead of pulling it:
#   docker compose -f deploy/docker-compose.yml -f deploy/compose.dev.yml up -d --build
services:
  locarr:
    image: locarr:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: ${LOCARR_BUILD_VERSION:-dev}
        COMMIT: ${LOCARR_BUILD_COMMIT:-unknown}
    environment:
      # Only for verification against the fake services (scripts/dev-fakes.sh).
      LOCARR_TMDB_URL: ${LOCARR_TMDB_URL:-}
      LOCARR_STASHDB_URL: ${LOCARR_STASHDB_URL:-}
      LOCARR_TPDB_URL: ${LOCARR_TPDB_URL:-}
      LOCARR_TVDB_URL: ${LOCARR_TVDB_URL:-}
      LOCARR_MUSICBRAINZ_URL: ${LOCARR_MUSICBRAINZ_URL:-}
      LOCARR_COVERART_URL: ${LOCARR_COVERART_URL:-}
      LOCARR_LASTFM_URL: ${LOCARR_LASTFM_URL:-}
      LOCARR_LISTENBRAINZ_URL: ${LOCARR_LISTENBRAINZ_URL:-}
      LOCARR_LISTENBRAINZ_LABS_URL: ${LOCARR_LISTENBRAINZ_LABS_URL:-}
      LOCARR_SPOTIFY_URL: ${LOCARR_SPOTIFY_URL:-}
      LOCARR_SPOTIFY_ACCOUNTS_URL: ${LOCARR_SPOTIFY_ACCOUNTS_URL:-}
      LOCARR_OPENSUBTITLES_URL: ${LOCARR_OPENSUBTITLES_URL:-}
      LOCARR_SUBDL_URL: ${LOCARR_SUBDL_URL:-}
      LOCARR_JIMAKU_URL: ${LOCARR_JIMAKU_URL:-}
