                  $ref: "#/components/schemas/SeriesImportCandidate"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: manualImportSeries
      summary: Import chosen files into episodes (library managers)
      tags: [series]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeriesManualImportRequest"
      responses:
        "200":
          description: One result per file
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SeriesManualImportResult"
        default:
          $ref: "#/components/responses/Error"
  /series/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getSeries
      summary: One series with its seasons
      tags: [series]
      responses:
        "200":
          description: The series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateSeries
      summary: Change how a series is managed (library managers)
      description: |
        `monitor` re-applies a monitor option to every episode (specials keep their own setting).
        The folder can change only while the series has no files (`has_files`).
      tags: [series]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeriesUpdate"
      responses:
        "200":
          description: The series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Series"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteSeries
      summary: Remove a series (library managers)
      description: With `deleteFiles` the series folder goes to the recycle bin; files are never deleted outright.
      tags: [series]
      parameters:
        - {name: deleteFiles, in: query, required: false, schema: {type: boolean, default: false}}
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /series/{id}/episodes:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listSeriesEpisodes
      summary: Every episode of a series, in order
      tags: [series]
      responses:
        "200":
          description: Episodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Episode"
        default:
          $ref: "#/components/responses/Error"
  /series/{id}/refresh:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: refreshSeries
      summary: Reload a series from its provider and merge seasons and episodes (library managers)
      tags: [series]
      responses:
        "200":
          description: The series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Series"
        default:
          $ref: "#/components/responses/Error"
  /series/{id}/search:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: searchSeries
      summary: Queue searches for every wanted season and episode of a series (library managers)
      tags: [series]
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedCount"
        default:
          $ref: "#/components/responses/Error"
  /series/{id}/seasons/{number}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - {name: number, in: path, required: true, schema: {type: integer, minimum: 0}}
    patch:
      operationId: updateSeason
      summary: Monitor or unmonitor a season and all its episodes (library managers)
      tags: [series]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeasonUpdate"
      responses:
        "200":
          description: The season
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeasonInfo"
        default:
          $ref: "#/components/responses/Error"
  /series/{id}/seasons/{number}/search:
    parameters:
      - $ref: "#/components/parameters/ID"
      - {name: number, in: path, required: true, schema: {type: integer, minimum: 0}}
    post:
      operationId: searchSeason
      summary: Queue a season search now (season packs preferred) (library managers)
      tags: [series]
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedCount"
        default:
          $ref: "#/components/responses/Error"
  /series/{id}/seasons/{number}/releases:
    parameters:
