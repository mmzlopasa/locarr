                $ref: "#/components/schemas/MediaManagementSettings"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateMediaManagement
      summary: Change naming, transfer mode, recycle bin and permissions (administrators)
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaManagementSettings"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaManagementSettings"
        default:
          $ref: "#/components/responses/Error"
  /settings/mediamanagement/series:
    get:
      operationId: getSeriesNaming
      summary: Series naming and season pack settings (administrators)
      tags: [settings]
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesNamingSettings"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateSeriesNaming
      summary: Change series naming and season pack settings (administrators)
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeriesNamingSettings"
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesNamingSettings"
        default:
          $ref: "#/components/responses/Error"
  /settings/mediamanagement/series/preview:
    post:
      operationId: previewSeriesNaming
      summary: Render the series templates for standard, multi-episode, daily and anime examples
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeriesNamingSettings"
      responses:
        "200":
          description: The example names
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesNamingPreview"
        default:
          $ref: "#/components/responses/Error"
  /settings/mediamanagement/preview:
    post:
      operationId: previewNaming
      summary: Render naming templates for an example movie
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NamingPreviewRequest"
      responses:
        "200":
          description: Rendered names (or the template error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NamingPreview"
        default:
          $ref: "#/components/responses/Error"
  /settings/metadata:
    get:
      operationId: getMetadataSettings
      summary: TMDb key state, language and region (administrators)
      tags: [settings]
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataSettings"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateMetadataSettings
      summary: Change the TMDb key (validated with TMDb first), language and region (administrators)
      description: A key TMDb refuses is not stored (`metadata_key_invalid`).
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetadataSettingsInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataSettings"
        default:
          $ref: "#/components/responses/Error"
  /music/artists:
    get:
      operationId: listArtists
      summary: The music library's artists, one page at a time
      tags: [music]
      parameters:
        - {name: q, in: query, required: false, schema: {type: string, maxLength: 200}}
        - {name: monitored, in: query, required: false, schema: {type: boolean}}
        - {name: tag, in: query, required: false, schema: {type: string, maxLength: 100}}
        - {name: sort, in: query, required: false, schema: {type: string, enum: [name, added, albums, size], default: name}}
        - {name: desc, in: query, required: false, schema: {type: boolean, default: false}}
        - {name: offset, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
      responses:
        "200":
          description: A page of artists
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ArtistList"}
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: addArtist
      summary: Add an artist from MusicBrainz with the albums its metadata profile wants (library managers)
      description: Albums appear at once; editions and track lists load in the background (MusicBrainz allows one request per second).
      tags: [music]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AddArtistRequest"}
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Artist"}
        default:
          $ref: "#/components/responses/Error"
  /music/discover/artists:
    get:
      operationId: listArtistSuggestions
      summary: Artists similar to the library's (library managers and people who may request music)
      description: >-
        Suggestions combine the stored answers of every active provider (Last.fm, ListenBrainz, MusicBrainz relationships,
        Spotify where Spotify allows it) and leave out artists in the library and those marked not interested. People who
        only request see the same list with their request state and without library ids.
      tags: [music]
      parameters:
        - name: seed
          in: query
          required: false
          description: Library artists (MusicBrainz ids) to start from; empty = all.
          style: form
          explode: false
          schema:
            type: array
            maxItems: 200
            items: {type: string, pattern: "^[0-9a-fA-F-]{36}$"}
        - name: tag
          in: query
          required: false
          schema: {type: string, maxLength: 100}
        - name: minScore
          in: query
          required: false
          schema: {type: integer, minimum: 0, maximum: 100}
        - name: provider
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            maxItems: 4
            items: {$ref: "#/components/schemas/MusicDiscoveryProviderId"}
        - name: offset
          in: query
          required: false
          schema: {type: integer, minimum: 0, maximum: 100000}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100}
      responses:
        "200":
          description: Suggestions
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ArtistSuggestionList"}
        default:
          $ref: "#/components/responses/Error"
  /music/discover/refresh:
    post:
      operationId: refreshArtistSuggestions
      summary: Ask the providers again in the background (library managers)
      description: Without artists, asks about the artists whose answers are missing or old; with artists, about those, even when fresh.
      tags: [music]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                seeds:
                  type: array
                  maxItems: 200
                  items: {type: string, pattern: "^[0-9a-fA-F-]{36}$"}
      responses:
        "202":
