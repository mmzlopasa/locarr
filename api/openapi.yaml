        olderPriority:
          $ref: "#/components/schemas/QueuePriority"
        initialState:
          type: string
          enum: [start, pause]
        removeCompleted: {type: boolean}
        sequential: {type: boolean}
        firstLastPiece: {type: boolean}
        tags:
          type: array
          items: {type: string}
        status:
          $ref: "#/components/schemas/DownloadClientStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
