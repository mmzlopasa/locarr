      operationId: translateItemSubtitles
      summary: Machine-translate missing subtitles of a movie or episode now (managers)
      description: |
        Queues a translation of every missing language (or only `keys`, which may also name a language outside the profile)
        from the best subtitle in another language. Progress shows in the item's `translations`; the result lands on the timeline.
      tags: [subtitles]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                keys:
                  type: array
                  maxItems: 20
                  items: {type: string, maxLength: 20}
                translator: {type: string, maxLength: 40}
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SubtitleCount"}
        default:
          $ref: "#/components/responses/Error"
