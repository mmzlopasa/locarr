      tags: [downloadclients]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadClient"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateDownloadClient
      summary: Replace a download client's settings (administrators)
      description: Leave `password` / `apiKey` out to keep them; send "" to clear.
      tags: [downloadclients]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadClientInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadClient"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteDownloadClient
      summary: Remove a download client (administrators)
      description: Nothing in the client is touched; its downloads stay in the history.
      tags: [downloadclients]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /downloadclients/{id}/categories:
    post:
      operationId: createDownloadClientCategories
      summary: Create the client's missing categories (administrators)
      tags: [downloadclients]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Categories that now exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedCategories"
        default:
          $ref: "#/components/responses/Error"
  /remotepathmappings:
    get:
      operationId: listRemotePathMappings
      summary: Remote path mappings (administrators)
      tags: [remotepathmappings]
      responses:
        "200":
          description: Mappings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RemotePathMapping"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createRemotePathMapping
      summary: Add a remote path mapping (administrators)
      description: The local path must lie inside the allowed data roots.
      tags: [remotepathmappings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemotePathMappingInput"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemotePathMapping"
        default:
          $ref: "#/components/responses/Error"
  /remotepathmappings/suggestions:
    get:
      operationId: listRemotePathMappingSuggestions
      summary: Mappings Locarr suggests (administrators)
      description: |
        From finished downloads whose path the client reports but Locarr cannot see, found
        again inside the data roots by name and size, and from client folders Locarr
        cannot see. Nothing is added until the user adds it.
      tags: [remotepathmappings]
      responses:
        "200":
          description: Suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PathMappingSuggestion"
        default:
          $ref: "#/components/responses/Error"
  /remotepathmappings/{id}:
    put:
      operationId: updateRemotePathMapping
      summary: Replace a remote path mapping (administrators)
      tags: [remotepathmappings]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemotePathMappingInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemotePathMapping"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteRemotePathMapping
      summary: Remove a remote path mapping (administrators)
      tags: [remotepathmappings]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /queue:
    get:
      operationId: getQueue
      summary: The download queue with live progress (library managers)
      description: |
        Tracked downloads that are still in a client, plus items other programs put in
        Locarr's categories (`unknown`: shown, never touched). Asking for the queue
        makes the tracker poll every few seconds for a short while.
      tags: [queue]
      parameters:
        - name: includeUnknown
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Queue"
        default:
          $ref: "#/components/responses/Error"
  /queue/refresh:
    post:
      operationId: refreshQueue
      summary: Poll every client now (library managers)
      tags: [queue]
      responses:
        "202":
          description: Polling
        default:
          $ref: "#/components/responses/Error"
  /queue/grab:
    post:
      operationId: grabRelease
      summary: Send a release to a download client (library managers)
      description: |
        The server fetches the .torrent / .nzb itself (size cap, timeout, no
        redirects to another host, no link-local or metadata addresses); magnet
        links go to the client directly. The client is chosen by protocol, tags
        and priority unless `clientId` is given. Errors: `no_download_client`,
        `already_queued`, `fetch_failed`, and the client errors of the test action.
      tags: [queue]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrabRequest"
      responses:
        "201":
          description: Sent to the client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueItem"
        default:
          $ref: "#/components/responses/Error"
  /queue/blocklist:
    get:
      operationId: listBlocklist
      summary: Blocked releases (library managers)
      tags: [queue]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 500
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlocklistEntry"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: addBlocklistEntry
      summary: Block a release (library managers)
      tags: [queue]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlocklistInput"
      responses:
        "201":
          description: Blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlocklistEntry"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: clearBlocklist
      summary: Unblock every release (library managers)
      tags: [queue]
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BlocklistCleared"}
        default:
          $ref: "#/components/responses/Error"
  /queue/blocklist/{id}:
    delete:
      operationId: deleteBlocklistEntry
      summary: Unblock a release (library managers)
      tags: [queue]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /queue/{id}:
    delete:
      operationId: removeQueueItem
      summary: Remove a download from its client (library managers)
      description: |
        `deleteData` also deletes the downloaded files (by the client, or by Locarr
        inside the data roots when the client cannot). `blocklist` blocks the release.
      tags: [queue]
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: deleteData
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: blocklist
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: reason
          in: query
          required: false
          schema:
            type: string
            maxLength: 500
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /queue/{id}/pause:
    post:
      operationId: pauseQueueItem
      summary: Pause a download (library managers)
      tags: [queue]
      parameters:
