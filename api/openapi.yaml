        protocol:
          $ref: "#/components/schemas/DownloadProtocol"
        defaultPort: {type: integer}
        defaultUrlBase: {type: string}
        defaultUsername: {type: string}
        fields:
          type: array
          items:
            $ref: "#/components/schemas/DownloadClientField"
        required:
          type: array
          items:
            $ref: "#/components/schemas/DownloadClientField"
        capabilities:
          $ref: "#/components/schemas/DownloadClientCapabilities"
    DownloadClientCategories:
      type: object
      required: [movies, series, music]
      properties:
        movies:
