openapi: 3.1.0
info:
  title: Locarr API
  version: 0.1.0
  description: |
    Locarr API. This file is the single source of truth: the server interfaces (ogen)
    and the web client types (openapi-typescript) are generated from it by
    `scripts/gen-api.sh`.

    Authentication: `Authorization: Bearer <token>` with a session token (from
    `/auth/login` or `/setup`) or an API key (`lk_…`). API keys may also be sent as
    `X-Api-Key`. The web client uses the HttpOnly `locarr_session` cookie instead
    (`useCookie: true`). Read-only API keys may only call `GET` operations.

    Every error under `/api` is JSON: `{"code": "...", "message": "..."}`. `code`
    is stable and meant for clients; `message` is English text for logs.
servers:
  - url: /api/v1
tags:
  - name: system
  - name: setup
  - name: auth
  - name: sessions
  - name: apikeys
  - name: twofactor
  - name: users
  - name: settings
  - name: rootfolders
  - name: filesystem
  - name: downloadclients
  - name: remotepathmappings
  - name: queue
security:
  - sessionToken: []
paths:
  /system/info:
    get:
      operationId: getSystemInfo
      summary: Public server information
      description: Unauthenticated. Clients use it to check a server address and whether first-run setup is needed.
      tags: [system]
      security: []
      responses:
        "200":
          description: Server information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
        default:
          $ref: "#/components/responses/Error"
  /system/status:
    get:
      operationId: getSystemStatus
      summary: Runtime status (administrators)
      tags: [system]
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        default:
          $ref: "#/components/responses/Error"
  /system/tasks:
    get:
      operationId: listTasks
      summary: Scheduled tasks and recent job history (administrators)
      tags: [system]
      parameters:
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/JobState"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        default:
          $ref: "#/components/responses/Error"
  /system/tasks/{name}/run:
    post:
      operationId: runTask
      summary: Run a scheduled task now (administrators)
      description: Queues the task unless a run of it is already queued or running; then that run is returned.
      tags: [system]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
      responses:
        "202":
          description: Queued (or already queued)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        default:
          $ref: "#/components/responses/Error"
  /system/jobs/{id}/cancel:
    post:
      operationId: cancelJob
      summary: Cancel a queued or running job (administrators)
      tags: [system]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Cancelled (a running job stops at its next check)
        default:
          $ref: "#/components/responses/Error"
  /setup:
    post:
      operationId: setup
      summary: Create the first administrator
      description: |
        Only works while no administrator exists. Needs the setup code the server
        prints to its log on start. Signs the new administrator in.
      tags: [setup]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        default:
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      operationId: login
      summary: Sign in
      description: |
        When the account has two-factor authentication on and neither `totpCode` nor
        `recoveryCode` is given, the answer is 401 with code `totp_required`; send the
        same request again with a code.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        default:
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      tags: [auth]
      responses:
        "204":
          description: Signed out
          headers:
            Set-Cookie:
              description: Clears the web session cookie.
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /auth/me:
    get:
      operationId: getMe
      summary: The signed-in user
      tags: [auth]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateMe
      summary: Change own preferences
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
  /auth/password:
    post:
      operationId: changePassword
      summary: Change own password
      description: Signs out every other session of the account; the current one stays.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Changed
        default:
          $ref: "#/components/responses/Error"
  /auth/sessions:
    get:
      operationId: listSessions
      summary: Own signed-in devices
      tags: [sessions]
      responses:
        "200":
          description: Sessions, most recently used first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      summary: Sign out a device
      tags: [sessions]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Revoked
        default:
          $ref: "#/components/responses/Error"
  /auth/apikeys:
    get:
      operationId: listApiKeys
      summary: Own API keys
      tags: [apikeys]
      responses:
        "200":
          description: API keys (never the key itself)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createApiKey
      summary: Create an API key
      description: The key is returned once and cannot be shown again. Needs a session (not an API key).
      tags: [apikeys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiKey"
        default:
          $ref: "#/components/responses/Error"
  /auth/apikeys/{id}:
    delete:
      operationId: deleteApiKey
      summary: Revoke an API key
      tags: [apikeys]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Revoked
        default:
          $ref: "#/components/responses/Error"
  /auth/totp/setup:
    post:
      operationId: startTotpSetup
      summary: Start two-factor setup
      description: Returns a new secret to add to an authenticator app. Two-factor is on only after `/auth/totp/enable`.
      tags: [twofactor]
      responses:
        "200":
          description: Secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpSetup"
        default:
          $ref: "#/components/responses/Error"
  /auth/totp/enable:
    post:
      operationId: enableTotp
      summary: Confirm two-factor setup with a code
      tags: [twofactor]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCodeRequest"
      responses:
        "200":
          description: Two-factor is on; recovery codes are shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        default:
          $ref: "#/components/responses/Error"
  /auth/totp/disable:
    post:
      operationId: disableTotp
      summary: Turn two-factor off
      tags: [twofactor]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirm"
      responses:
        "204":
          description: Two-factor is off
        default:
          $ref: "#/components/responses/Error"
  /auth/totp/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      summary: Replace the recovery codes
      tags: [twofactor]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirm"
      responses:
        "200":
          description: New recovery codes (the old ones stop working)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        default:
          $ref: "#/components/responses/Error"
  /users:
    get:
      operationId: listUsers
      summary: All users (administrators)
      tags: [users]
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createUser
      summary: Create a user (administrators)
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
  /users/{id}:
    get:
      operationId: getUser
      summary: One user (administrators)
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateUser
      summary: Change role, permissions or disable a user (administrators)
      description: The last enabled administrator cannot be demoted or disabled.
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteUser
      summary: Delete a user (administrators)
      description: Not the caller's own account and not the last enabled administrator.
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
  /users/{id}/password:
    post:
      operationId: resetUserPassword
      summary: Set a user's password (administrators)
      description: Signs the user out everywhere and clears an account lockout.
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password set
        default:
          $ref: "#/components/responses/Error"
  /settings:
    get:
      operationId: getSettings
      summary: Server settings (administrators)
      description: Secret fields only say whether they are set; their values never leave the server.
      tags: [settings]
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateSettings
      summary: Change server settings (administrators)
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequest"
      responses:
        "200":
          description: Settings after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        default:
          $ref: "#/components/responses/Error"
  /rootfolders:
    get:
      operationId: listRootFolders
      summary: Root folders with free space (administrators)
      tags: [rootfolders]
      responses:
        "200":
          description: Root folders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RootFolder"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createRootFolder
      summary: Add a root folder (administrators)
      description: The folder must exist inside one of the allowed data roots (`LOCARR_DATA_ROOTS`).
      tags: [rootfolders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRootFolderRequest"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootFolder"
        default:
          $ref: "#/components/responses/Error"
  /rootfolders/{id}:
    delete:
      operationId: deleteRootFolder
      summary: Remove a root folder (administrators)
      description: Only forgets the folder; nothing on disk is touched.
      tags: [rootfolders]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /filesystem:
    get:
      operationId: browseFilesystem
      summary: List folders inside the allowed data roots (administrators)
      description: Without `path`, lists the data roots themselves.
      tags: [filesystem]
      parameters:
        - name: path
          in: query
          required: false
          schema:
            type: string
            maxLength: 4096
      responses:
        "200":
          description: Folders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderListing"
        default:
          $ref: "#/components/responses/Error"
  /downloadclients:
    get:
      operationId: listDownloadClients
      summary: Download clients with their last status (administrators)
      tags: [downloadclients]
      responses:
        "200":
          description: Clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DownloadClient"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createDownloadClient
      summary: Add a download client (administrators)
      tags: [downloadclients]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadClientInput"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadClient"
        default:
          $ref: "#/components/responses/Error"
  /downloadclients/implementations:
    get:
      operationId: listDownloadClientImplementations
      summary: Supported clients, the fields each needs and what each can do (administrators)
      tags: [downloadclients]
      responses:
        "200":
          description: Implementations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DownloadClientImplementation"
        default:
          $ref: "#/components/responses/Error"
  /downloadclients/test:
    post:
      operationId: testDownloadClient
      summary: Test a client configuration (administrators)
      description: |
        Always answers 200 with the outcome. With `id`, password and API key left out
        are taken from that stored client. `errorCode` is one of `auth_failed`,
        `unreachable`, `tls_untrusted`, `wrong_url`, `address_blocked`, `client_error`,
        `unsupported`, `invalid` or `category_missing` (then `ok` is true and
        `missingCategories` lists them).
      tags: [downloadclients]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadClientTestRequest"
      responses:
        "200":
          description: Outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadClientTestResult"
        default:
          $ref: "#/components/responses/Error"
  /downloadclients/settings:
    get:
      operationId: getDownloadSettings
      summary: Download tracking settings (administrators)
      tags: [downloadclients]
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadSettings"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateDownloadSettings
      summary: Change download tracking settings (administrators)
      tags: [downloadclients]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDownloadSettings"
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadSettings"
        default:
          $ref: "#/components/responses/Error"
  /downloadclients/{id}:
    get:
      operationId: getDownloadClient
      summary: One download client (administrators)
      tags: [downloadclients]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadClient"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateDownloadClient
      summary: Replace a download client's settings (administrators)
      description: Leave `password` / `apiKey` out to keep them; send "" to clear.
      tags: [downloadclients]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadClientInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadClient"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteDownloadClient
      summary: Remove a download client (administrators)
      description: Nothing in the client is touched; its downloads stay in the history.
      tags: [downloadclients]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /downloadclients/{id}/categories:
    post:
      operationId: createDownloadClientCategories
      summary: Create the client's missing categories (administrators)
      tags: [downloadclients]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Categories that now exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedCategories"
        default:
          $ref: "#/components/responses/Error"
  /remotepathmappings:
    get:
      operationId: listRemotePathMappings
      summary: Remote path mappings (administrators)
      tags: [remotepathmappings]
      responses:
        "200":
          description: Mappings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RemotePathMapping"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createRemotePathMapping
      summary: Add a remote path mapping (administrators)
      description: The local path must lie inside the allowed data roots.
      tags: [remotepathmappings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemotePathMappingInput"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemotePathMapping"
        default:
          $ref: "#/components/responses/Error"
  /remotepathmappings/{id}:
    put:
      operationId: updateRemotePathMapping
      summary: Replace a remote path mapping (administrators)
      tags: [remotepathmappings]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemotePathMappingInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemotePathMapping"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteRemotePathMapping
      summary: Remove a remote path mapping (administrators)
      tags: [remotepathmappings]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /queue:
    get:
      operationId: getQueue
      summary: The download queue with live progress (library managers)
      description: |
        Tracked downloads that are still in a client, plus items other programs put in
        Locarr's categories (`unknown`: shown, never touched). Asking for the queue
        makes the tracker poll every few seconds for a short while.
      tags: [queue]
      parameters:
        - name: includeUnknown
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Queue"
        default:
          $ref: "#/components/responses/Error"
  /queue/refresh:
    post:
      operationId: refreshQueue
      summary: Poll every client now (library managers)
      tags: [queue]
      responses:
        "202":
          description: Polling
        default:
          $ref: "#/components/responses/Error"
  /queue/grab:
    post:
      operationId: grabRelease
      summary: Send a release to a download client (library managers)
      description: |
        The server fetches the .torrent / .nzb itself (size cap, timeout, no
        redirects to another host, no link-local or metadata addresses); magnet
        links go to the client directly. The client is chosen by protocol, tags
        and priority unless `clientId` is given. Errors: `no_download_client`,
        `already_queued`, `fetch_failed`, and the client errors of the test action.
      tags: [queue]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrabRequest"
      responses:
        "201":
          description: Sent to the client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueItem"
        default:
          $ref: "#/components/responses/Error"
  /queue/blocklist:
    get:
      operationId: listBlocklist
      summary: Blocked releases (library managers)
      tags: [queue]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 500
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlocklistEntry"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: addBlocklistEntry
      summary: Block a release (library managers)
      tags: [queue]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlocklistInput"
      responses:
        "201":
          description: Blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlocklistEntry"
        default:
          $ref: "#/components/responses/Error"
  /queue/blocklist/{id}:
    delete:
      operationId: deleteBlocklistEntry
      summary: Unblock a release (library managers)
      tags: [queue]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /queue/{id}:
    delete:
      operationId: removeQueueItem
      summary: Remove a download from its client (library managers)
      description: |
        `deleteData` also deletes the downloaded files (by the client, or by Locarr
        inside the data roots when the client cannot). `blocklist` blocks the release.
      tags: [queue]
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: deleteData
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: blocklist
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: reason
          in: query
          required: false
          schema:
            type: string
            maxLength: 500
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /queue/{id}/pause:
    post:
      operationId: pauseQueueItem
      summary: Pause a download (library managers)
      tags: [queue]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Paused
        default:
          $ref: "#/components/responses/Error"
  /queue/{id}/resume:
    post:
      operationId: resumeQueueItem
      summary: Resume a download (library managers)
      tags: [queue]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Resumed
        default:
          $ref: "#/components/responses/Error"
  /queue/{id}/priority:
    post:
      operationId: setQueueItemPriority
      summary: Move a download in its client's queue (library managers)
      tags: [queue]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriorityRequest"
      responses:
        "204":
          description: Moved
        default:
          $ref: "#/components/responses/Error"
  /queue/{id}/events:
    get:
      operationId: listQueueItemEvents
      summary: State history of one download (library managers)
      tags: [queue]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Events, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DownloadEvent"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      description: |
        A session token from /auth/login or /setup, or an API key (`lk_…`). The web client's
        HttpOnly `locarr_session` cookie and the `X-Api-Key` header are accepted too.
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    SignedIn:
      description: Signed in
      headers:
        Set-Cookie:
          description: HttpOnly session cookie, only when useCookie was requested.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthResult"
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code, e.g. `invalid_credentials`, `totp_required`, `forbidden`.
        message:
          type: string
    Language:
      type: string
      enum: [en, hr]
    Role:
      type: string
      enum: [admin, manager, requester]
      description: |
        `admin` can do everything. `manager` manages the library and requests (as its
        permissions allow). `requester` only asks for titles.
    Username:
      type: string
      minLength: 1
      maxLength: 64
      description: Case-insensitive; letters, digits, space and . _ - @
    Password:
      type: string
      minLength: 8
      maxLength: 256
    SystemInfo:
      type: object
      required: [product, instanceName, version, commit, startedAt, setupRequired]
      properties:
        product:
          type: string
        instanceName:
          type: string
        version:
          type: string
        commit:
          type: string
        startedAt:
          type: string
          format: date-time
        setupRequired:
          type: boolean
          description: True while no administrator exists.
    SystemStatus:
      type: object
      required: [version, commit, goVersion, os, arch, startedAt, uptimeSeconds, configDir, databaseSizeBytes, dataRoots]
      properties:
        version:
          type: string
        commit:
          type: string
        goVersion:
          type: string
        os:
          type: string
        arch:
          type: string
        startedAt:
          type: string
          format: date-time
        uptimeSeconds:
          type: integer
          format: int64
        configDir:
          type: string
        databaseSizeBytes:
          type: integer
          format: int64
          description: Database file plus its write-ahead log.
        dataRoots:
          type: array
          items:
            type: string
    JobState:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    Job:
      type: object
      required: [id, kind, queue, state, attempt, maxAttempts, runAt, createdAt]
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
        queue:
          type: string
        state:
          $ref: "#/components/schemas/JobState"
        attempt:
          type: integer
        maxAttempts:
          type: integer
        runAt:
          type: string
          format: date-time
          description: When a queued job is due (for a retry, after its backoff).
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        error:
          type: string
          description: The last error, if any attempt failed.
        uniqueKey:
          type: string
    ScheduledTask:
      type: object
      required: [name, kind, intervalSeconds, nextRunAt]
      properties:
        name:
          type: string
        kind:
          type: string
        intervalSeconds:
          type: integer
          format: int64
        nextRunAt:
          type: string
          format: date-time
        lastRunAt:
          type: string
          format: date-time
        lastState:
          $ref: "#/components/schemas/JobState"
    TaskList:
      type: object
      required: [scheduled, jobs]
      properties:
        scheduled:
          type: array
          items:
            $ref: "#/components/schemas/ScheduledTask"
        jobs:
          type: array
          description: Most recent first.
          items:
            $ref: "#/components/schemas/Job"
    DeviceInfo:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        client:
          type: string
          maxLength: 100
    SetupRequest:
      type: object
      required: [setupCode, username, password]
      properties:
        setupCode:
          type: string
          maxLength: 64
        username:
          $ref: "#/components/schemas/Username"
        password:
          $ref: "#/components/schemas/Password"
        language:
          $ref: "#/components/schemas/Language"
        instanceName:
          type: string
          maxLength: 100
        device:
          $ref: "#/components/schemas/DeviceInfo"
        useCookie:
          type: boolean
          description: Web clients set this to get the HttpOnly cookie instead of a token in the body.
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 64
        password:
          type: string
          maxLength: 256
        totpCode:
          type: string
          maxLength: 16
        recoveryCode:
          type: string
          maxLength: 32
        device:
          $ref: "#/components/schemas/DeviceInfo"
        useCookie:
          type: boolean
    AuthResult:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
          description: The session token, only when useCookie was not requested.
    Permissions:
      type: object
      description: What a non-administrator may do. Administrators may do everything regardless.
      required: [requestMovies, requestSeries, requestMusic, autoApprove, request4k, manageLibrary, manageRequests]
      properties:
        requestMovies:
          type: boolean
        requestSeries:
          type: boolean
        requestMusic:
          type: boolean
        autoApprove:
          type: boolean
          description: Requests are approved without an administrator.
        request4k:
          type: boolean
        manageLibrary:
          type: boolean
          description: Add, edit and search titles.
        manageRequests:
          type: boolean
          description: Approve and decline other users' requests.
    User:
      type: object
      required: [id, username, role, permissions, language, disabled, totpEnabled, createdAt]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        permissions:
          $ref: "#/components/schemas/Permissions"
        language:
          $ref: "#/components/schemas/Language"
        disabled:
          type: boolean
        totpEnabled:
          type: boolean
        lockedUntil:
          type: string
          format: date-time
          description: Set while the account is locked after failed sign-ins.
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
    UpdateMeRequest:
      type: object
      properties:
        language:
          $ref: "#/components/schemas/Language"
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          maxLength: 256
        newPassword:
          $ref: "#/components/schemas/Password"
    Session:
      type: object
      required: [id, deviceName, client, ip, createdAt, lastSeenAt, current]
      properties:
        id:
          type: integer
          format: int64
        deviceName:
          type: string
        client:
          type: string
        ip:
          type: string
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        current:
          type: boolean
    ApiKey:
      type: object
      required: [id, name, prefix, readOnly, createdAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        prefix:
          type: string
          description: The first characters of the key, to recognise it.
        readOnly:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
    CreateApiKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        readOnly:
          type: boolean
    CreatedApiKey:
      type: object
      required: [apiKey, key]
      properties:
        apiKey:
          $ref: "#/components/schemas/ApiKey"
        key:
          type: string
          description: Shown once.
    TotpSetup:
      type: object
      required: [secret, uri]
      properties:
        secret:
          type: string
          description: Base32, for typing into an authenticator app.
        uri:
          type: string
          description: otpauth:// URI, for a QR code.
    TotpCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          maxLength: 16
    PasswordConfirm:
      type: object
      required: [password]
      properties:
        password:
          type: string
          maxLength: 256
    RecoveryCodes:
      type: object
      required: [codes]
      properties:
        codes:
          type: array
          items:
            type: string
    CreateUserRequest:
      type: object
      required: [username, password, role]
      properties:
        username:
          $ref: "#/components/schemas/Username"
        password:
          $ref: "#/components/schemas/Password"
        role:
          $ref: "#/components/schemas/Role"
        permissions:
          $ref: "#/components/schemas/Permissions"
        language:
          $ref: "#/components/schemas/Language"
    UpdateUserRequest:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/Role"
        permissions:
          $ref: "#/components/schemas/Permissions"
        disabled:
          type: boolean
    ResetPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          $ref: "#/components/schemas/Password"
    SecretState:
      type: object
      required: [configured]
      properties:
        configured:
          type: boolean
    Settings:
      type: object
      required: [instanceName, tmdbApiKey]
      properties:
        instanceName:
          type: string
        tmdbApiKey:
          $ref: "#/components/schemas/SecretState"
    UpdateSettingsRequest:
      type: object
      properties:
        instanceName:
          type: string
          minLength: 1
          maxLength: 100
        tmdbApiKey:
          type: string
          maxLength: 512
          description: Write-only. An empty string removes the stored key.
    MediaKind:
      type: string
      enum: [movies, series, music]
    RootFolder:
      type: object
      required: [id, path, kind, accessible, writable, createdAt]
      properties:
        id:
          type: integer
          format: int64
        path:
          type: string
        kind:
          $ref: "#/components/schemas/MediaKind"
        accessible:
          type: boolean
          description: The folder exists and can be listed.
        writable:
          type: boolean
        freeSpaceBytes:
          type: integer
          format: int64
        totalSpaceBytes:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    CreateRootFolderRequest:
      type: object
      required: [path, kind]
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 4096
        kind:
          $ref: "#/components/schemas/MediaKind"
    FolderEntry:
      type: object
      required: [name, path]
      properties:
        name:
          type: string
        path:
          type: string
    FolderListing:
      type: object
      required: [entries]
      properties:
        path:
          type: string
          description: The listed folder; absent when the data roots are listed.
        parent:
          type: string
          description: The folder above, when it is still inside a data root.
        entries:
          type: array
          items:
            $ref: "#/components/schemas/FolderEntry"
    DownloadProtocol:
      type: string
      enum: [torrent, usenet]
    DownloadState:
      type: string
      description: The client's state, normalised (the raw one is in `rawState`).
      enum: [queued, downloading, paused, seeding, completed, failed, warning]
    DownloadStatus:
      type: string
      description: |
        Where the download is in Locarr: `active` (in the client), `completed`
        (finished and visible locally: ready to import), `imported`, `failed`, `removed`.
      enum: [active, completed, imported, failed, removed]
    QueuePriority:
      type: string
      enum: [normal, top, last]
    DownloadClientField:
      type: string
      enum: [host, port, useTls, urlBase, username, password, apiKey, directory, allowSelfSigned]
    DownloadClientCapabilities:
      type: object
      required: [categories, createCategories, directoryCategories, tags, seedLimits, sequential, firstLastPiece, priority, savePath, freeSpace, deletesData]
      properties:
        categories: {type: boolean}
        createCategories: {type: boolean}
        directoryCategories:
          type: boolean
          description: No categories in the client; each category is a sub-folder of the download folder.
        tags: {type: boolean}
        seedLimits: {type: boolean}
        sequential: {type: boolean}
        firstLastPiece: {type: boolean}
        priority: {type: boolean}
        savePath: {type: boolean}
        freeSpace: {type: boolean}
        deletesData: {type: boolean}
    DownloadClientImplementation:
      type: object
      required: [name, displayName, protocol, defaultPort, defaultUrlBase, defaultUsername, fields, required, capabilities]
      properties:
        name: {type: string}
        displayName: {type: string}
        protocol:
          $ref: "#/components/schemas/DownloadProtocol"
        defaultPort: {type: integer}
        defaultUrlBase: {type: string}
        defaultUsername: {type: string}
        fields:
          type: array
          items:
            $ref: "#/components/schemas/DownloadClientField"
        required:
          type: array
          items:
            $ref: "#/components/schemas/DownloadClientField"
        capabilities:
          $ref: "#/components/schemas/DownloadClientCapabilities"
    DownloadClientCategories:
      type: object
      required: [movies, series, music]
      properties:
        movies:
          type: string
          maxLength: 64
        series:
          type: string
          maxLength: 64
        music:
          type: string
          maxLength: 64
    DownloadClientStatus:
      type: object
      required: [ok]
      description: The last poll. Absent `checkedAt` = not polled yet (or disabled).
      properties:
        ok: {type: boolean}
        checkedAt:
          type: string
          format: date-time
        errorCode: {type: string}
        error: {type: string}
        version: {type: string}
        freeSpaceBytes:
          type: integer
          format: int64
    DownloadClient:
      type: object
      required: [id, name, implementation, protocol, enabled, priority, host, port, useTls, allowSelfSigned, urlBase, username,
        password, apiKey, directory, categories, recentPriority, olderPriority, initialState, removeCompleted, sequential,
        firstLastPiece, tags, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        name: {type: string}
        implementation: {type: string}
        protocol:
          $ref: "#/components/schemas/DownloadProtocol"
        enabled: {type: boolean}
        priority: {type: integer}
        host: {type: string}
        port: {type: integer}
        useTls: {type: boolean}
        allowSelfSigned: {type: boolean}
        urlBase: {type: string}
        username: {type: string}
        password:
          $ref: "#/components/schemas/SecretState"
        apiKey:
          $ref: "#/components/schemas/SecretState"
        directory: {type: string}
        categories:
          $ref: "#/components/schemas/DownloadClientCategories"
        recentPriority:
          $ref: "#/components/schemas/QueuePriority"
        olderPriority:
          $ref: "#/components/schemas/QueuePriority"
        initialState:
          type: string
          enum: [start, pause]
        removeCompleted: {type: boolean}
        sequential: {type: boolean}
        firstLastPiece: {type: boolean}
        tags:
          type: array
          items: {type: string}
        status:
          $ref: "#/components/schemas/DownloadClientStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DownloadClientInput:
      type: object
      required: [name, implementation, host]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        implementation:
          type: string
          maxLength: 32
        enabled:
          type: boolean
          default: true
        priority:
          type: integer
          minimum: 1
          maximum: 50
          default: 1
        host:
          type: string
          minLength: 1
          maxLength: 253
        port:
          type: integer
          minimum: 1
          maximum: 65535
        useTls:
          type: boolean
          default: false
        allowSelfSigned:
          type: boolean
          default: false
        urlBase:
          type: string
          maxLength: 200
        username:
          type: string
          maxLength: 200
        password:
          type: string
          maxLength: 500
          description: Write-only. Omit to keep, "" to clear.
        apiKey:
          type: string
          maxLength: 500
          description: Write-only. Omit to keep, "" to clear.
        directory:
          type: string
          maxLength: 4096
        categories:
          $ref: "#/components/schemas/DownloadClientCategories"
        recentPriority:
          $ref: "#/components/schemas/QueuePriority"
        olderPriority:
          $ref: "#/components/schemas/QueuePriority"
        initialState:
          type: string
          enum: [start, pause]
        removeCompleted:
          type: boolean
          default: false
        sequential:
          type: boolean
          default: false
        firstLastPiece:
          type: boolean
          default: false
        tags:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 50
    DownloadClientTestRequest:
      type: object
      required: [client]
      properties:
        id:
          type: integer
          format: int64
          description: A stored client whose password / API key are used when left out.
        client:
          $ref: "#/components/schemas/DownloadClientInput"
    DownloadClientTestResult:
      type: object
      required: [ok, missingCategories, canCreateCategories]
      properties:
        ok: {type: boolean}
        errorCode: {type: string}
        message: {type: string}
        version: {type: string}
        freeSpaceBytes:
          type: integer
          format: int64
        missingCategories:
          type: array
          items: {type: string}
        canCreateCategories: {type: boolean}
    CreatedCategories:
      type: object
      required: [categories]
      properties:
        categories:
          type: array
          items: {type: string}
    DownloadSettings:
      type: object
      required: [pollSeconds, stalledHours]
      properties:
        pollSeconds:
          type: integer
          description: How often clients are polled (faster while the queue is open).
        stalledHours:
          type: integer
          description: A torrent with no progress and no seeds for this long fails (0 = never).
    UpdateDownloadSettings:
      type: object
      properties:
        pollSeconds:
          type: integer
          minimum: 10
          maximum: 3600
        stalledHours:
          type: integer
          minimum: 0
          maximum: 720
    RemotePathMapping:
      type: object
      required: [id, host, remotePath, localPath]
      properties:
        id:
          type: integer
          format: int64
        host: {type: string}
        remotePath: {type: string}
        localPath: {type: string}
    RemotePathMappingInput:
      type: object
      required: [host, remotePath, localPath]
      properties:
        host:
          type: string
          minLength: 1
          maxLength: 253
        remotePath:
          type: string
          minLength: 1
          maxLength: 4096
        localPath:
          type: string
          minLength: 1
          maxLength: 4096
    QueueItem:
      type: object
      required: [id, unknown, clientName, clientItemId, protocol, title, status, state, rawState, progress, sizeBytes,
        downloadedBytes, downloadSpeed, uploadSpeed, ratio, seedingSeconds, category, message, addedAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
          description: 0 for unknown items (added outside Locarr).
        unknown: {type: boolean}
        clientId:
          type: integer
          format: int64
        clientName: {type: string}
        clientItemId: {type: string}
        protocol:
          $ref: "#/components/schemas/DownloadProtocol"
        title: {type: string}
        indexer: {type: string}
        mediaKind: {type: string}
        category: {type: string}
        status:
          $ref: "#/components/schemas/DownloadStatus"
        state:
          $ref: "#/components/schemas/DownloadState"
        rawState: {type: string}
        progress:
          type: number
          format: double
        sizeBytes:
          type: integer
          format: int64
        downloadedBytes:
          type: integer
          format: int64
        downloadSpeed:
          type: integer
          format: int64
        uploadSpeed:
          type: integer
          format: int64
        etaSeconds:
          type: integer
          format: int64
        ratio:
          type: number
          format: double
        seedingSeconds:
          type: integer
          format: int64
        contentPath: {type: string}
        localPath: {type: string}
        message: {type: string}
        itemRef:
          description: Opaque JSON from whoever grabbed the release.
        addedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    QueueClient:
      type: object
      required: [id, name, protocol, enabled, status]
      properties:
        id:
          type: integer
          format: int64
        name: {type: string}
        protocol:
          $ref: "#/components/schemas/DownloadProtocol"
        enabled: {type: boolean}
        canPrioritise: {type: boolean}
        status:
          $ref: "#/components/schemas/DownloadClientStatus"
    Queue:
      type: object
      required: [items, clients]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/QueueItem"
        clients:
          type: array
          items:
            $ref: "#/components/schemas/QueueClient"
    GrabRequest:
      type: object
      required: [downloadUrl, protocol, title]
      properties:
        downloadUrl:
          type: string
          minLength: 1
          maxLength: 8192
          description: An http(s) link to a .torrent or .nzb, or a magnet link.
        protocol:
          $ref: "#/components/schemas/DownloadProtocol"
        title:
          type: string
          minLength: 1
          maxLength: 500
        indexerId:
          type: integer
          format: int64
        indexer:
          type: string
          maxLength: 200
        guid:
          type: string
          maxLength: 2000
        mediaKind:
          $ref: "#/components/schemas/MediaKind"
        itemRef:
