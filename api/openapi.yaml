      operationId: listWantedSubtitles
      summary: Movies and episodes missing subtitles of their profile (managers)
      tags: [subtitles]
      parameters:
        - name: kind
          in: query
          required: false
          schema: {type: string, enum: [movie, episode]}
        - name: offset
          in: query
          required: false
          schema: {type: integer, minimum: 0, default: 0}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
      responses:
        "200":
          description: Missing subtitles
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WantedSubtitles"}
        default:
          $ref: "#/components/responses/Error"
  /subtitles/wanted/search:
    post:
      operationId: searchWantedSubtitles
      summary: Queue subtitle searches for items, or for every item missing subtitles (managers)
      tags: [subtitles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refs:
                  type: array
                  maxItems: 1000
                  items: {type: string, maxLength: 40}
                all: {type: boolean}
                kind: {type: string, enum: [movie, episode]}
      responses:
        "200":
          description: Queued
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SubtitleCount"}
        default:
          $ref: "#/components/responses/Error"
  /subtitles/wanted/translate:
    post:
      operationId: translateWantedSubtitles
      summary: Queue machine translations for items, or for every item missing subtitles (managers)
      tags: [subtitles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refs:
                  type: array
                  maxItems: 1000
                  items: {type: string, maxLength: 40}
                all: {type: boolean}
                kind: {type: string, enum: [movie, episode]}
                translator: {type: string, maxLength: 40}
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SubtitleCount"}
        default:
          $ref: "#/components/responses/Error"
  /subtitles/scan:
    post:
      operationId: scanSubtitles
      summary: Scan the library for subtitles on disk and embedded tracks (managers)
      tags: [subtitles]
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SubtitleCount"}
        default:
          $ref: "#/components/responses/Error"
  /subtitles/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    delete:
      operationId: deleteSubtitle
      summary: Move a subtitle file to the recycle bin (managers)
      tags: [subtitles]
      parameters:
        - name: blacklist
          in: query
          required: false
          description: Never download this subtitle for the item again.
          schema: {type: boolean, default: false}
      responses:
        "204":
          description: Moved to the recycle bin
        default:
          $ref: "#/components/responses/Error"
  /subtitles/{id}/preview:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: previewSubtitle
      summary: The first lines of a subtitle (managers)
      tags: [subtitles]
      parameters:
        - name: lines
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 200, default: 12}
      responses:
        "200":
          description: Lines
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SubtitlePreview"}
        default:
          $ref: "#/components/responses/Error"
  /subtitles/{id}/shift:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: shiftSubtitle
      summary: Move every line by an offset (managers)
      description: The previous version goes to the recycle bin.
      tags: [subtitles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [offsetMs]
              properties:
                offsetMs: {type: integer, format: int64, minimum: -3600000, maximum: 3600000}
      responses:
        "200":
          description: Shifted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Subtitle"}
        default:
          $ref: "#/components/responses/Error"
  /subtitles/{id}/fps:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: convertSubtitleFps
      summary: Convert a subtitle made for one frame rate to another (managers)
      tags: [subtitles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: {type: string, maxLength: 10, description: "Frame rate the subtitle was made for, e.g. 25"}
                to: {type: string, maxLength: 10, description: "Frame rate of the video, e.g. 23.976"}
      responses:
        "200":
          description: Converted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Subtitle"}
        default:
          $ref: "#/components/responses/Error"
  /subtitles/{id}/sync:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: syncSubtitle
      summary: Re-time a subtitle against the audio or another subtitle (managers)
      description: |
        Runs in the background; the subtitle's syncState becomes running, then done, not_confident or failed.
        reference: `audio` (the default audio track), `audio:N`, `track:N` (embedded text subtitle track N)
        or `subtitle:ID` (another subtitle of the same file). Audio and tracks need ffmpeg (`subtitle_sync_unavailable`).
      tags: [subtitles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reference: {type: string, maxLength: 40}
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Subtitle"}
        default:
          $ref: "#/components/responses/Error"
  /auth/providers/{id}/login:
    post:
      operationId: loginWithProvider
      summary: Sign in with another service's account
      description: |
        For `password` providers (Streamero): the username and password (and, when the
        service asks, `totpCode`) are checked at the service and never stored (D-068).
        A linked account signs in its Locarr user; an unknown one creates a requester
        only when the provider settings allow it, otherwise 403 `identity_not_linked`.
        Errors: 401 `invalid_credentials`, 401 `totp_required` (the password was right;
        send it again with `totpCode`), 401 `invalid_totp`, 404 `not_found` (unknown or
        disabled provider), 503 `provider_unavailable`. Rate-limited and counted towards
        the sign-in ban like `/auth/login`.
      tags: [auth]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, pattern: "^[a-z0-9-]{1,32}$"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProviderLoginRequest"}
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        default:
          $ref: "#/components/responses/Error"
  /auth/identities:
    get:
      operationId: listMyIdentities
      summary: Accounts at other services linked to the caller
      tags: [auth]
      responses:
        "200":
          description: Identities
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/LinkedIdentity"}
        default:
          $ref: "#/components/responses/Error"
  /auth/identities/{provider}:
    parameters:
      - $ref: "#/components/parameters/Provider"
    post:
      operationId: linkMyIdentity
      summary: Link the caller to their account at a provider (by signing in there)
      description: |
        Checks the credentials at the provider like a provider sign-in, then links that
        account to the caller. 409 `identity_taken` when it is linked to someone else.
        Rate-limited and counted towards the sign-in ban.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProviderCredentials"}
      responses:
        "200":
          description: Linked
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LinkedIdentity"}
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: unlinkMyIdentity
      summary: Remove the caller's link to a provider
      tags: [auth]
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /users/{id}/identities/{provider}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Provider"
    put:
      operationId: linkUserIdentity
      summary: Link a user to an account at a provider (administrators)
      description: |
        `subject` is the provider's id for the account (for Streamero: from
        `GET /mediaserver/streamero/users`). The provider's administrator flag never
        makes the user an administrator here.
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LinkIdentityRequest"}
      responses:
        "200":
          description: Linked
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LinkedIdentity"}
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: unlinkUserIdentity
      summary: Remove a user's link to a provider (administrators)
      tags: [users]
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /mediaserver/streamero:
    get:
      operationId: getStreameroSettings
      summary: The Streamero connection (administrators)
      tags: [mediaserver]
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StreameroSettings"}
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateStreameroSettings
      summary: Change the Streamero connection (administrators)
      description: Leave `apiKey` out to keep it, send "" to remove it. The key is checked before it is stored.
      tags: [mediaserver]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StreameroSettingsInput"}
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StreameroSettings"}
        default:
          $ref: "#/components/responses/Error"
  /mediaserver/streamero/test:
    post:
      operationId: testStreamero
      summary: Check a Streamero address and key (administrators)
      description: |
        Always 200 with the outcome. Without `apiKey` the stored key is used. `errorCode`
        is `unreachable`, `auth_failed`, `not_admin`, `not_streamero`, `address_blocked`
        or `invalid`.
      tags: [mediaserver]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StreameroTestRequest"}
      responses:
        "200":
          description: Outcome
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StreameroTestResult"}
        default:
          $ref: "#/components/responses/Error"
  /mediaserver/streamero/libraries:
    get:
      operationId: listStreameroLibraries
      summary: Streamero's libraries with the root folders that match them (administrators)
      tags: [mediaserver]
      responses:
        "200":
          description: Libraries
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/StreameroLibrary"}
        default:
          $ref: "#/components/responses/Error"
  /mediaserver/streamero/sync:
    post:
      operationId: syncStreamero
      summary: Refresh the list of titles Streamero already has (administrators)
      tags: [mediaserver]
      responses:
        "202":
          description: Queued
        default:
          $ref: "#/components/responses/Error"
  /mediaserver/streamero/users:
    get:
      operationId: listStreameroUsers
      summary: Streamero accounts and the Locarr users they are linked to (administrators)
      tags: [mediaserver]
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/StreameroUser"}
        default:
          $ref: "#/components/responses/Error"
  /notificationchannels:
    get:
      operationId: listNotificationChannels
      summary: Notification channels
      description: |
        Without `personal`: the channels for everyone (administrators). With
        `personal=true`: the caller's own channels (any signed-in user).
      tags: [notifications]
      parameters:
        - name: personal
          in: query
          required: false
          schema: {type: boolean}
      responses:
        "200":
          description: Channels
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/NotificationChannel"}
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createNotificationChannel
      summary: Add a channel
      description: |
        `personal: false` (administrators) sends the chosen events of everyone;
        `personal: true` sends the caller's own request and issue events. Personal
        channels of non-administrators may not use `webhook` or `apprise` and cannot
        reach private network addresses.
      tags: [notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NotificationChannelInput"}
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotificationChannel"}
        default:
          $ref: "#/components/responses/Error"
  /notificationchannels/test:
    post:
      operationId: testNotificationChannel
      summary: Send a test message through a channel configuration
      description: Always 200 with the outcome. With `id`, secrets left out are taken from that channel.
      tags: [notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NotificationChannelTestRequest"}
      responses:
        "200":
          description: Outcome
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotificationTestResult"}
        default:
          $ref: "#/components/responses/Error"
  /notificationchannels/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getNotificationChannel
      summary: One channel (its owner, or administrators for shared channels)
      tags: [notifications]
      responses:
        "200":
          description: Channel
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotificationChannel"}
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateNotificationChannel
      summary: Change a channel
      description: Secrets left out are kept; "" removes one. `personal` cannot change.
      tags: [notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NotificationChannelInput"}
      responses:
        "200":
          description: Channel
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotificationChannel"}
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteNotificationChannel
      summary: Remove a channel
      tags: [notifications]
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /settings/notifications:
    get:
      operationId: getNotificationSettings
      summary: Address for links and the mail server (administrators)
      tags: [settings]
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotificationSettings"}
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateNotificationSettings
      summary: Change the address for links and the mail server (administrators)
      description: Leave `smtp.password` out to keep it, "" to remove it.
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NotificationSettingsInput"}
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotificationSettings"}
        default:
          $ref: "#/components/responses/Error"
  /migrate/sources:
    get:
      operationId: listMigrateSources
      summary: Applications to import from (administrators)
      tags: [migrate]
      responses:
        "200":
          description: Sources
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/MigrateSource"}
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createMigrateSource
      summary: Add an application to import from (administrators)
      description: |
        The application is tested first (its public API, GET requests only; qBittorrent's
        sign-in). The API key (or qBittorrent password) is stored encrypted and never returned.
      tags: [migrate]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MigrateSourceInput"}
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MigrateSource"}
        default:
          $ref: "#/components/responses/Error"
  /migrate/sources/test:
    post:
      operationId: testMigrateSource
      summary: Test an application without saving it (administrators)
      tags: [migrate]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MigrateSourceInput"}
      responses:
        "200":
          description: Result (ok false with a code and message when it failed)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MigrateTestResult"}
        default:
          $ref: "#/components/responses/Error"
  /migrate/sources/{id}:
    put:
      operationId: updateMigrateSource
      summary: Change a source (administrators)
      description: An absent `secret` keeps the stored one.
      tags: [migrate]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MigrateSourceInput"}
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MigrateSource"}
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteMigrateSource
      summary: Forget a source (administrators)
      description: What was imported stays, and so do the import marks.
      tags: [migrate]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /migrate/sources/{id}/test:
    post:
      operationId: testSavedMigrateSource
      summary: Test a saved source again (administrators)
      tags: [migrate]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MigrateTestResult"}
        default:
          $ref: "#/components/responses/Error"
  /migrate/runs:
    get:
      operationId: listMigrateRuns
      summary: Recent imports (administrators)
      tags: [migrate]
      responses:
        "200":
          description: Runs, newest first
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/MigrateRun"}
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: startMigrateRun
      summary: Read the chosen sources and plan the import (administrators)
      description: |
        A background job reads the sources (nothing is changed on them) and builds the
        preview; poll the run until its status is `planned`.
      tags: [migrate]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MigrateOptions"}
      responses:
        "202":
          description: Started
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MigrateRun"}
        default:
          $ref: "#/components/responses/Error"
  /migrate/runs/{id}:
    get:
      operationId: getMigrateRun
      summary: One import with its progress and summary (administrators)
      tags: [migrate]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MigrateRun"}
        default:
          $ref: "#/components/responses/Error"
  /migrate/runs/{id}/plan:
    post:
      operationId: planMigrateRun
      summary: Plan again with other path mappings or conflict choices (administrators)
      tags: [migrate]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MigratePlanRequest"}
      responses:
        "200":
          description: The run with the new plan
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MigrateRun"}
        default:
          $ref: "#/components/responses/Error"
  /migrate/runs/{id}/paths:
    post:
      operationId: checkMigratePaths
      summary: Count the files Locarr finds with these path mappings (administrators)
      tags: [migrate]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pathMappings]
              properties:
                pathMappings:
                  type: array
                  items: {$ref: "#/components/schemas/MigratePathMapping"}
      responses:
        "200":
          description: One check per source folder
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/MigratePathCheck"}
        default:
          $ref: "#/components/responses/Error"
  /migrate/runs/{id}/import:
    post:
      operationId: importMigrateRun
      summary: Import what the preview shows (administrators)
      description: Runs in the background; poll the run for progress.
      tags: [migrate]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "202":
          description: Started
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MigrateRun"}
        default:
          $ref: "#/components/responses/Error"
  /migrate/runs/{id}/cancel:
    post:
      operationId: cancelMigrateRun
      summary: Stop reading or importing (administrators)
      tags: [migrate]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MigrateRun"}
        default:
          $ref: "#/components/responses/Error"
  /migrate/runs/{id}/items:
    get:
      operationId: listMigrateItems
      summary: The plan (or result) of a run, item by item (administrators)
      tags: [migrate]
      parameters:
        - $ref: "#/components/parameters/ID"
        - {name: category, in: query, required: false, schema: {type: string, maxLength: 40}}
        - {name: action, in: query, required: false, schema: {$ref: "#/components/schemas/MigrateAction"}}
        - {name: status, in: query, required: false, schema: {$ref: "#/components/schemas/MigrateItemStatus"}}
        - {name: attention, in: query, required: false, schema: {type: boolean}}
        - {name: conflicts, in: query, required: false, schema: {type: boolean}}
        - {name: sourceId, in: query, required: false, schema: {type: integer, format: int64}}
        - {name: q, in: query, required: false, schema: {type: string, maxLength: 200}}
        - {name: offset, in: query, required: false, schema: {type: integer, minimum: 0}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 1000}}
      responses:
        "200":
          description: Items
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MigrateItemList"}
        default:
          $ref: "#/components/responses/Error"
  /migrate/runs/{id}/report:
    get:
      operationId: getMigrateReport
      summary: Everything about a run as one JSON document (administrators)
      tags: [migrate]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Report (no secrets)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MigrateReport"}
        default:
          $ref: "#/components/responses/Error"
  /migrate/checklist:
    get:
      operationId: getMigrateChecklist
      summary: The switch-over checklist after an import (administrators)
      description: Steps on the old applications are instructions only; Locarr never changes them.
      tags: [migrate]
      responses:
        "200":
          description: Steps
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/MigrateCheckItem"}
        default:
          $ref: "#/components/responses/Error"
  /board:
    get:
      operationId: getBoard
      summary: "\"Why didn't it land?\": monitored missing items grouped by their current reason and fix (library managers)"
      description: |
        Groups every monitored item that is missing (movies, episodes, albums) or misses
        subtitles by the explainer's current answer. The answers are precomputed and kept
        up to date on events, so this is cheap even with tens of thousands of items.
        For groups of searched items, `reasons` adds up the top rejection reasons.
      tags: [board]
      parameters:
        - name: kind
          in: query
          required: false
          schema: {$ref: "#/components/schemas/BoardKind"}
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BoardSummary"}
        default:
          $ref: "#/components/responses/Error"
  /board/items:
    get:
      operationId: listBoardItems
      summary: One page of board items (library managers)
      tags: [board]
      parameters:
        - {name: code, in: query, required: false, schema: {type: string, maxLength: 64}}
        - {name: fix, in: query, required: false, schema: {type: string, maxLength: 64}}
        - {name: kind, in: query, required: false, schema: {$ref: "#/components/schemas/BoardKind"}}
        - {name: q, in: query, required: false, schema: {type: string, maxLength: 200}}
        - {name: offset, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        "200":
          description: Items, by title
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BoardItemPage"}
        default:
          $ref: "#/components/responses/Error"
  /board/actions:
    post:
      operationId: boardAction
      summary: Act on several board items at once (library managers)
      description: |
        `search` searches now; `unmonitor` stops monitoring; `change_profile` sets
        `qualityProfileId` (on the movie, the episode's series or the album's artist);
        `blocklist_retry` removes the item's last download from its client, blocks the
        release and searches again; `retry_import` imports a finished download again
        (or polls the clients when the files were not visible yet).
      tags: [board]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BoardActionRequest"}
      responses:
        "200":
          description: What was done
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BoardActionResult"}
        default:
          $ref: "#/components/responses/Error"
  /board/refresh:
    post:
      operationId: refreshBoard
      summary: Recompute every board item now (library managers)
      tags: [board]
      responses:
        "202":
          description: Queued
        default:
          $ref: "#/components/responses/Error"
  /history:
    get:
      operationId: listHistory
      summary: What happened across the whole library, newest first (library managers)
      tags: [history]
      parameters:
        - {name: category, in: query, required: false, schema: {$ref: "#/components/schemas/HistoryCategory"}}
        - {name: kind, in: query, required: false, schema: {$ref: "#/components/schemas/MediaKind"}}
        - {name: q, in: query, required: false, schema: {type: string, maxLength: 200}}
        - {name: offset, in: query, required: false, schema: {type: integer, minimum: 0, maximum: 100000, default: 0}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 500, default: 50}}
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HistoryPage"}
        default:
          $ref: "#/components/responses/Error"
  /history/{id}:
    delete:
      operationId: deleteHistoryEntry
      summary: Delete one history entry or one row of an item's timeline (library managers)
      description: |
        The entry is the same row the item's timeline shows, so it disappears there too. Files, the
        blocklist, searches and release decisions are not touched.

        With `item`, the row is one of that item's timeline (D-109): any event type, a search (`s:`) or a
        download step. Adult items need the adult permission; otherwise the answer is 404.
      tags: [history]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, pattern: "^[tds]:[0-9]{1,19}$"}}
        - {name: item, in: query, required: false, schema: {type: string, maxLength: 64}, description: "Item ref (\"movie:42\")."}
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
  /history/clear:
    post:
      operationId: clearHistory
      summary: Delete the history entries that match a filter, or count them first (library managers)
      description: |
        The filter is the one of `GET /history` plus `olderThanDays`. With `dryRun` nothing is deleted and
        `count` says how many entries would go. Entries of adult items are never counted or deleted here,
        except with `item` (one item's timeline, D-109) by callers with the adult permission.
      tags: [history]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HistoryClearRequest"}
      responses:
        "200":
          description: How many entries match (dry run) or were deleted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HistoryClearResult"}
        default:
          $ref: "#/components/responses/Error"
  /activity/stats:
    get:
      operationId: getActivityStats
      summary: Grabs, success rate and time to import per indexer and download client (library managers)
      tags: [history]
      parameters:
        - {name: days, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 3650, default: 30}}
      responses:
        "200":
          description: Statistics
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ActivityStats"}
        default:
          $ref: "#/components/responses/Error"
  /system/health:
    get:
      operationId: getHealth
      summary: Current health issues with how to fix them (administrators)
      tags: [system]
      responses:
        "200":
          description: Issues (empty when all is well)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HealthReport"}
        default:
          $ref: "#/components/responses/Error"
  /system/health/run:
    post:
      operationId: runHealthChecks
      summary: Run every health check now (administrators)
      tags: [system]
      responses:
        "200":
          description: Issues
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HealthReport"}
        default:
          $ref: "#/components/responses/Error"
  /system/stats:
    get:
      operationId: getStats
      summary: Numbers for monitoring dashboards (administrators and their read-only keys)
      description: |
        Also served at `/api/stats` (send `X-Api-Key`). At most 15 seconds old.
        Fields are documented in docs/user/troubleshooting.md.
      tags: [system]
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Stats"}
        default:
          $ref: "#/components/responses/Error"
  /system/logs:
    get:
      operationId: listLogs
      summary: Recent log entries, newest last (administrators)
      tags: [system]
      parameters:
        - {name: level, in: query, required: false, schema: {$ref: "#/components/schemas/LogLevel"}}
        - {name: q, in: query, required: false, schema: {type: string, maxLength: 200}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 5000, default: 500}}
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/LogEntry"}
        default:
          $ref: "#/components/responses/Error"
  /system/logs/stream:
    get:
      operationId: streamLogs
      summary: New log entries as they happen (administrators)
      description: Server-sent events; each `entry` event's `data` is one LogEntry as JSON.
      tags: [system]
      parameters:
        - {name: level, in: query, required: false, schema: {$ref: "#/components/schemas/LogLevel"}}
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /system/logs/files:
    get:
      operationId: listLogFiles
      summary: Log files in the config folder (administrators)
      tags: [system]
      responses:
        "200":
          description: Files, newest first
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/LogFile"}
        default:
          $ref: "#/components/responses/Error"
  /system/logs/files/{name}:
    get:
      operationId: downloadLogFile
      summary: Download one log file (administrators)
      tags: [system]
      parameters:
        - name: name
          in: path
          required: true
          schema: {type: string, pattern: "^locarr(\\.[0-9]{1,3})?\\.log$"}
      responses:
        "200":
          description: The file (JSON lines)
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /system/backups:
    get:
      operationId: listBackups
      summary: Backups in the config folder (administrators)
      tags: [system]
      responses:
        "200":
          description: Backups, newest first
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Backup"}
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createBackup
      summary: Make a backup now (administrators)
      description: The zip holds the database, the secret key and the settings; keep it private.
      tags: [system]
      responses:
        "201":
          description: Made
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Backup"}
        default:
          $ref: "#/components/responses/Error"
  /system/backups/restore:
    post:
      operationId: restoreUploadedBackup
      summary: Restore an uploaded backup (administrators)
      description: |
        The body is a backup zip made by Locarr (at most 2 GiB). `confirm` must be
        `RESTORE`. Locarr first backs up the current state, stops its background work,
        replaces the database and the secret key, starts again in the same process and
        signs out every session except the caller's. Media files are never touched.
      tags: [system]
      parameters:
        - {name: confirm, in: query, required: true, schema: {type: string, maxLength: 16}}
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        "202":
          description: Restarting with the restored data
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RestoreStarted"}
        default:
          $ref: "#/components/responses/Error"
  /system/backups/{name}:
    get:
      operationId: downloadBackup
      summary: Download a backup (administrators)
      tags: [system]
      parameters:
        - $ref: "#/components/parameters/BackupName"
      responses:
        "200":
          description: The zip
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            application/zip:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteBackup
      summary: Delete a backup (administrators)
      tags: [system]
      parameters:
        - $ref: "#/components/parameters/BackupName"
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
  /system/backups/{name}/restore:
    post:
      operationId: restoreBackup
      summary: Restore a backup from the config folder (administrators)
      description: See `POST /system/backups/restore`.
      tags: [system]
      parameters:
        - $ref: "#/components/parameters/BackupName"
        - {name: confirm, in: query, required: true, schema: {type: string, maxLength: 16}}
      responses:
        "202":
          description: Restarting with the restored data
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RestoreStarted"}
        default:
          $ref: "#/components/responses/Error"
  /settings/system:
    get:
      operationId: getSystemSettings
      summary: Health thresholds, backups, retention, version check and metrics (administrators)
      tags: [settings]
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SystemSettings"}
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateSystemSettings
      summary: Change system settings (administrators)
      description: Leave `metricsToken` out to keep it, "" to turn `/metrics` off.
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SystemSettingsInput"}
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SystemSettings"}
        default:
          $ref: "#/components/responses/Error"
  /adult/settings:
    get:
      operationId: getAdultSettings
      summary: Adult library settings (administrators; 404 for everyone else)
      description: Works while the feature is off, so an administrator can enable it. Keys are never returned, only whether they are set.
      tags: [adult]
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdultSettings"}
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateAdultSettings
      summary: Change adult library settings (administrators)
      description: Enabling needs `confirmAdults` (every user with access is an adult). Keys are checked with the source before they are stored.
      tags: [adult]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdultSettingsUpdate"}
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdultSettings"}
        default:
          $ref: "#/components/responses/Error"
  /adult/blocklist:
    get:
      operationId: listAdultBlocklist
      summary: The owner's adult tag blocklist (administrators)
      description: |
        Only the owner's own terms; the list starts empty (D-109). The terms that are always blocked are in
        `AdultSettings.protectedTerms` and cannot be added or removed here.
      tags: [adult]
      responses:
        "200":
          description: Terms
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/AdultBlockTerm"}
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: addAdultBlocklistTerm
      summary: Add a blocked term (administrators)
      tags: [adult]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [term]
              properties:
                term: {type: string, minLength: 2, maxLength: 100}
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdultBlockTerm"}
        default:
          $ref: "#/components/responses/Error"
  /adult/blocklist/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    delete:
      operationId: deleteAdultBlocklistTerm
      summary: Remove a blocked term (administrators)
      tags: [adult]
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /adult/items/quality-profile:
    post:
      operationId: setAdultQualityProfileForAll
      summary: Put every adult item, followed studio and performer on one quality profile (permitted library managers)
      description: Only the quality profile changes; files, monitoring and history stay.
      tags: [adult]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profileId]
              properties:
                profileId: {type: integer, format: int64}
      responses:
        "200":
          description: How many items changed
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: {type: integer, format: int64}
        default:
          $ref: "#/components/responses/Error"
  /adult/preferences:
    get:
      operationId: getAdultPreferences
      summary: Own adult preferences (permitted users; 404 otherwise)
      tags: [adult]
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdultPreferences"}
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateAdultPreferences
      summary: Change own adult preferences
      tags: [adult]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdultPreferences"}
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdultPreferences"}
        default:
          $ref: "#/components/responses/Error"
  /adult/rootfolders:
    get:
      operationId: listAdultRootFolders
      summary: Adult root folders
      tags: [adult]
      responses:
        "200":
          description: Folders
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/AdultRootFolder"}
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: addAdultRootFolder
      summary: Add an adult root folder (created inside the data roots)
      tags: [adult]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: {type: string, minLength: 1, maxLength: 4096}
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdultRootFolder"}
        default:
          $ref: "#/components/responses/Error"
  /adult/rootfolders/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    delete:
      operationId: deleteAdultRootFolder
      summary: Forget an adult root folder (files stay)
      tags: [adult]
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /adult/lookup:
    get:
      operationId: lookupAdult
      summary: Search StashDB or ThePornDB
      description: Entries the source flags as removed or disputed and entries with a blocked tag are left out. Remote images are never returned.
      tags: [adult]
      parameters:
        - {name: source, in: query, required: true, schema: {type: string, enum: [stashdb, tpdb]}}
        - {name: type, in: query, required: true, schema: {type: string, enum: [scene, movie, performer, studio]}}
        - {name: term, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
        - name: sort
          in: query
          required: false
          description: >-
            Order of scenes and movies (newest release first by default). Asked of the source where it has
            that order; otherwise the page is ordered after it arrives.
          schema: {type: string, enum: [newest, oldest, relevance, title], default: newest}
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 1}}
      responses:
        "200":
          description: One page of results
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdultLookupPage"}
        default:
          $ref: "#/components/responses/Error"
  /adult/studios:
    get:
      operationId: listAdultStudios
      summary: Studios and sites
      tags: [adult]
      responses:
        "200":
          description: Studios
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/AdultStudio"}
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: addAdultStudio
      summary: Add a studio from a source (its newest scenes are added; new ones become wanted)
      tags: [adult]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdultAddRequest"}
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdultStudio"}
        default:
          $ref: "#/components/responses/Error"
  /adult/studios/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getAdultStudio
      summary: One studio
      tags: [adult]
      responses:
        "200":
          description: Studio
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdultStudio"}
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateAdultStudio
      summary: Monitor a studio or change its profile
      tags: [adult]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdultEditRequest"}
      responses:
        "200":
          description: Studio
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdultStudio"}
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteAdultStudio
      summary: Remove a studio and (unless keepScenes) its scenes (files go to the recycle bin only with deleteFiles)
      tags: [adult]
      parameters:
        - {name: deleteFiles, in: query, required: false, schema: {type: boolean, default: false}}
        - {name: keepScenes, in: query, required: false, description: "Scenes stay in the library without a studio.", schema: {type: boolean, default: false}}
        - {name: exclude, in: query, required: false, description: "Removed scenes are not added again by a refresh.", schema: {type: boolean, default: false}}
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /adult/studios/{id}/refresh:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: refreshAdultStudio
      summary: Look for new scenes of a studio now
      tags: [adult]
      responses:
        "200":
          description: Added scenes
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QueuedCount"}
        default:
          $ref: "#/components/responses/Error"
  /adult/performers:
    get:
      operationId: listAdultPerformers
      summary: Performers
      tags: [adult]
      responses:
        "200":
          description: Performers
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/AdultPerformer"}
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: addAdultPerformer
      summary: Add (and with monitored, track) a performer from a source
      tags: [adult]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdultAddRequest"}
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdultPerformer"}
        default:
          $ref: "#/components/responses/Error"
  /adult/performers/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getAdultPerformer
      summary: One performer
      tags: [adult]
      responses:
        "200":
          description: Performer
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdultPerformer"}
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateAdultPerformer
      summary: Monitor a performer or change the profile
      tags: [adult]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdultEditRequest"}
      responses:
        "200":
          description: Performer
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdultPerformer"}
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteAdultPerformer
      summary: Forget a performer (their scenes stay unless removeScenes)
      tags: [adult]
      parameters:
        - {name: removeScenes, in: query, required: false, schema: {type: boolean, default: false}}
        - {name: deleteFiles, in: query, required: false, schema: {type: boolean, default: false}}
        - {name: exclude, in: query, required: false, description: "Removed scenes are not added again by a refresh.", schema: {type: boolean, default: false}}
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /adult/items:
    get:
      operationId: listAdultItems
      summary: Scenes and movies
      tags: [adult]
      parameters:
        - {name: kind, in: query, required: false, schema: {type: string, enum: [scene, movie]}}
        - {name: studioId, in: query, required: false, schema: {type: integer, format: int64}}
        - {name: performerId, in: query, required: false, schema: {type: integer, format: int64}}
        - {name: term, in: query, required: false, schema: {type: string, maxLength: 200}}
        - {name: missing, in: query, required: false, schema: {type: boolean}}
        - {name: status, in: query, required: false, schema: {$ref: "#/components/schemas/AdultItemStatus"}}
        - {name: monitored, in: query, required: false, schema: {type: boolean}}
        - {name: sort, in: query, required: false, description: "date and added: newest first; title: A-Z (movies default to title).", schema: {type: string, enum: [date, added, title]}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {name: offset, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdultItemPage"}
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: addAdultItem
      summary: Add a scene or movie from a source
      tags: [adult]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdultAddRequest"}
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdultItem"}
        default:
          $ref: "#/components/responses/Error"
  /adult/items/bulk:
    post:
      operationId: bulkAdultItems
      summary: Remove, monitor or unmonitor many items at once (managers)
      tags: [adult]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdultBulkRequest"}
      responses:
        "200":
          description: How many items changed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdultBulkResult"}
        default:
          $ref: "#/components/responses/Error"
  /adult/exclusions:
    get:
      operationId: listAdultExclusions
      summary: The "not interested" list (newest first)
      tags: [adult]
      responses:
        "200":
          description: Exclusions
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/AdultExclusion"}
        default:
          $ref: "#/components/responses/Error"
  /adult/exclusions/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    delete:
      operationId: deleteAdultExclusion
      summary: Undo "not interested" (the next refresh may add the item again)
      tags: [adult]
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /adult/performers/{id}/refresh:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: refreshAdultPerformer
      summary: Look for new scenes of a followed performer now (and fetch a missing image)
      tags: [adult]
      responses:
        "200":
          description: Added scenes
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QueuedCount"}
        default:
          $ref: "#/components/responses/Error"
  /adult/items/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getAdultItem
      summary: One scene or movie
      tags: [adult]
      responses:
        "200":
          description: Item
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdultItem"}
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateAdultItem
      summary: Monitor an item or change its profile
      tags: [adult]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdultEditRequest"}
      responses:
        "200":
          description: Item
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdultItem"}
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteAdultItem
      summary: Remove an item (its file goes to the recycle bin only with deleteFiles)
      tags: [adult]
      parameters:
        - {name: deleteFiles, in: query, required: false, schema: {type: boolean, default: false}}
        - {name: exclude, in: query, required: false, description: "Not interested: a refresh of a followed studio or performer does not add it again.", schema: {type: boolean, default: false}}
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /adult/items/{id}/search:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: searchAdultItem
      summary: Queue an automatic search now
      tags: [adult]
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QueuedCount"}
        default:
          $ref: "#/components/responses/Error"
  /adult/items/{id}/releases:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: interactiveSearchAdultItem
      summary: Interactive search with the decision on every release
      tags: [adult]
      responses:
        "200":
          description: The decision report
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InteractiveSearch"}
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: grabAdultRelease
      summary: Grab a release chosen in an interactive search
      tags: [adult]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ManualGrabRequest"}
      responses:
        "201":
          description: Sent to a client
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QueueItem"}
        default:
          $ref: "#/components/responses/Error"
  /adult/items/{id}/timeline:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getAdultItemTimeline
      summary: The item's timeline and the answer to "why isn't it here?"
      tags: [adult]
      responses:
        "200":
          description: The timeline
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Timeline"}
        default:
          $ref: "#/components/responses/Error"
  /adult/items/{id}/rename:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: renameAdultItem
      summary: Preview or apply renaming the item's file to the template
      tags: [adult]
      parameters:
        - {name: apply, in: query, required: false, schema: {type: boolean, default: false}}
      responses:
        "200":
          description: The rename
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdultRename"}
        default:
          $ref: "#/components/responses/Error"
  /adult/calendar:
    get:
      operationId: getAdultCalendar
      summary: Scenes and movies by release date (only in the adult section; never in the main calendar or iCal)
      tags: [adult]
      parameters:
        - {name: start, in: query, required: true, schema: {type: string, format: date}}
        - {name: end, in: query, required: true, schema: {type: string, format: date}}
      responses:
        "200":
          description: Items
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/AdultItem"}
        default:
          $ref: "#/components/responses/Error"
  /adult/images/{key}:
    get:
      operationId: getAdultImage
      summary: A cached adult image (permitted users only; Cache-Control private)
      tags: [adult]
      parameters:
        - {name: key, in: path, required: true, schema: {type: string, pattern: "^[0-9a-f]{32}$"}}
      responses:
        "200":
          description: The image
          headers:
            Cache-Control:
              schema: {type: string}
          content:
            image/*:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      description: |
        A session token from /auth/login or /setup, or an API key (`lk_…`). The web client's
        HttpOnly `locarr_session` cookie and the `X-Api-Key` header are accepted too.
  parameters:
    Provider:
      name: provider
      in: path
      required: true
      schema: {type: string, pattern: "^[a-z0-9-]{1,32}$"}
    SubtitleProviderName:
      name: name
      in: path
      required: true
      schema:
        type: string
        enum: [opensubtitles, subdl, jimaku]
    SubtitleTranslatorName:
      name: name
      in: path
      required: true
      schema:
        type: string
        enum: [libretranslate, deepl, openai, anthropic, gemini, openai-compatible]
    SubtitleItemRef:
      name: ref
      in: path
      required: true
      description: "movie:ID or episode:ID"
      schema:
        type: string
        pattern: "^(movie|episode):[0-9]+$"
    BackupName:
      name: name
      in: path
      required: true
      schema: {type: string, pattern: "^locarr_backup_[0-9a-z_-]{1,80}\\.zip$"}
    ID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    SearchQ:
      name: q
      in: query
      required: false
      description: Free text.
      schema:
        type: string
        maxLength: 300
    SearchType:
      name: type
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/SearchType"
    SearchCategories:
      name: categories
      in: query
      required: false
      description: Newznab category ids; empty = the indexer's categories for the search type.
      style: form
      explode: false
      schema:
        type: array
        maxItems: 50
        items:
          type: integer
          minimum: 1
    SearchIndexerIds:
      name: indexerIds
      in: query
      required: false
      description: Only these indexers; empty = every enabled one.
      style: form
      explode: false
      schema:
        type: array
        maxItems: 200
        items:
          type: integer
          format: int64
          minimum: 1
    SearchImdbId:
      name: imdbId
      in: query
      required: false
      schema:
        type: string
        pattern: "^(tt)?[0-9]{1,10}$"
    SearchTmdbId:
      name: tmdbId
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
    SearchTvdbId:
      name: tvdbId
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
    SearchTvmazeId:
      name: tvmazeId
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
    SearchSeason:
      name: season
      in: query
      required: false
      schema:
        type: string
        maxLength: 20
    SearchEpisode:
      name: episode
      in: query
      required: false
      schema:
        type: string
        maxLength: 20
    SearchArtist:
      name: artist
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
    SearchAlbum:
      name: album
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
    SearchAuthor:
      name: author
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
    SearchTitle:
      name: title
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
    SearchLimit:
      name: limit
      in: query
      required: false
      description: Results asked from each indexer (capped by its own maximum).
      schema:
        type: integer
        minimum: 1
        maximum: 1000
    SearchOffset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 100000
    TmdbID:
      name: tmdbId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    MBID:
      name: mbid
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-fA-F-]{36}$"
  responses:
    SignedIn:
      description: Signed in
      headers:
        Set-Cookie:
          description: HttpOnly session cookie, only when useCookie was requested.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthResult"
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    AdultSettings:
      type: object
      required: [enabled, stashdbKeySet, tpdbKeySet, defaultSource, defaultProfileId, defaultRootFolderId, sceneFolder, sceneFile, movieFolder,
        movieFile, statsAggregate, notifyStreamero, tokens]
      properties:
        enabled: {type: boolean}
        confirmedAt: {type: string, description: "When an administrator confirmed that every user with access is an adult."}
        stashdbKeySet: {type: boolean}
        tpdbKeySet: {type: boolean}
        defaultSource: {type: string, enum: [stashdb, tpdb]}
        defaultProfileId: {type: integer, format: int64}
        defaultRootFolderId: {type: integer, format: int64}
        sceneFolder: {type: string}
        sceneFile: {type: string}
        movieFolder: {type: string}
        movieFile: {type: string}
        statsAggregate: {type: boolean, description: "Add one total count of adult items to /api/stats (never a breakdown)."}
        notifyStreamero: {type: boolean, description: "Tell Streamero about adult imports (only with an adult Streamero library mapped)."}
        tokens:
          type: array
          items: {type: string}
        protectedTerms:
          type: array
          items: {type: string}
          description: Terms that are always blocked and cannot be removed (content involving minors or recorded without consent).
        openProfileId:
          type: integer
          format: int64
          description: The quality profile that allows every quality, Unknown included (D-109); absent when it was deleted.
        profileUsage:
          $ref: "#/components/schemas/AdultProfileUsage"
    AdultProfileUsage:
      type: object
      description: Only for callers who may see adult content.
      required: [items, studios, performers]
      properties:
        items: {type: integer, description: "Adult items on another profile than openProfileId."}
        studios: {type: integer}
        performers: {type: integer}
    AdultSettingsUpdate:
      type: object
      properties:
        enabled: {type: boolean}
        confirmAdults: {type: boolean, description: "Required to enable: every user with access to adult content is an adult."}
        stashdbKey: {type: string, maxLength: 500, description: "Empty clears the key."}
        tpdbKey: {type: string, maxLength: 500}
        defaultSource: {type: string, enum: [stashdb, tpdb]}
        defaultProfileId: {type: integer, format: int64}
        defaultRootFolderId: {type: integer, format: int64}
        sceneFolder: {type: string, maxLength: 300}
        sceneFile: {type: string, maxLength: 300}
        movieFolder: {type: string, maxLength: 300}
        movieFile: {type: string, maxLength: 300}
        statsAggregate: {type: boolean}
        notifyStreamero: {type: boolean}
    AdultBlockTerm:
      type: object
      required: [id, term, builtin]
      properties:
        id: {type: integer, format: int64}
        term: {type: string}
        builtin: {type: boolean, description: "Always false since D-109 (nothing is seeded)."}
    AdultPreferences:
      type: object
      required: [blur]
      properties:
        blur: {type: boolean, description: "Blur adult images until clicked (default on)."}
    AdultRootFolder:
      type: object
      required: [id, path]
      properties:
        id: {type: integer, format: int64}
        path: {type: string}
    AdultLookupResult:
      type: object
      required: [source, id, type, name]
      properties:
        source: {type: string, enum: [stashdb, tpdb]}
        id: {type: string}
        type: {type: string, enum: [scene, movie, performer, studio]}
        name: {type: string}
        date: {type: string}
        studio: {type: string}
        performers:
          type: array
          items: {type: string}
        inLibrary: {type: boolean}
        image: {type: string, description: "Key for /adult/images/{key}."}
    AdultLookupPage:
      type: object
      required: [results, page, more]
      properties:
        results:
          type: array
          items: {$ref: "#/components/schemas/AdultLookupResult"}
        page: {type: integer}
        more: {type: boolean, description: "The source has another page."}
    AdultItemStatus:
      type: string
      description: "downloaded: in the library; downloading; wanted: monitored without a file; missing: not monitored, no file."
      enum: [downloaded, downloading, wanted, missing]
    AdultBulkRequest:
      type: object
      required: [ids, action]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 500
          items: {type: integer, format: int64}
        action: {type: string, enum: [remove, monitor, unmonitor]}
        deleteFiles: {type: boolean, default: false, description: "remove: files go to the recycle bin."}
        exclude: {type: boolean, default: false, description: "remove: not interested, a refresh does not add them again."}
    AdultBulkResult:
      type: object
      required: [changed]
      properties:
        changed: {type: integer}
    AdultExclusion:
      type: object
      required: [id, kind, title, addedAt]
      properties:
        id: {type: integer, format: int64}
        kind: {type: string, enum: [scene, movie]}
        stashdbId: {type: string}
        tpdbId: {type: string}
        title: {type: string}
        studio: {type: string}
        releaseDate: {type: string}
        addedAt: {type: string, format: date-time}
    AdultAddRequest:
      type: object
      required: [source, id]
      properties:
        source: {type: string, enum: [stashdb, tpdb]}
        id: {type: string, minLength: 1, maxLength: 100}
        kind: {type: string, enum: [scene, movie], description: "For items."}
        qualityProfileId: {type: integer, format: int64}
        rootFolderId: {type: integer, format: int64}
        monitored: {type: boolean, default: true}
        search: {type: boolean, default: true}
    AdultEditRequest:
      type: object
      properties:
        monitored: {type: boolean}
        qualityProfileId: {type: integer, format: int64}
    AdultStudio:
      type: object
      required: [id, name, monitored, qualityProfileId, path, addedAt, scenes, files]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        stashdbId: {type: string}
        tpdbId: {type: string}
        url: {type: string}
        image: {type: string, description: "Key for /adult/images/{key}."}
        monitored: {type: boolean}
        monitorSince: {type: string}
        qualityProfileId: {type: integer, format: int64}
        rootFolderId: {type: integer, format: int64}
        path: {type: string}
        addedAt: {type: string, format: date-time}
        refreshedAt: {type: string, format: date-time}
        scenes: {type: integer}
        files: {type: integer}
    AdultPerformer:
      type: object
      required: [id, name, monitored, addedAt, items]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        disambiguation: {type: string}
        stashdbId: {type: string}
        tpdbId: {type: string}
        image: {type: string}
        monitored: {type: boolean}
        monitorSince: {type: string}
        qualityProfileId: {type: integer, format: int64}
        addedAt: {type: string, format: date-time}
        refreshedAt: {type: string, format: date-time}
        items: {type: integer}
    AdultFile:
      type: object
      required: [id, path, size, quality]
      properties:
        id: {type: integer, format: int64}
        path: {type: string}
        size: {type: integer, format: int64}
        quality: {type: string}
        releaseGroup: {type: string}
        sceneName: {type: string}
        addedAt: {type: string, format: date-time}
    AdultItem:
      type: object
      required: [id, kind, ref, studio, title, monitored, qualityProfileId, path, addedAt, performers, sourceTags, status]
      properties:
        id: {type: integer, format: int64}
        kind: {type: string, enum: [scene, movie]}
        ref: {type: string, description: "scene:<id> or adult_movie:<id>"}
        studioId: {type: integer, format: int64}
        studio: {type: string}
        title: {type: string}
        releaseDate: {type: string}
        year: {type: integer}
        duration: {type: integer}
        overview: {type: string}
        stashdbId: {type: string}
        tpdbId: {type: string}
        image: {type: string}
        monitored: {type: boolean}
        qualityProfileId: {type: integer, format: int64}
        path: {type: string}
        addedAt: {type: string, format: date-time}
        sourceTags:
          type: array
          items: {type: string}
        performers:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: {type: integer, format: int64}
              name: {type: string}
        file: {$ref: "#/components/schemas/AdultFile"}
        status: {$ref: "#/components/schemas/AdultItemStatus"}
    AdultItemPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/AdultItem"}
        total: {type: integer}
    AdultRename:
      type: object
      required: [itemId, from, to]
      properties:
        itemId: {type: integer, format: int64}
        from: {type: string}
        to: {type: string}
    MusicDiscoveryProviderId:
      type: string
      enum: [lastfm, listenbrainz, musicbrainz, spotify]
    ArtistSuggestionSeed:
      type: object
      required: [mbid, name]
      properties:
        mbid: {type: string}
        name: {type: string}
        artistId: {type: integer, format: int64, description: The library artist (library managers only).}
    ArtistSuggestion:
      type: object
      required: [mbid, name, disambiguation, score, seeds, seedCount, providers, tags, cover, matchedByName, links, status]
      properties:
        mbid: {type: string}
        name: {type: string}
        disambiguation: {type: string}
        score: {type: integer, minimum: 0, maximum: 100, description: How strongly the providers and library artists agree.}
        seeds:
          type: array
          description: Library artists it is similar to, strongest first (at most 5).
          items: {$ref: "#/components/schemas/ArtistSuggestionSeed"}
        seedCount: {type: integer}
        providers:
          type: array
          items: {$ref: "#/components/schemas/MusicDiscoveryProviderId"}
        tags: {type: array, items: {type: string}}
        cover: {type: string, description: "Cover Art Archive image name for /images/coverart/{size}/{file} (empty = none)."}
        matchedByName: {type: boolean, description: The MusicBrainz artist was found by name; it may be another artist of that name.}
        links:
          type: object
          required: [musicbrainz]
          properties:
            musicbrainz: {type: string}
            listenbrainz: {type: string}
            lastfm: {type: string}
            spotify: {type: string}
        artistId: {type: integer, format: int64, description: Set when the artist is in the library (library managers only).}
        status: {$ref: "#/components/schemas/DiscoverStatus"}
        requestId: {type: integer, format: int64, description: The caller's open request for the artist.}
    ArtistSuggestionTag:
      type: object
      required: [name, count]
      properties:
        name: {type: string}
        count: {type: integer}
    MusicDiscoveryProvider:
      type: object
      required: [id, enabled, configured, artists, failed]
      properties:
        id: {$ref: "#/components/schemas/MusicDiscoveryProviderId"}
        enabled: {type: boolean}
        configured: {type: boolean, description: Has the keys it needs (MusicBrainz and ListenBrainz need none).}
        artists: {type: integer, description: Library artists it has answered for.}
        failed: {type: integer, description: Library artists whose last lookup failed.}
        lastError: {type: string}
        lastAt: {type: string, format: date-time}
        relatedArtists:
          type: string
          enum: [available, restricted, unknown]
          description: Spotify only. Spotify stopped serving related artists to new apps in November 2024.
    ArtistSuggestionList:
      type: object
      required: [items, total, tags, providers, refreshing, pending, canAdd, canRequest]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/ArtistSuggestion"}
        total: {type: integer}
        tags:
          type: array
          description: The most common tags of the suggestions (before the tag filter).
          items: {$ref: "#/components/schemas/ArtistSuggestionTag"}
        providers:
          type: array
          items: {$ref: "#/components/schemas/MusicDiscoveryProvider"}
        refreshing: {type: boolean}
        pending: {type: integer, description: Library artists and providers not asked yet (a refresh is queued).}
        lastRefreshAt: {type: string, format: date-time}
        canAdd: {type: boolean, description: The caller adds artists to the library.}
        canRequest: {type: boolean, description: The caller may request artists.}
    ArtistExclusion:
      type: object
      required: [mbid, name, createdAt]
      properties:
        mbid: {type: string}
        name: {type: string}
        createdAt: {type: string, format: date-time}
    MusicDiscoverySettings:
      type: object
      required: [lastfm, listenbrainz, musicbrainz, spotify, lastfmApiKey, spotifyClientId, spotifyClientSecret, refreshDays, providers]
      properties:
        lastfm: {type: boolean}
        listenbrainz: {type: boolean}
        musicbrainz: {type: boolean}
        spotify: {type: boolean}
        lastfmApiKey: {$ref: "#/components/schemas/SecretState"}
        spotifyClientId: {$ref: "#/components/schemas/SecretState"}
        spotifyClientSecret: {$ref: "#/components/schemas/SecretState"}
        refreshDays: {type: integer, minimum: 1, maximum: 90}
        providers:
          type: array
          items: {$ref: "#/components/schemas/MusicDiscoveryProvider"}
    MusicDiscoverySettingsInput:
      type: object
      properties:
        lastfm: {type: boolean}
        listenbrainz: {type: boolean}
        musicbrainz: {type: boolean}
        spotify: {type: boolean}
        lastfmApiKey: {type: string, maxLength: 256, description: Write-only; empty removes it.}
        spotifyClientId: {type: string, maxLength: 256, description: Write-only; set together with the secret; empty removes both.}
        spotifyClientSecret: {type: string, maxLength: 256, description: Write-only.}
        refreshDays: {type: integer, minimum: 1, maximum: 90}
    MusicDiscoveryTestResult:
      type: object
      required: [ok, message]
      properties:
        ok: {type: boolean}
        code: {type: string, description: "Why it failed: metadata_key_missing, metadata_key_invalid, metadata_unavailable."}
        message: {type: string}
        relatedArtists: {type: string, enum: [available, restricted, unknown], description: Spotify only.}
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code, e.g. `invalid_credentials`, `totp_required`, `forbidden`.
        message:
          type: string
    Language:
      type: string
      enum: [en, hr]
    Role:
      type: string
      enum: [admin, manager, requester]
      description: |
        `admin` can do everything. `manager` manages the library and requests (as its
        permissions allow). `requester` only asks for titles.
    Username:
      type: string
      minLength: 1
      maxLength: 64
      description: Case-insensitive; letters, digits, space and . _ - @
    Password:
      type: string
      minLength: 8
      maxLength: 256
    SystemInfo:
      type: object
      required: [product, instanceName, version, commit, startedAt, setupRequired]
      properties:
        product:
          type: string
        instanceName:
          type: string
        version:
          type: string
        commit:
          type: string
        startedAt:
          type: string
          format: date-time
        setupRequired:
          type: boolean
          description: True while no administrator exists.
    SystemStatus:
      type: object
      required: [version, commit, goVersion, os, arch, startedAt, uptimeSeconds, configDir, databaseSizeBytes, dataRoots]
      properties:
        version:
          type: string
        commit:
          type: string
        goVersion:
          type: string
        os:
          type: string
        arch:
          type: string
        startedAt:
          type: string
          format: date-time
        uptimeSeconds:
          type: integer
          format: int64
        configDir:
          type: string
        databaseSizeBytes:
          type: integer
          format: int64
          description: Database file plus its write-ahead log.
        dataRoots:
          type: array
          items:
            type: string
    JobState:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    Job:
      type: object
      required: [id, kind, queue, state, attempt, maxAttempts, runAt, createdAt]
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
        queue:
          type: string
        state:
          $ref: "#/components/schemas/JobState"
        attempt:
          type: integer
        maxAttempts:
          type: integer
        runAt:
          type: string
          format: date-time
          description: When a queued job is due (for a retry, after its backoff).
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        error:
          type: string
          description: The last error, if any attempt failed.
        uniqueKey:
          type: string
    ScheduledTask:
      type: object
      required: [name, kind, intervalSeconds, nextRunAt]
      properties:
        name:
          type: string
        kind:
          type: string
        intervalSeconds:
          type: integer
          format: int64
        nextRunAt:
          type: string
          format: date-time
        lastRunAt:
          type: string
          format: date-time
        lastState:
          $ref: "#/components/schemas/JobState"
    TaskList:
      type: object
      required: [scheduled, jobs]
      properties:
        scheduled:
          type: array
          items:
            $ref: "#/components/schemas/ScheduledTask"
        jobs:
          type: array
          description: Most recent first.
          items:
            $ref: "#/components/schemas/Job"
    DeviceInfo:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        client:
          type: string
          maxLength: 100
    SetupRequest:
      type: object
      required: [setupCode, username, password]
      properties:
        setupCode:
          type: string
          maxLength: 64
        username:
          $ref: "#/components/schemas/Username"
        password:
          $ref: "#/components/schemas/Password"
        language:
          $ref: "#/components/schemas/Language"
        instanceName:
          type: string
          maxLength: 100
        device:
          $ref: "#/components/schemas/DeviceInfo"
        useCookie:
          type: boolean
          description: Web clients set this to get the HttpOnly cookie instead of a token in the body.
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 64
        password:
          type: string
          maxLength: 256
        totpCode:
          type: string
          maxLength: 16
        recoveryCode:
          type: string
          maxLength: 32
        device:
          $ref: "#/components/schemas/DeviceInfo"
        useCookie:
          type: boolean
    AuthResult:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
          description: The session token, only when useCookie was not requested.
    Permissions:
      type: object
      description: What a non-administrator may do. Administrators may do everything regardless.
      required: [requestMovies, requestSeries, requestMusic, autoApprove, request4k, manageLibrary, manageRequests]
      properties:
        requestMovies:
          type: boolean
        requestSeries:
          type: boolean
        requestMusic:
          type: boolean
        autoApprove:
          type: boolean
          description: Requests are approved without an administrator.
        request4k:
          type: boolean
        manageLibrary:
          type: boolean
          description: Add, edit and search titles.
        manageRequests:
          type: boolean
          description: Approve and decline other users' requests.
        autoApproveMovies:
          type: boolean
          description: Movie requests are approved at once (autoApprove covers every kind).
        autoApproveSeries:
          type: boolean
        autoApproveMusic:
          type: boolean
        autoApprove4k:
          type: boolean
          description: 4K requests are approved at once.
        viewAdult:
          type: boolean
          description: See the optional adult library. Never granted by default, not even to administrators; requesters can never hold it.
    User:
      type: object
      required: [id, username, role, permissions, language, disabled, totpEnabled, createdAt]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        permissions:
          $ref: "#/components/schemas/Permissions"
        adultVisible:
          type: boolean
          description: Only on /auth/me - the adult library is enabled and this session may see it.
        language:
          $ref: "#/components/schemas/Language"
        disabled:
          type: boolean
        totpEnabled:
          type: boolean
        lockedUntil:
          type: string
          format: date-time
          description: Set while the account is locked after failed sign-ins.
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
    UpdateMeRequest:
      type: object
      properties:
        language:
          $ref: "#/components/schemas/Language"
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          maxLength: 256
        newPassword:
          $ref: "#/components/schemas/Password"
    Session:
      type: object
      required: [id, deviceName, client, ip, createdAt, lastSeenAt, current]
      properties:
        id:
          type: integer
          format: int64
        deviceName:
          type: string
        client:
          type: string
        ip:
          type: string
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        current:
          type: boolean
    ApiKey:
      type: object
      required: [id, name, prefix, readOnly, createdAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        prefix:
          type: string
          description: The first characters of the key, to recognise it.
        readOnly:
          type: boolean
        includeAdult:
          type: boolean
          description: The key may see the adult library (only when its owner may).
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
    CreateApiKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        readOnly:
          type: boolean
        includeAdult:
          type: boolean
          description: Let the key see the adult library. Ignored unless the owner holds viewAdult.
    CreatedApiKey:
      type: object
      required: [apiKey, key]
      properties:
        apiKey:
          $ref: "#/components/schemas/ApiKey"
        key:
          type: string
          description: Shown once.
    TotpSetup:
      type: object
      required: [secret, uri]
      properties:
        secret:
          type: string
          description: Base32, for typing into an authenticator app.
        uri:
          type: string
          description: otpauth:// URI, for a QR code.
    TotpCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          maxLength: 16
    PasswordConfirm:
      type: object
      required: [password]
      properties:
        password:
          type: string
          maxLength: 256
    RecoveryCodes:
      type: object
      required: [codes]
      properties:
        codes:
          type: array
          items:
            type: string
    CreateUserRequest:
      type: object
      required: [username, password, role]
      properties:
        username:
          $ref: "#/components/schemas/Username"
        password:
          $ref: "#/components/schemas/Password"
        role:
          $ref: "#/components/schemas/Role"
        permissions:
          $ref: "#/components/schemas/Permissions"
        language:
          $ref: "#/components/schemas/Language"
    UpdateUserRequest:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/Role"
        permissions:
          $ref: "#/components/schemas/Permissions"
        disabled:
          type: boolean
    ResetPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          $ref: "#/components/schemas/Password"
    SecretState:
      type: object
      required: [configured]
      properties:
        configured:
          type: boolean
    Settings:
      type: object
      required: [instanceName, tmdbApiKey]
      properties:
        instanceName:
          type: string
        tmdbApiKey:
          $ref: "#/components/schemas/SecretState"
    UpdateSettingsRequest:
      type: object
      properties:
        instanceName:
          type: string
          minLength: 1
          maxLength: 100
        tmdbApiKey:
          type: string
          maxLength: 512
          description: Write-only. An empty string removes the stored key.
    MediaKind:
      type: string
      enum: [movies, series, music]
    RootFolder:
      type: object
      required: [id, path, kind, accessible, writable, createdAt]
      properties:
        id:
          type: integer
          format: int64
        path:
          type: string
        kind:
          $ref: "#/components/schemas/MediaKind"
        accessible:
          type: boolean
          description: The folder exists and can be listed.
        writable:
          type: boolean
        notWritableReason:
          type: string
          enum: [permission_denied, read_only_filesystem, not_found, other]
          description: Why the write test failed (absent when writable).
        notWritableDetail:
          type: string
          description: The error of the write test, as the system reported it.
        freeSpaceBytes:
          type: integer
          format: int64
        totalSpaceBytes:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    CreateRootFolderRequest:
      type: object
      required: [path, kind]
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 4096
        kind:
          $ref: "#/components/schemas/MediaKind"
        create:
          type: boolean
          description: Create the folder (inside the data roots) when it does not exist yet.
    FolderEntry:
      type: object
      required: [name, path]
      properties:
        name:
          type: string
        path:
          type: string
    FolderListing:
      type: object
      required: [entries]
      properties:
        path:
          type: string
          description: The listed folder; absent when the data roots are listed.
        parent:
          type: string
          description: The folder above, when it is still inside a data root.
        entries:
          type: array
          items:
            $ref: "#/components/schemas/FolderEntry"
    IndexerKind:
      type: string
      enum: [torznab, newznab, native]
      description: |
        `torznab` indexers are torrent indexers, `newznab` ones usenet. `native` indexers are public
        sites Locarr searches itself through a built-in or custom site definition (`definition`).
    Protocol:
      type: string
      enum: [torrent, usenet]
    SearchType:
      type: string
      enum: [search, tv, movie, music, book]
    IndexerCategories:
      type: object
      description: Newznab category ids used for each kind of media.
      required: [movies, tv, music, books]
      properties:
        movies:
          type: array
          items:
            type: integer
        tv:
          type: array
          items:
            type: integer
        music:
          type: array
          items:
            type: integer
        books:
          type: array
          items:
            type: integer
        adult:
          type: array
          description: Adult (6xxx) categories. Empty unless an administrator opts the indexer in; only adult searches use them.
          items:
            type: integer
    IndexerCategory:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
        subcategories:
          type: array
          items:
            $ref: "#/components/schemas/IndexerCategory"
    IndexerSearchCap:
      type: object
      required: [type, available, params]
      properties:
        type:
          $ref: "#/components/schemas/SearchType"
        available:
          type: boolean
        params:
          type: array
          items:
            type: string
    IndexerCaps:
      type: object
      required: [searching, categories]
      properties:
        serverTitle:
          type: string
        limitMax:
          type: integer
        limitDefault:
          type: integer
        searching:
          type: array
          items:
            $ref: "#/components/schemas/IndexerSearchCap"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/IndexerCategory"
    IndexerHealthStatus:
      type: string
      enum: [healthy, failing, disabled, unknown]
      description: |
        `failing`: recent requests failed; the indexer is skipped until `retryAt`
        and then tried again automatically. `disabled`: switched off by an administrator
        or by a source sync. `unknown`: never used yet.
    IndexerHealth:
      type: object
      required: [status, failures]
      properties:
        status:
          $ref: "#/components/schemas/IndexerHealthStatus"
        failures:
          type: integer
        lastError:
          type: string
        lastErrorCode:
          type: string
        lastErrorAt:
          type: string
          format: date-time
        lastSuccessAt:
          type: string
          format: date-time
        retryAt:
          type: string
          format: date-time
        parseFailures:
          type: integer
          description: "For built-in sites: result rows that could not be read since the last reset (the site layout may have changed)."
        selfTestAt:
          type: string
          format: date-time
          description: "For built-in sites: when the weekly self-test last ran."
        selfTestOk:
          type: boolean
    IndexerSourceRef:
      type: object
      required: [id, name, ref]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        ref:
          type: string
          description: The indexer's id on the source.
    Indexer:
      type: object
      required: [id, name, kind, protocol, baseUrl, apiPath, apiKey, enabled, enableRss, enableAutomaticSearch,
        enableInteractiveSearch, priority, tags, categories, minimumSeeders, timeoutSeconds, proxyPassword, health,
        createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        kind:
          $ref: "#/components/schemas/IndexerKind"
        protocol:
          $ref: "#/components/schemas/Protocol"
        baseUrl:
          type: string
        apiPath:
          type: string
        apiKey:
          $ref: "#/components/schemas/SecretState"
        enabled:
          type: boolean
        enableRss:
          type: boolean
        enableAutomaticSearch:
          type: boolean
        enableInteractiveSearch:
          type: boolean
        priority:
          type: integer
          description: 1 (most preferred) to 50.
        tags:
          type: array
          items:
            type: string
        categories:
          $ref: "#/components/schemas/IndexerCategories"
        minimumSeeders:
          type: integer
        seedRatio:
          type: number
          description: Seed ratio goal for torrents from this indexer (used by download clients).
        seedTimeMinutes:
          type: integer
        requestLimit:
          type: integer
          description: At most this many requests per `requestPeriodSeconds`.
        requestPeriodSeconds:
          type: integer
        grabLimitPerDay:
          type: integer
        timeoutSeconds:
          type: integer
        proxyUrl:
          type: string
          description: http://, https:// or socks5:// proxy, without credentials.
        proxyUsername:
          type: string
        proxyPassword:
          $ref: "#/components/schemas/SecretState"
        flaresolverrUrl:
          type: string
        definition:
          $ref: "#/components/schemas/IndexerDefinitionRef"
        options:
          $ref: "#/components/schemas/IndexerOptions"
        source:
          $ref: "#/components/schemas/IndexerSourceRef"
        caps:
          $ref: "#/components/schemas/IndexerCaps"
        capsUpdatedAt:
          type: string
          format: date-time
        adultCapable:
          type: boolean
          description: >-
            The indexer can answer adult searches: a built-in site whose definition has adult categories, or any
            Torznab/Newznab indexer (its capabilities do not always list every category). Built-in sites without
            adult categories are left out of adult searches.
        health:
          $ref: "#/components/schemas/IndexerHealth"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    IndexerOptions:
      type: object
      description: Settings of a built-in site (names from its definition's `settings`).
      additionalProperties:
        type: string
        maxLength: 200
    IndexerDefinitionRef:
      type: object
      required: [id, name, version, builtin, overrides, missing]
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: integer
        builtin:
          type: boolean
        overrides:
          type: boolean
          description: A custom file replaces the built-in definition.
        missing:
          type: boolean
          description: The definition is no longer available (a custom file was removed); the indexer cannot search.
    IndexerInput:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        kind:
          $ref: "#/components/schemas/IndexerKind"
        baseUrl:
          type: string
          maxLength: 2048
          description: Required for Torznab/Newznab. For a built-in site, the address to use (a mirror); empty uses its default.
        apiPath:
          type: string
          maxLength: 512
          description: Default `/api`.
        apiKey:
          type: string
          maxLength: 512
          description: Write-only.
        enabled:
          type: boolean
          default: true
        enableRss:
          type: boolean
          default: true
        enableAutomaticSearch:
          type: boolean
          default: true
        enableInteractiveSearch:
          type: boolean
          default: true
        priority:
          type: integer
          minimum: 1
          maximum: 50
          default: 25
        tags:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 50
        categories:
          $ref: "#/components/schemas/IndexerCategories"
        minimumSeeders:
          type: integer
          minimum: 0
          maximum: 10000
          default: 1
        seedRatio:
          type: number
          minimum: 0
          maximum: 1000
        seedTimeMinutes:
          type: integer
          minimum: 0
          maximum: 5256000
        requestLimit:
          type: integer
          minimum: 1
          maximum: 100000
        requestPeriodSeconds:
          type: integer
          minimum: 1
          maximum: 86400
        grabLimitPerDay:
          type: integer
          minimum: 1
          maximum: 100000
        timeoutSeconds:
          type: integer
          minimum: 2
          maximum: 120
          default: 30
        proxyUrl:
          type: string
          maxLength: 2048
        proxyUsername:
          type: string
          maxLength: 256
        proxyPassword:
          type: string
          maxLength: 512
          description: Write-only.
        flaresolverrUrl:
          type: string
          maxLength: 2048
        definition:
          type: string
          maxLength: 40
          description: The site definition id (kind `native`).
        options:
          $ref: "#/components/schemas/IndexerOptions"
    IndexerTestRequest:
      type: object
      required: [indexer]
      properties:
        indexer:
          $ref: "#/components/schemas/IndexerInput"
        indexerId:
          type: integer
          format: int64
          minimum: 1
    IndexerTestResult:
      type: object
      required: [ok, durationMs]
      properties:
        ok:
          type: boolean
        durationMs:
          type: integer
          format: int64
        caps:
          $ref: "#/components/schemas/IndexerCaps"
        defaultCategories:
          $ref: "#/components/schemas/IndexerCategories"
        probeResults:
          type: integer
          description: Results of the probe search.
        errorCode:
          type: string
          description: |
            auth, rate_limit, unsupported, disabled, not_found, bad_response, unreachable, blocked, challenge
            (a browser check the built-in browser or FlareSolverr could not pass, or one that wants a person),
            layout (a built-in site's pages changed) or unknown.
        error:
          type: string
    IndexerSettings:
      type: object
      required: [rssSyncIntervalMinutes, releaseRetentionDays, searchTimeoutSeconds, searchCacheSeconds, allowedHosts, blockPrivateNetworks,
        publicTrackers, userAgent, browserUrl, browserDefaultUrl, browserToken, browserTokenFromEnv]
      properties:
        browserUrl:
          type: string
          description: Address of the built-in browser set in the settings; empty uses browserDefaultUrl.
        browserDefaultUrl:
          type: string
          description: The address used when browserUrl is empty (LOCARR_BROWSER_URL or the compose service).
        browserToken:
          $ref: "#/components/schemas/SecretState"
        browserTokenFromEnv:
          type: boolean
          description: LOCARR_BROWSER_TOKEN is set (used unless a token is saved in the settings).
        rssSyncIntervalMinutes:
          type: integer
          description: How often RSS feeds are fetched (RSS can be turned off per indexer).
        releaseRetentionDays:
          type: integer
        searchTimeoutSeconds:
          type: integer
          description: Upper bound for a whole search; each indexer also has its own timeout.
        searchCacheSeconds:
          type: integer
        allowedHosts:
          type: array
          description: Addresses, networks or host names indexers may reach even though they are blocked by default (loopback, link-local).
          items:
            type: string
        blockPrivateNetworks:
          type: boolean
          description: Also refuse private (RFC 1918) addresses. Off by default because download tools and FlareSolverr usually share the Docker network.
        publicTrackers:
          type: array
          description: Trackers added to magnets Locarr builds from a built-in site's bare info hash.
          items:
            type: string
        userAgent:
          type: string
          description: User-Agent sent to indexers and sites; empty sends "Locarr".
    UpdateIndexerSettingsRequest:
      type: object
      properties:
