          maximum: 1440
        releaseRetentionDays:
          type: integer
          minimum: 1
          maximum: 365
        searchTimeoutSeconds:
          type: integer
          minimum: 5
          maximum: 55
        searchCacheSeconds:
          type: integer
          minimum: 0
          maximum: 3600
        allowedHosts:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 255
        blockPrivateNetworks:
          type: boolean
        publicTrackers:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 300
