    DownloadClientTestRequest:
      type: object
      required: [client]
      properties:
        id:
          type: integer
          format: int64
          description: A stored client whose password / API key are used when left out.
        client:
          $ref: "#/components/schemas/DownloadClientInput"
    DownloadClientTestResult:
      type: object
      required: [ok, missingCategories, canCreateCategories]
      properties:
        ok: {type: boolean}
        errorCode: {type: string}
        message: {type: string}
        version: {type: string}
        freeSpaceBytes:
          type: integer
          format: int64
        missingCategories:
          type: array
          items: {type: string}
        canCreateCategories: {type: boolean}
    CreatedCategories:
      type: object
      required: [categories]
      properties:
        categories:
          type: array
          items: {type: string}
    DownloadSettings:
      type: object
      required: [pollSeconds, stalledHours]
      properties:
        pollSeconds:
          type: integer
          description: How often clients are polled (faster while the queue is open).
        stalledHours:
          type: integer
          description: A torrent with no progress and no seeds for this long fails (0 = never).
    UpdateDownloadSettings:
      type: object
      properties:
        pollSeconds:
          type: integer
          minimum: 10
          maximum: 3600
        stalledHours:
          type: integer
          minimum: 0
          maximum: 720
    RemotePathMapping:
      type: object
      required: [id, host, remotePath, localPath]
      properties:
        id:
          type: integer
          format: int64
        host: {type: string}
        remotePath: {type: string}
        localPath: {type: string}
    RemotePathMappingInput:
      type: object
      required: [host, remotePath, localPath]
      properties:
        host:
          type: string
          minLength: 1
          maxLength: 253
        remotePath:
          type: string
          minLength: 1
          maxLength: 4096
        localPath:
          type: string
          minLength: 1
          maxLength: 4096
    QueueItem:
      type: object
      required: [id, unknown, clientName, clientItemId, protocol, title, status, state, rawState, progress, sizeBytes,
        downloadedBytes, downloadSpeed, uploadSpeed, ratio, seedingSeconds, category, message, addedAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
          description: 0 for unknown items (added outside Locarr).
        unknown: {type: boolean}
        clientId:
          type: integer
          format: int64
        clientName: {type: string}
        clientItemId: {type: string}
        protocol:
          $ref: "#/components/schemas/DownloadProtocol"
        title: {type: string}
        indexer: {type: string}
        mediaKind: {type: string}
        category: {type: string}
        status:
          $ref: "#/components/schemas/DownloadStatus"
        state:
          $ref: "#/components/schemas/DownloadState"
        rawState: {type: string}
        progress:
          type: number
          format: double
        sizeBytes:
          type: integer
          format: int64
        downloadedBytes:
          type: integer
          format: int64
        downloadSpeed:
          type: integer
          format: int64
        uploadSpeed:
          type: integer
          format: int64
        etaSeconds:
          type: integer
          format: int64
        ratio:
          type: number
          format: double
        seedingSeconds:
          type: integer
          format: int64
        contentPath: {type: string}
        localPath: {type: string}
        message: {type: string}
        itemRef:
          description: Opaque JSON from whoever grabbed the release.
        addedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    QueueClient:
      type: object
      required: [id, name, protocol, enabled, status]
      properties:
        id:
          type: integer
          format: int64
        name: {type: string}
        protocol:
          $ref: "#/components/schemas/DownloadProtocol"
        enabled: {type: boolean}
        canPrioritise: {type: boolean}
        status:
          $ref: "#/components/schemas/DownloadClientStatus"
    Queue:
      type: object
      required: [items, clients]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/QueueItem"
        clients:
          type: array
          items:
            $ref: "#/components/schemas/QueueClient"
    GrabRequest:
      type: object
      required: [protocol, title]
      description: |
        One of `downloadUrl` or `downloadToken`. With `indexerId`, http(s) links and
        tokens are fetched through that indexer (its credentials, grab limit and
        seeding goals apply).
      properties:
        downloadUrl:
          type: string
          maxLength: 8192
          description: An http(s) link to a .torrent or .nzb, or a magnet link.
        downloadToken:
          type: string
          maxLength: 8192
          description: The `token` of a search result's `downloadLink` (needs `indexerId`).
        protocol:
          $ref: "#/components/schemas/DownloadProtocol"
        title:
          type: string
          minLength: 1
          maxLength: 500
        indexerId:
          type: integer
          format: int64
        indexer:
          type: string
          maxLength: 200
        guid:
          type: string
          maxLength: 2000
        mediaKind:
          $ref: "#/components/schemas/MediaKind"
        itemRef:
          description: Opaque JSON for the importer (up to 16 KiB).
        tags:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 50
        clientId:
          type: integer
          format: int64
        seedRatio:
          type: number
          format: double
          minimum: 0
          description: Seeding goal from the indexer settings (overrides the client's).
        seedTimeMinutes:
          type: integer
          minimum: 0
        publishedAt:
          type: string
          format: date-time
    BlocklistEntry:
      type: object
      required: [id, title, protocol, indexer, infoHash, guid, reason, message, createdAt]
      properties:
        id:
          type: integer
          format: int64
        title: {type: string}
        protocol: {type: string}
        indexerId:
          type: integer
          format: int64
        indexer: {type: string}
        infoHash: {type: string}
        guid: {type: string}
        reason: {type: string}
        message: {type: string}
        itemRef: {}
        downloadId:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    BlocklistInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        protocol:
          $ref: "#/components/schemas/DownloadProtocol"
        indexerId:
          type: integer
          format: int64
        indexer:
          type: string
          maxLength: 200
        infoHash:
          type: string
          maxLength: 64
        guid:
          type: string
          maxLength: 2000
        reason:
          type: string
          maxLength: 64
        message:
          type: string
          maxLength: 500
        itemRef: {}
    PriorityRequest:
      type: object
      required: [priority]
      properties:
        priority:
          $ref: "#/components/schemas/QueuePriority"
    DownloadEvent:
      type: object
      required: [id, downloadId, at, type, fromState, toState, message]
      properties:
        id:
          type: integer
          format: int64
        downloadId:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
        type:
          type: string
          description: grabbed, state, completed, failed, removed, imported, import_failed or blocklisted.
        fromState: {type: string}
        toState: {type: string}
        message: {type: string}
        data: {}
