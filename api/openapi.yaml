      tags: [subtitles]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SubtitleProviderInput"}
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SubtitleProvider"}
        default:
          $ref: "#/components/responses/Error"
  /subtitles/providers/{name}/test:
    parameters:
      - $ref: "#/components/parameters/SubtitleProviderName"
    post:
      operationId: testSubtitleProvider
      summary: Check a provider's credentials and read its quota (administrators)
      tags: [subtitles]
      responses:
        "200":
          description: The provider answered
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SubtitleProvider"}
        default:
          $ref: "#/components/responses/Error"
  /subtitles/providers/{name}/health/reset:
    parameters:
      - $ref: "#/components/parameters/SubtitleProviderName"
    post:
      operationId: resetSubtitleProviderHealth
      summary: Clear a provider's failures and backoff (managers)
      tags: [subtitles]
      responses:
        "200":
          description: Reset
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SubtitleProvider"}
        default:
          $ref: "#/components/responses/Error"
  /subtitles/translators:
    get:
      operationId: listSubtitleTranslators
      summary: Translation services with usage and health (managers)
      tags: [subtitles]
      responses:
        "200":
          description: Services
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/SubtitleTranslator"}
        default:
          $ref: "#/components/responses/Error"
  /subtitles/translators/{name}:
    parameters:
      - $ref: "#/components/parameters/SubtitleTranslatorName"
    put:
      operationId: updateSubtitleTranslator
      summary: Change a translation service (administrators)
      description: The key is write-only and stored encrypted; an empty string removes it.
      tags: [subtitles]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SubtitleTranslatorInput"}
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SubtitleTranslator"}
        default:
          $ref: "#/components/responses/Error"
