          schema: {type: string, enum: [missing, cutoff_unmet], default: missing}
        - {name: offset, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
      responses:
        "200":
          description: A page of episodes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WantedEpisodeList"
        default:
          $ref: "#/components/responses/Error"
  /episodes/monitor:
    post:
      operationId: monitorEpisodes
      summary: Monitor or unmonitor several episodes (library managers)
      tags: [series]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonitorEpisodesRequest"
      responses:
        "200":
          description: How many changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedCount"
        default:
          $ref: "#/components/responses/Error"
  /episodes/search:
    post:
      operationId: searchEpisodes
      summary: Queue searches for episodes now (library managers)
      tags: [series]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EpisodeIdsRequest"
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedCount"
        default:
          $ref: "#/components/responses/Error"
  /episodes/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getEpisode
      summary: One episode
      tags: [series]
      responses:
        "200":
          description: The episode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Episode"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateEpisode
      summary: Monitor an episode or set its scene numbering (library managers)
      tags: [series]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EpisodeUpdate"
      responses:
        "200":
          description: The episode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Episode"
        default:
          $ref: "#/components/responses/Error"
  /episodes/{id}/releases:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: interactiveSearchEpisode
      summary: Interactive episode search - every release and the decision on it (library managers)
      tags: [series]
      responses:
        "200":
          description: The decision report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InteractiveSearch"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: grabEpisodeRelease
      summary: Grab a release chosen in an interactive episode search (library managers)
      tags: [series]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualGrabRequest"
      responses:
        "201":
          description: Sent to a download client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueItem"
        default:
          $ref: "#/components/responses/Error"
  /timeline:
    get:
      operationId: getTimeline
      summary: An item's timeline and the answer to "why isn't it here?"
      description: |
        `item` is an item reference such as `movie:42`. Events are newest first: searches with
        per-indexer counts, decisions with the most common rejection reasons, grabs, download
        milestones, imports, renames, upgrades, recycled files and media server notifications.
      tags: [timeline]
      parameters:
        - {name: item, in: query, required: true, schema: {type: string, maxLength: 64}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 2000, default: 500}}
      responses:
        "200":
          description: The timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timeline"
        default:
          $ref: "#/components/responses/Error"
  /timeline/explain:
    get:
      operationId: explainItem
      summary: Why an item is not in the library (yet)
      tags: [timeline]
      parameters:
        - {name: item, in: query, required: true, schema: {type: string, maxLength: 64}}
      responses:
        "200":
          description: The current blocking reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Explanation"
        default:
          $ref: "#/components/responses/Error"
  /timeline/retry:
    post:
      operationId: retryItem
      summary: Retry now - clear an item's search backoff and search and grab immediately (library managers)
      description: |
        For a movie, episode, season or album (`movie:42`). The item's search backoff is cleared and an
        automatic search is queued at once; the decision and any grab appear on the timeline. Indexer
        limits and grab pacing still apply.
      tags: [timeline]
      parameters:
        - {name: item, in: query, required: true, schema: {type: string, maxLength: 64}}
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedCount"
        default:
          $ref: "#/components/responses/Error"
  /calendar:
    get:
      operationId: getCalendar
      summary: Movie dates (in cinemas, digital, physical) and episode air dates between two days
      tags: [calendar]
      parameters:
        - {name: start, in: query, required: true, schema: {type: string, format: date}}
        - {name: end, in: query, required: true, schema: {type: string, format: date}}
      responses:
        "200":
          description: Entries by date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarEntry"
        default:
          $ref: "#/components/responses/Error"
  /calendar/token:
    get:
      operationId: getCalendarToken
      summary: Whether the signed-in user has a calendar feed link
      tags: [calendar]
      responses:
        "200":
          description: State
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretState"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createCalendarToken
      summary: Create (or replace) the signed-in user's calendar feed link
      description: The link is shown once; creating a new one stops the old one.
      tags: [calendar]
      responses:
        "201":
          description: The feed link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarFeed"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteCalendarToken
      summary: Stop the signed-in user's calendar feed link
      tags: [calendar]
      responses:
        "204":
          description: Stopped
        default:
          $ref: "#/components/responses/Error"
  /calendar/feed.ics:
    get:
      operationId: getCalendarFeed
      summary: iCalendar feed (authenticated by the per-user token in the link)
      tags: [calendar]
      security: []
      parameters:
        - {name: token, in: query, required: true, schema: {type: string, minLength: 20, maxLength: 200}}
        - {name: pastDays, in: query, required: false, schema: {type: integer, minimum: 0, maximum: 365, default: 30}}
        - {name: futureDays, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 730, default: 365}}
      responses:
        "200":
          description: The feed
          content:
            text/calendar:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /images/tmdb/{size}/{file}:
    get:
      operationId: getTmdbImage
      summary: A TMDb poster or backdrop, cached on the server
      tags: [images]
      parameters:
        - {name: size, in: path, required: true, schema: {type: string, enum: [w92, w154, w185, w300, w342, w500, w780, w1280, original]}}
        - {name: file, in: path, required: true, schema: {type: string, pattern: "^[A-Za-z0-9_-]{1,80}\\.(jpg|jpeg|png|webp)$"}}
        - {name: If-None-Match, in: header, required: false, schema: {type: string, maxLength: 200}}
      responses:
        "200":
          description: The image
          headers:
            ETag:
              schema: {type: string}
            Cache-Control:
              schema: {type: string}
          content:
            image/*:
              schema:
                type: string
                format: binary
        "304":
          description: Not modified
          headers:
            ETag:
              schema: {type: string}
            Cache-Control:
              schema: {type: string}
        default:
          $ref: "#/components/responses/Error"
  /recyclebin:
    get:
      operationId: getRecycleBin
      summary: Files in the recycle bin (library managers)
      tags: [recyclebin]
      responses:
        "200":
          description: The bin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecycleBin"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: emptyRecycleBin
      summary: Delete everything in the recycle bin permanently (administrators)
      tags: [recyclebin]
      responses:
        "200":
          description: How many entries were deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedCount"
        default:
          $ref: "#/components/responses/Error"
  /recyclebin/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    delete:
      operationId: deleteRecycleEntry
      summary: Delete one recycle bin entry permanently (administrators)
      tags: [recyclebin]
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
  /recyclebin/{id}/restore:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: restoreRecycleEntry
      summary: Put a recycled file back where it was (library managers)
      description: Fails with `restore_conflict` when something else is at the original place.
      tags: [recyclebin]
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecycleEntry"
        default:
          $ref: "#/components/responses/Error"
  /settings/mediamanagement:
    get:
      operationId: getMediaManagement
