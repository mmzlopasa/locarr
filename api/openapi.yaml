      tags: [series]
      responses:
        "200":
          description: The decision report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InteractiveSearch"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: grabSeasonRelease
      summary: Grab a release chosen in an interactive season search (library managers)
      tags: [series]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualGrabRequest"
      responses:
        "201":
          description: Sent to a download client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueItem"
        default:
          $ref: "#/components/responses/Error"
  /episodes/wanted:
    get:
