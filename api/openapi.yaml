        - {name: q, in: query, required: false, schema: {type: string, maxLength: 200}}
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [title, year, added, rating, popularity, size, inCinemas, digital, physical]
            default: title
        - {name: desc, in: query, required: false, schema: {type: boolean, default: false}}
        - {name: offset, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
