      required: [ok]
      properties:
        ok: {type: boolean}
        message: {type: string}
    SmtpSecurity:
      type: string
      enum: [none, starttls, tls]
    SmtpSettings:
      type: object
      required: [host, port, security, username, password, from]
      properties:
        host: {type: string}
        port: {type: integer}
        security: {$ref: "#/components/schemas/SmtpSecurity"}
        username: {type: string}
        password: {$ref: "#/components/schemas/SecretState"}
        from: {type: string}
    SmtpSettingsInput:
      type: object
      properties:
        host: {type: string, maxLength: 253}
        port: {type: integer, minimum: 0, maximum: 65535}
        security: {$ref: "#/components/schemas/SmtpSecurity"}
        username: {type: string, maxLength: 200}
        password: {type: string, maxLength: 500, description: "Write-only. Omit to keep, an empty string to clear."}
        from: {type: string, maxLength: 254}
    NotificationSettings:
      type: object
      required: [baseUrl, smtp, subtitleMissingDays]
      properties:
        subtitleMissingDays: {type: integer, description: "subtitles.missing is sent when a file still lacks a wanted subtitle this many days after it arrived."}
        baseUrl: {type: string, description: "Locarr's address for links in messages (e.g. https://locarr.example.com)."}
        smtp: {$ref: "#/components/schemas/SmtpSettings"}
    NotificationSettingsInput:
      type: object
      properties:
        subtitleMissingDays: {type: integer, minimum: 1, maximum: 90}
        baseUrl: {type: string, maxLength: 500}
        smtp: {$ref: "#/components/schemas/SmtpSettingsInput"}
    MigrateKind:
      type: string
      enum: [sonarr, radarr, lidarr, prowlarr, bazarr, overseerr, seerr, qbittorrent, sabnzbd]
    MigrateScopes:
      type: object
      required: [settings, library, users, history]
      properties:
        settings: {type: boolean}
        library: {type: boolean}
        users: {type: boolean}
        history: {type: boolean}
    MigrateSource:
      type: object
      required: [id, kind, name, url, username, secretSet, appName, version, lastError, createdAt, supports]
      properties:
        id: {type: integer, format: int64}
        kind: {$ref: "#/components/schemas/MigrateKind"}
        name: {type: string}
        url: {type: string}
        username: {type: string}
        secretSet: {type: boolean, description: "The API key (or password) is stored; it is never returned."}
        appName: {type: string}
        version: {type: string}
        lastTestAt: {type: string, format: date-time}
        lastError: {type: string}
        createdAt: {type: string, format: date-time}
        supports: {$ref: "#/components/schemas/MigrateScopes"}
    MigrateSourceInput:
      type: object
      required: [kind, url]
      properties:
        kind: {$ref: "#/components/schemas/MigrateKind"}
        name: {type: string, maxLength: 100}
        url: {type: string, maxLength: 500, description: "http(s)://host:port with the URL base, if any"}
        username: {type: string, maxLength: 200, description: "qBittorrent only"}
        secret: {type: string, maxLength: 500, description: "The API key (qBittorrent: the password). Write-only."}
    MigrateTestResult:
      type: object
      required: [ok]
      properties:
        ok: {type: boolean}
        appName: {type: string}
        version: {type: string}
        code: {type: string, description: "unreachable, unauthorized, wrong_app, unsupported_version, bad_response, not_found"}
        message: {type: string}
    MigrateSourceOptions:
      type: object
      required: [id]
      properties:
        id: {type: integer, format: int64}
        settings: {type: boolean}
        library: {type: boolean}
        users: {type: boolean}
        history: {type: boolean}
        prowlarrMode:
          type: string
          enum: [source, direct]
          description: Prowlarr only - keep it as a synced indexer source, or add each indexer on its own.
        builtinReplace:
          type: boolean
          description: |
            Prowlarr only (default true) - add Locarr's built-in version of every Prowlarr indexer it knows,
            and usenet indexers as direct Newznab indexers, so Prowlarr is not needed afterwards.
    MigratePathMapping:
      type: object
      required: [sourceId, from, to]
      properties:
        sourceId: {type: integer, format: int64, description: "0 applies to every source"}
        from: {type: string, maxLength: 1000, description: "The folder as the source sees it"}
        to: {type: string, maxLength: 1000, description: "The same folder as Locarr sees it"}
    MigrateOptions:
      type: object
      required: [sources]
      properties:
        sources:
          type: array
          maxItems: 20
          items: {$ref: "#/components/schemas/MigrateSourceOptions"}
        pathMappings:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/MigratePathMapping"}
        historyDays: {type: integer, minimum: 1, maximum: 3650}
    MigrateRunOptions:
      type: object
      required: [sources, pathMappings, resolutions, historyDays]
      properties:
        sources:
          type: array
          items: {$ref: "#/components/schemas/MigrateSourceOptions"}
        pathMappings:
          type: array
          items: {$ref: "#/components/schemas/MigratePathMapping"}
        resolutions:
          type: object
          additionalProperties: {type: string}
        historyDays: {type: integer}
    MigrateProwlarrMode:
      type: object
      required: [sourceId, mode]
      properties:
        sourceId: {type: integer, format: int64}
        mode: {type: string, enum: [source, direct]}
    MigratePlanRequest:
      type: object
      properties:
        pathMappings:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/MigratePathMapping"}
        resolutions:
          type: object
          description: Plan item key → merge, rename or skip.
          additionalProperties: {type: string, enum: [merge, rename, skip]}
        prowlarrModes:
          type: array
          items: {$ref: "#/components/schemas/MigrateProwlarrMode"}
    MigratePathCheck:
      type: object
      required: [sourceId, sourcePath, localPath, inside, exists, files, found, missing]
      properties:
        sourceId: {type: integer, format: int64}
        sourcePath: {type: string}
        localPath: {type: string}
        inside: {type: boolean, description: "Inside the folders Locarr may use"}
        exists: {type: boolean}
        files: {type: integer}
        found: {type: integer}
        missing:
          type: array
          description: A few examples of files not found
          items: {type: string}
    MigrateProgress:
      type: object
      required: [phase, done, total, message]
      properties:
        phase: {type: string}
        done: {type: integer}
        total: {type: integer}
        message: {type: string}
    MigrateSourceSummary:
      type: object
      required: [id, kind, name, version, read, roots]
      properties:
        id: {type: integer, format: int64}
        kind: {$ref: "#/components/schemas/MigrateKind"}
        name: {type: string}
        version: {type: string}
        read:
          type: object
          additionalProperties: {type: integer}
        roots:
          type: array
          items: {type: string}
    MigrateRefresh:
      type: object
      required: [total, done, failed]
      properties:
        total: {type: integer}
        done: {type: integer}
        failed: {type: integer}
        error: {type: string}
    MigrateSummary:
      type: object
      required: [sources, pathChecks, suggested, counts, statuses, attention, conflicts, warnings]
      properties:
        sources:
          type: array
          items: {$ref: "#/components/schemas/MigrateSourceSummary"}
        pathChecks:
          type: array
          items: {$ref: "#/components/schemas/MigratePathCheck"}
        suggested:
          type: array
          items: {$ref: "#/components/schemas/MigratePathMapping"}
        counts:
          type: object
          description: Category → action → count
          additionalProperties:
            type: object
            additionalProperties: {type: integer}
        statuses:
          type: object
          additionalProperties: {type: integer}
        attention:
          type: object
          additionalProperties: {type: integer}
        conflicts: {type: integer}
        warnings:
          type: array
          items: {type: string}
        refresh: {$ref: "#/components/schemas/MigrateRefresh"}
        durationMs: {type: integer, format: int64}
    MigrateRunStatus:
      type: string
      enum: [analysing, analysed, planned, importing, done, failed, cancelled]
    MigrateRun:
      type: object
      required: [id, status, options, progress, summary, error, createdAt, updatedAt]
      properties:
        id: {type: integer, format: int64}
        status: {$ref: "#/components/schemas/MigrateRunStatus"}
        options: {$ref: "#/components/schemas/MigrateRunOptions"}
        progress: {$ref: "#/components/schemas/MigrateProgress"}
        summary: {$ref: "#/components/schemas/MigrateSummary"}
        error: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
    MigrateAction:
      type: string
      enum: [create, update, skip]
    MigrateItemStatus:
      type: string
      enum: [planned, done, failed, skipped]
    MigrateConflict:
      type: object
      required: [existing, options, chosen]
      properties:
        existing: {type: string}
        options:
          type: array
          items: {type: string, enum: [merge, rename, skip]}
        chosen: {type: string, enum: [merge, rename, skip]}
    MigrateItem:
      type: object
      required: [seq, key, sourceId, category, name, action, reason, message, attention, status, localRef, error]
      properties:
        seq: {type: integer}
        key: {type: string}
        sourceId: {type: integer, format: int64}
        category: {type: string}
        name: {type: string}
        action: {$ref: "#/components/schemas/MigrateAction"}
        reason: {type: string}
        message: {type: string}
        conflict: {$ref: "#/components/schemas/MigrateConflict"}
        attention:
          type: array
          items: {type: string}
        status: {$ref: "#/components/schemas/MigrateItemStatus"}
        localRef: {type: string}
        error: {type: string}
    MigrateItemList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/MigrateItem"}
        total: {type: integer}
    MigrateReport:
      type: object
      required: [run, sources, items, generated]
      properties:
        run: {$ref: "#/components/schemas/MigrateRun"}
        sources:
          type: array
          items: {$ref: "#/components/schemas/MigrateSource"}
        items:
          type: array
          items: {$ref: "#/components/schemas/MigrateItem"}
        generated: {type: string, format: date-time}
    MigrateCheckItem:
      type: object
      required: [key, done, manual, params]
      properties:
        key: {type: string}
        done: {type: boolean}
        manual: {type: boolean, description: "A step on another application that Locarr cannot check"}
        params:
          type: object
          additionalProperties: {type: string}
    BoardKind:
      type: string
      enum: [movie, episode, album, subtitle]
    BoardKindCounts:
      type: object
      required: [movie, episode, album, subtitle]
      properties:
        movie: {type: integer}
        episode: {type: integer}
        album: {type: integer}
        subtitle: {type: integer}
    BoardGroup:
      type: object
      required: [code, tone, fix, count, kinds, reasons, searches]
      properties:
        code:
          type: string
          description: |
            The explanation code (see `Explanation`) plus `stalled`, `path_not_visible`,
            `subtitle_not_searched`, `subtitle_not_found`, `subtitle_no_providers`, `subtitle_quota`.
        tone: {type: string, enum: [success, info, warning, danger]}
        fix:
          type: string
          description: |
            What usually fixes the group: path_mapping, permissions, client_category, disk_space,
            indexers, download_clients, subtitle_providers, manual_import, profile, or "".
        count: {type: integer}
        kinds: {$ref: "#/components/schemas/BoardKindCounts"}
        searches: {type: integer, description: "Searches made for the items of the group, added up."}
        reasons:
          type: array
          description: Rejection reasons of the items' last searches, added up (most common first, at most 8).
          items: {$ref: "#/components/schemas/ReasonCount"}
    BoardSummary:
      type: object
      required: [total, groups]
      properties:
        total: {type: integer}
        updatedAt: {type: string, format: date-time, description: "When the board was last rebuilt in full."}
        groups:
          type: array
          items: {$ref: "#/components/schemas/BoardGroup"}
    BoardItem:
      type: object
      required: [key, kind, itemRef, parentRef, title, code, tone, fix, message, params, reasons, searches, updatedAt]
      properties:
        key: {type: string}
        kind: {$ref: "#/components/schemas/BoardKind"}
        itemRef: {type: string}
        parentRef: {type: string, description: "The series or artist (\"\" for movies)."}
        title: {type: string}
        code: {type: string}
        tone: {type: string, enum: [success, info, warning, danger]}
        fix: {type: string}
        message: {type: string, description: "English text; clients render `code` and `params`."}
        params: {type: object, additionalProperties: true}
        reasons:
          type: array
          items: {$ref: "#/components/schemas/ReasonCount"}
        searches: {type: integer}
        downloadId: {type: integer, format: int64}
        qualityProfileId: {type: integer, format: int64}
        updatedAt: {type: string, format: date-time}
    BoardItemPage:
      type: object
      required: [total, items]
      properties:
        total: {type: integer}
        items:
          type: array
          items: {$ref: "#/components/schemas/BoardItem"}
    BoardActionRequest:
      type: object
      required: [action, keys]
      properties:
        action: {type: string, enum: [search, unmonitor, change_profile, blocklist_retry, retry_import]}
        keys:
          type: array
          minItems: 1
          maxItems: 5000
          items: {type: string, maxLength: 80}
        qualityProfileId: {type: integer, format: int64, minimum: 1}
    BoardActionFailure:
      type: object
      required: [key, code, message]
      properties:
        key: {type: string}
        code: {type: string}
        message: {type: string}
    BoardActionResult:
      type: object
      required: [done, failed]
      properties:
        done: {type: integer}
        failed:
          type: array
          items: {$ref: "#/components/schemas/BoardActionFailure"}
    HistoryCategory:
      type: string
      enum: [grabbed, imported, upgraded, failed, deleted, renamed, subtitles, notifications]
    HistoryEntry:
      type: object
      required: [id, at, category, type, itemRef, title, message]
      properties:
        id: {type: string, description: "Stable within its source (\"t:12\", \"d:7\", \"s:3\")."}
        at: {type: string, format: date-time}
        category: {$ref: "#/components/schemas/HistoryCategory"}
        type: {type: string}
        kind: {type: string, enum: [movie, series, music]}
        itemRef: {type: string}
        title: {type: string}
        release: {type: string}
        indexer: {type: string}
        client: {type: string}
        message: {type: string, description: "English summary; URLs carry no credentials or download tokens."}
        downloadId: {type: integer, format: int64}
        itemTitle:
          type: string
          description: |
            The item's title when the event happened ("" for older entries of an item that is gone).
            `title` is this or, when empty, the release.
        itemGone: {type: boolean, description: "The item is no longer in the library (no page to link to)."}
        data: {description: "Event details as on the item's timeline (shape depends on the type): code, indexer, until, error, title…"}
    HistoryPage:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/HistoryEntry"}
        hasMore: {type: boolean}
        retentionDays: {type: integer, description: "Entries older than this are deleted automatically; 0 = kept forever."}
    HistoryClearRequest:
      type: object
      properties:
        category: {$ref: "#/components/schemas/HistoryCategory"}
        kind: {$ref: "#/components/schemas/MediaKind"}
        q: {type: string, maxLength: 200}
        olderThanDays: {type: integer, minimum: 1, maximum: 36500, description: "Only entries older than this many days."}
        dryRun: {type: boolean, default: false}
        item:
          type: string
          maxLength: 64
          description: |
            Clear one item's timeline instead (D-109): every row it shows for the item (events, searches,
            download steps); `category`, `kind` and `q` are ignored. Adult items need the adult permission.
        ids:
          type: array
          maxItems: 500
          items: {type: string, pattern: "^[tds]:[0-9]{1,19}$"}
          description: With `item`, only these rows (one group of the timeline).
    HistoryClearResult:
      type: object
      required: [count, deleted]
      properties:
        count: {type: integer, format: int64}
        deleted: {type: boolean, description: "false for a dry run."}
    SourceStats:
      type: object
      required: [name, grabs, imported, failed, inProgress]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        grabs: {type: integer}
        imported: {type: integer}
        failed: {type: integer, description: "Downloads that failed in the client or were given up as stalled."}
        inProgress: {type: integer}
        successRate: {type: number, description: "imported / (imported + failed); absent when nothing finished."}
        avgImportSeconds: {type: integer, format: int64, description: "Average time from grab to import."}
    ActivityStats:
      type: object
      required: [days, indexers, clients]
      properties:
        days: {type: integer}
        indexers:
          type: array
          items: {$ref: "#/components/schemas/SourceStats"}
        clients:
          type: array
          items: {$ref: "#/components/schemas/SourceStats"}
    BlocklistCleared:
      type: object
      required: [count]
      properties:
        count: {type: integer}
    HealthSeverity:
      type: string
      enum: [error, warning, info]
    HealthIssue:
      type: object
      required: [key, check, severity, code, message, params, docs, since]
      properties:
        key: {type: string, description: "Unique per problem (\"indexer:3\", \"rootfolder:2:space\")."}
        check: {type: string}
        severity: {$ref: "#/components/schemas/HealthSeverity"}
        code: {type: string, description: "Stable code the clients translate."}
        message: {type: string, description: "English text."}
        params: {type: object, additionalProperties: true}
        docs: {type: string, description: "Anchor in docs/user/troubleshooting.md."}
        fixRoute: {type: string, description: "The web client page where it is fixed."}
        since: {type: string, format: date-time}
    HealthReport:
      type: object
      required: [issues]
      properties:
        checkedAt: {type: string, format: date-time}
        issues:
          type: array
          items: {$ref: "#/components/schemas/HealthIssue"}
    StatsRootFolder:
      type: object
      required: [path, kind, accessible]
      properties:
        path: {type: string}
        kind: {$ref: "#/components/schemas/MediaKind"}
        accessible: {type: boolean}
        freeBytes: {type: integer, format: int64}
        totalBytes: {type: integer, format: int64}
    Stats:
      type: object
      required: [version, commit, generatedAt, movies, moviesHave, moviesMissing, series, episodes, episodesHave, episodesMissing,
        artists, albums, albumsHave, albumsMissing, queueSize, activeDownloads, downloadSpeedBytes, wantedMovies, wantedEpisodes,
        wantedAlbums, failedImports, healthErrors, healthWarnings, healthInfo, indexers, indexersHealthy, indexersFailing,
        indexersDisabled, requestsPending, subtitlesMissing, rootFolders]
      properties:
        version: {type: string}
        commit: {type: string}
        generatedAt: {type: string, format: date-time}
        movies: {type: integer}
        moviesHave: {type: integer}
        moviesMissing: {type: integer, description: "Monitored movies without a file."}
        series: {type: integer}
        episodes: {type: integer}
        episodesHave: {type: integer}
        episodesMissing: {type: integer, description: "Monitored episodes that aired and have no file."}
        artists: {type: integer}
        albums: {type: integer}
        albumsHave: {type: integer, description: "Albums with at least one track file."}
        albumsMissing: {type: integer, description: "Monitored released albums without any track file."}
        queueSize: {type: integer, description: "Downloads still in a client (active or waiting for import)."}
        activeDownloads: {type: integer}
        downloadSpeedBytes: {type: integer, format: int64, description: "Total download speed in bytes per second."}
        wantedMovies: {type: integer, description: "Monitored, available movies without a file."}
        wantedEpisodes: {type: integer}
        wantedAlbums: {type: integer}
        failedImports: {type: integer, description: "Finished downloads whose import failed."}
        healthErrors: {type: integer}
        healthWarnings: {type: integer}
        healthInfo: {type: integer}
        indexers: {type: integer}
        indexersHealthy: {type: integer}
        indexersFailing: {type: integer}
        indexersDisabled: {type: integer}
        requestsPending: {type: integer}
        subtitlesMissing: {type: integer, description: "Files missing at least one wanted subtitle language."}
        adultItems: {type: integer, description: "Total adult items; present only when the adult library is enabled and the administrator opted in. Never broken down."}
        lastRssSyncAt: {type: string, format: date-time}
        rootFolders:
          type: array
          items: {$ref: "#/components/schemas/StatsRootFolder"}
    LogLevel:
      type: string
      enum: [debug, info, warn, error]
    LogEntry:
      type: object
      required: [seq, time, level, message, fields]
      properties:
        seq: {type: integer, format: int64}
        time: {type: string, format: date-time}
        level: {$ref: "#/components/schemas/LogLevel"}
        message: {type: string}
        fields: {type: object, additionalProperties: true}
    LogFile:
      type: object
      required: [name, size, modifiedAt]
      properties:
        name: {type: string}
        size: {type: integer, format: int64}
        modifiedAt: {type: string, format: date-time}
    Backup:
      type: object
      required: [name, kind, size, createdAt]
      properties:
        name: {type: string}
        kind: {type: string, enum: [scheduled, manual, pre_restore, uploaded]}
        size: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
        version: {type: string, description: "Locarr version that made it."}
    RestoreStarted:
      type: object
      required: [restarting]
      properties:
        restarting: {type: boolean}
        preRestoreBackup: {type: string, description: "The backup of the state before the restore."}
    SystemSettings:
      type: object
      required: [updateCheck, minFreeSpaceGb, recycleBinWarnGb, stuckImportMinutes, backupIntervalHours, backupKeep, historyDays, timelineDays,
        searchLogDays, downloadEventsDays, releasesSeenDays, vacuumIntervalDays, imageCacheMaxMb, metricsTokenSet]
      properties:
        updateCheck: {type: boolean, description: "Ask GitHub once a day whether a newer Locarr exists."}
        minFreeSpaceGb: {type: integer}
        recycleBinWarnGb: {type: integer}
        stuckImportMinutes: {type: integer}
        backupIntervalHours: {type: integer, description: "0 turns scheduled backups off."}
        backupKeep: {type: integer}
        historyDays: {type: integer, description: "Activity history retention; 0 keeps it forever."}
        timelineDays: {type: integer}
        searchLogDays: {type: integer}
        downloadEventsDays: {type: integer}
        releasesSeenDays: {type: integer}
        vacuumIntervalDays: {type: integer, description: "0 turns the database compaction off."}
        imageCacheMaxMb: {type: integer}
        metricsTokenSet: {type: boolean}
    SystemSettingsInput:
      type: object
      properties:
        updateCheck: {type: boolean}
        minFreeSpaceGb: {type: integer, minimum: 0, maximum: 100000}
        recycleBinWarnGb: {type: integer, minimum: 0, maximum: 1000000}
        stuckImportMinutes: {type: integer, minimum: 5, maximum: 100000}
        backupIntervalHours: {type: integer, minimum: 0, maximum: 8760}
        backupKeep: {type: integer, minimum: 1, maximum: 365}
        historyDays: {type: integer, minimum: 0, maximum: 36500}
        timelineDays: {type: integer, minimum: 7, maximum: 36500}
        searchLogDays: {type: integer, minimum: 1, maximum: 36500}
        downloadEventsDays: {type: integer, minimum: 7, maximum: 36500}
        releasesSeenDays: {type: integer, minimum: 1, maximum: 365}
        vacuumIntervalDays: {type: integer, minimum: 0, maximum: 365}
        imageCacheMaxMb: {type: integer, minimum: 50, maximum: 1000000}
        metricsToken: {type: string, maxLength: 200}
