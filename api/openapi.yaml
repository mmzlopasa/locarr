      - $ref: "#/components/parameters/SubtitleItemRef"
    get:
      operationId: manualSubtitleSearch
      summary: "Manual search: every provider's results with scores (managers)"
      tags: [subtitles]
      parameters:
        - name: language
          in: query
          required: false
          description: One language instead of the profile's.
          schema: {type: string, maxLength: 10}
      responses:
        "200":
          description: Scored results
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SubtitleManualSearch"}
        default:
          $ref: "#/components/responses/Error"
