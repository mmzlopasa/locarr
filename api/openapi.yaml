openapi: 3.1.0
info:
  title: Locarr API
  version: 0.1.0
  description: |
    Locarr API. This file is the single source of truth: the server interfaces (ogen)
    and the web client types (openapi-typescript) are generated from it by
    `scripts/gen-api.sh`.

    Authentication: `Authorization: Bearer <token>` with a session token (from
    `/auth/login` or `/setup`) or an API key (`lk_…`). API keys may also be sent as
    `X-Api-Key`. The web client uses the HttpOnly `locarr_session` cookie instead
    (`useCookie: true`). Read-only API keys may only call `GET` operations.

    Every error under `/api` is JSON: `{"code": "...", "message": "..."}`. `code`
    is stable and meant for clients; `message` is English text for logs.
servers:
  - url: /api/v1
tags:
  - name: system
  - name: music
  - name: setup
  - name: auth
  - name: sessions
  - name: apikeys
  - name: adult
  - name: twofactor
  - name: users
  - name: settings
  - name: rootfolders
  - name: filesystem
  - name: indexers
  - name: search
  - name: downloadclients
  - name: remotepathmappings
  - name: queue
  - name: quality
  - name: customformats
  - name: profiles
  - name: parse
  - name: movies
  - name: series
  - name: timeline
  - name: calendar
  - name: images
  - name: recyclebin
  - name: subtitles
  - name: discover
  - name: requests
  - name: issues
  - name: notifications
  - name: migrate
  - name: invites
  - name: mediaserver
  - name: board
  - name: history
security:
  - sessionToken: []
paths:
  /system/info:
    get:
      operationId: getSystemInfo
      summary: Public server information
      description: Unauthenticated. Clients use it to check a server address and whether first-run setup is needed.
      tags: [system]
      security: []
      responses:
        "200":
          description: Server information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
        default:
          $ref: "#/components/responses/Error"
  /system/status:
    get:
      operationId: getSystemStatus
      summary: Runtime status (administrators)
      tags: [system]
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        default:
          $ref: "#/components/responses/Error"
  /system/tasks:
    get:
      operationId: listTasks
      summary: Scheduled tasks and recent job history (administrators)
      tags: [system]
      parameters:
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/JobState"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        default:
          $ref: "#/components/responses/Error"
  /system/tasks/{name}/run:
    post:
      operationId: runTask
      summary: Run a scheduled task now (administrators)
      description: Queues the task unless a run of it is already queued or running; then that run is returned.
      tags: [system]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
      responses:
        "202":
          description: Queued (or already queued)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        default:
          $ref: "#/components/responses/Error"
  /system/jobs/{id}/cancel:
    post:
      operationId: cancelJob
      summary: Cancel a queued or running job (administrators)
      tags: [system]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Cancelled (a running job stops at its next check)
        default:
          $ref: "#/components/responses/Error"
  /setup:
    post:
      operationId: setup
      summary: Create the first administrator
      description: |
        Only works while no administrator exists. Needs the setup code the server
        prints to its log on start. Signs the new administrator in.
      tags: [setup]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        default:
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      operationId: login
      summary: Sign in
      description: |
        When the account has two-factor authentication on and neither `totpCode` nor
        `recoveryCode` is given, the answer is 401 with code `totp_required`; send the
        same request again with a code.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        default:
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      tags: [auth]
      responses:
        "204":
          description: Signed out
          headers:
            Set-Cookie:
              description: Clears the web session cookie.
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /auth/me:
    get:
      operationId: getMe
      summary: The signed-in user
      tags: [auth]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateMe
      summary: Change own preferences
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
  /auth/password:
    post:
      operationId: changePassword
      summary: Change own password
      description: Signs out every other session of the account; the current one stays.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Changed
        default:
          $ref: "#/components/responses/Error"
  /auth/sessions:
    get:
      operationId: listSessions
      summary: Own signed-in devices
      tags: [sessions]
      responses:
        "200":
          description: Sessions, most recently used first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      summary: Sign out a device
      tags: [sessions]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Revoked
        default:
          $ref: "#/components/responses/Error"
  /auth/apikeys:
    get:
      operationId: listApiKeys
      summary: Own API keys
      tags: [apikeys]
      responses:
        "200":
          description: API keys (never the key itself)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createApiKey
      summary: Create an API key
      description: The key is returned once and cannot be shown again. Needs a session (not an API key).
      tags: [apikeys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiKey"
        default:
          $ref: "#/components/responses/Error"
  /auth/apikeys/{id}:
    delete:
      operationId: deleteApiKey
      summary: Revoke an API key
      tags: [apikeys]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Revoked
        default:
          $ref: "#/components/responses/Error"
  /auth/totp/setup:
    post:
      operationId: startTotpSetup
      summary: Start two-factor setup
      description: Returns a new secret to add to an authenticator app. Two-factor is on only after `/auth/totp/enable`.
      tags: [twofactor]
      responses:
        "200":
          description: Secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpSetup"
        default:
          $ref: "#/components/responses/Error"
  /auth/totp/enable:
    post:
      operationId: enableTotp
      summary: Confirm two-factor setup with a code
      tags: [twofactor]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCodeRequest"
      responses:
        "200":
          description: Two-factor is on; recovery codes are shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        default:
          $ref: "#/components/responses/Error"
  /auth/totp/disable:
    post:
      operationId: disableTotp
      summary: Turn two-factor off
      tags: [twofactor]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirm"
      responses:
        "204":
          description: Two-factor is off
        default:
          $ref: "#/components/responses/Error"
  /auth/totp/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      summary: Replace the recovery codes
      tags: [twofactor]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirm"
      responses:
        "200":
          description: New recovery codes (the old ones stop working)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        default:
          $ref: "#/components/responses/Error"
  /users:
    get:
      operationId: listUsers
      summary: All users (administrators)
      tags: [users]
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createUser
      summary: Create a user (administrators)
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
  /users/{id}:
    get:
      operationId: getUser
      summary: One user (administrators)
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateUser
      summary: Change role, permissions or disable a user (administrators)
      description: The last enabled administrator cannot be demoted or disabled.
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteUser
      summary: Delete a user (administrators)
      description: Not the caller's own account and not the last enabled administrator.
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
  /users/{id}/password:
    post:
      operationId: resetUserPassword
      summary: Set a user's password (administrators)
      description: Signs the user out everywhere and clears an account lockout.
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password set
        default:
          $ref: "#/components/responses/Error"
  /settings:
    get:
      operationId: getSettings
      summary: Server settings (administrators)
      description: Secret fields only say whether they are set; their values never leave the server.
      tags: [settings]
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateSettings
      summary: Change server settings (administrators)
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequest"
      responses:
        "200":
          description: Settings after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        default:
          $ref: "#/components/responses/Error"
  /rootfolders:
    get:
      operationId: listRootFolders
      summary: Root folders with free space (administrators)
      tags: [rootfolders]
      responses:
        "200":
          description: Root folders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RootFolder"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createRootFolder
      summary: Add a root folder (administrators)
      description: The folder must be inside one of the allowed data roots (`LOCARR_DATA_ROOTS`); it must exist unless `create` is set.
      tags: [rootfolders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRootFolderRequest"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootFolder"
        default:
          $ref: "#/components/responses/Error"
  /rootfolders/{id}:
    delete:
      operationId: deleteRootFolder
      summary: Remove a root folder (administrators)
      description: Only forgets the folder; nothing on disk is touched.
      tags: [rootfolders]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /filesystem:
    get:
      operationId: browseFilesystem
      summary: List folders inside the allowed data roots (administrators)
      description: Without `path`, lists the data roots themselves.
      tags: [filesystem]
      parameters:
        - name: path
          in: query
          required: false
          schema:
            type: string
            maxLength: 4096
      responses:
        "200":
          description: Folders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderListing"
        default:
          $ref: "#/components/responses/Error"
  /indexers:
    get:
      operationId: listIndexers
      summary: Indexers with their health (administrators)
      tags: [indexers]
      responses:
        "200":
          description: Indexers, by priority then name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Indexer"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createIndexer
      summary: Add a Torznab/Newznab indexer or a built-in site (administrators)
      description: |
        Categories left empty are filled from the indexer's capabilities when they
        can be fetched (for a built-in site, from its definition). The API key is write-only.
        For a built-in site (`kind: native`, `definition`), unset fields take the site's
        defaults: its address, request limit, timeout and RSS (off when the site has no
        list of latest releases).
      tags: [indexers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndexerInput"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Indexer"
        default:
          $ref: "#/components/responses/Error"
  /indexers/{id}:
    get:
      operationId: getIndexer
      summary: One indexer (administrators)
      tags: [indexers]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Indexer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Indexer"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateIndexer
      summary: Change an indexer (administrators)
      description: Write-only fields (`apiKey`, `proxyPassword`) keep their stored value when absent; an empty string removes it.
      tags: [indexers]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndexerInput"
      responses:
        "200":
          description: Indexer after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Indexer"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteIndexer
      summary: Remove an indexer (administrators)
      tags: [indexers]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /indexers/{id}/test:
    post:
      operationId: testIndexer
      summary: Test a saved indexer (administrators)
      description: Fetches the capabilities and runs a probe search. Success clears the indexer's failures; the capabilities are stored.
      tags: [indexers]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Test result (also when the indexer failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexerTestResult"
        default:
          $ref: "#/components/responses/Error"
  /indexers/{id}/health/reset:
    post:
      operationId: resetIndexerHealth
      summary: Clear failures and backoff (administrators)
      tags: [indexers]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Indexer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Indexer"
        default:
          $ref: "#/components/responses/Error"
  /indexers/{id}/download:
    get:
      operationId: downloadRelease
      summary: Download a release file through the server (administrators and managers)
      description: |
        `token` comes from a search result's `downloadLink`. The server fetches the
        .torrent or .nzb with the indexer's credentials, so the API key never
        reaches the browser. Counts as a grab for the indexer's daily limit.
      tags: [indexers]
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: token
          in: query
          required: true
          schema:
            type: string
            maxLength: 8192
      responses:
        "200":
          description: The release file
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /indexers/test:
    post:
      operationId: testIndexerConfig
      summary: Test an indexer configuration before saving it (administrators)
      description: When `indexerId` is set, missing write-only fields are taken from that saved indexer.
      tags: [indexers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndexerTestRequest"
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexerTestResult"
        default:
          $ref: "#/components/responses/Error"
  /indexers/settings:
    get:
      operationId: getIndexerSettings
      summary: Indexer-wide settings (administrators)
      tags: [indexers]
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexerSettings"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateIndexerSettings
      summary: Change indexer-wide settings (administrators)
      tags: [indexers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIndexerSettingsRequest"
      responses:
        "200":
          description: Settings after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexerSettings"
        default:
          $ref: "#/components/responses/Error"
  /indexers/browser:
    get:
      operationId: getIndexerBrowser
      summary: State of the built-in browser for sites behind a browser check (administrators)
      tags: [indexers]
      responses:
        "200":
          description: Browser state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexerBrowserStatus"
        default:
          $ref: "#/components/responses/Error"
  /indexers/browser/test:
    post:
      operationId: testIndexerBrowser
      summary: Have the built-in browser pass a test check (administrators)
      description: |
        Without `url` the browser opens its own built-in test page (a JavaScript check that sets a cookie and
        reloads); with `variant: human` it opens a page that asks for a CAPTCHA, which must be reported as
        `human`. With `url` it opens that page with the indexers' address policy.
      tags: [indexers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndexerBrowserTestRequest"
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexerBrowserTestResult"
        default:
          $ref: "#/components/responses/Error"
  /indexers/definitions:
    get:
      operationId: listIndexerDefinitions
      summary: Built-in and custom site definitions, usenet presets and definition load errors (administrators)
      tags: [indexers]
      responses:
        "200":
          description: Catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexerCatalog"
        default:
          $ref: "#/components/responses/Error"
  /indexers/definitions/reload:
    post:
      operationId: reloadIndexerDefinitions
      summary: Re-read the custom definitions folder (administrators)
      description: Invalid files are skipped and listed in `errors`; indexers pick up changed definitions immediately.
      tags: [indexers]
      responses:
        "200":
          description: Catalog after the reload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexerCatalog"
        default:
          $ref: "#/components/responses/Error"
  /indexers/sources:
    get:
      operationId: listIndexerSources
      summary: Prowlarr and Jackett instances indexers are imported from (administrators)
      tags: [indexers]
      responses:
        "200":
          description: Sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IndexerSource"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createIndexerSource
      summary: Add a Prowlarr or Jackett source and import its indexers (administrators)
      description: Imports every indexer the source lists except those in `exclude`. Nothing is changed on the source.
      tags: [indexers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndexerSourceInput"
      responses:
        "201":
          description: Added and synced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexerSourceSyncResult"
        default:
          $ref: "#/components/responses/Error"
  /indexers/sources/preview:
    post:
      operationId: previewIndexerSource
      summary: List what a Prowlarr or Jackett source would import (administrators)
      tags: [indexers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndexerSourcePreviewRequest"
      responses:
        "200":
          description: Preview; nothing is saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexerSourcePreview"
        default:
          $ref: "#/components/responses/Error"
  /indexers/sources/{id}:
    delete:
      operationId: deleteIndexerSource
      summary: Forget a source (administrators)
      description: Its imported indexers stay and become ordinary indexers.
      tags: [indexers]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /indexers/sources/{id}/sync:
    post:
      operationId: syncIndexerSource
      summary: Sync a source again (administrators)
      description: Adds indexers that are new on the source, updates changed ones and disables (never deletes) those the source no longer lists.
      tags: [indexers]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexerSourceSyncResult"
        default:
          $ref: "#/components/responses/Error"
  /search:
    get:
      operationId: search
      summary: Search every eligible indexer and wait for all answers
      description: |
        Indexers are asked in parallel, each with its own timeout and request limit.
        Results are de-duplicated by GUID and info hash. Download links and magnets are
        only included for administrators and managers.
      tags: [search]
      parameters:
        - $ref: "#/components/parameters/SearchQ"
        - $ref: "#/components/parameters/SearchType"
        - $ref: "#/components/parameters/SearchCategories"
        - $ref: "#/components/parameters/SearchIndexerIds"
        - $ref: "#/components/parameters/SearchImdbId"
        - $ref: "#/components/parameters/SearchTmdbId"
        - $ref: "#/components/parameters/SearchTvdbId"
        - $ref: "#/components/parameters/SearchTvmazeId"
        - $ref: "#/components/parameters/SearchSeason"
        - $ref: "#/components/parameters/SearchEpisode"
        - $ref: "#/components/parameters/SearchArtist"
        - $ref: "#/components/parameters/SearchAlbum"
        - $ref: "#/components/parameters/SearchAuthor"
        - $ref: "#/components/parameters/SearchTitle"
        - $ref: "#/components/parameters/SearchLimit"
        - $ref: "#/components/parameters/SearchOffset"
      responses:
        "200":
          description: Results of every indexer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        default:
          $ref: "#/components/responses/Error"
  /search/stream:
    get:
      operationId: searchStream
      summary: Search every eligible indexer, streaming results as they arrive
      description: |
        Same parameters as `/search`. The answer is a Server-Sent Events stream
        (`text/event-stream`). Each event's `data` is one line of JSON:

        - `event: indexer` — one indexer answered (or was skipped): a `SearchStreamIndexerEvent`
          with that indexer's status and its releases not already sent.
        - `event: done` — every indexer is finished: a `SearchStreamDone`. The stream then ends.

        Browsers can read it with `EventSource` (the session cookie is sent) or `fetch`.
      tags: [search]
      parameters:
        - $ref: "#/components/parameters/SearchQ"
        - $ref: "#/components/parameters/SearchType"
        - $ref: "#/components/parameters/SearchCategories"
        - $ref: "#/components/parameters/SearchIndexerIds"
        - $ref: "#/components/parameters/SearchImdbId"
        - $ref: "#/components/parameters/SearchTmdbId"
        - $ref: "#/components/parameters/SearchTvdbId"
        - $ref: "#/components/parameters/SearchTvmazeId"
        - $ref: "#/components/parameters/SearchSeason"
        - $ref: "#/components/parameters/SearchEpisode"
        - $ref: "#/components/parameters/SearchArtist"
        - $ref: "#/components/parameters/SearchAlbum"
        - $ref: "#/components/parameters/SearchAuthor"
        - $ref: "#/components/parameters/SearchTitle"
        - $ref: "#/components/parameters/SearchLimit"
        - $ref: "#/components/parameters/SearchOffset"
      responses:
        "200":
          description: Server-Sent Events
          content:
            text/event-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /search/log:
    get:
      operationId: listSearchLog
      summary: Recent searches with per-indexer outcomes (administrators)
      tags: [search]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: itemRef
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchLogEntry"
        default:
          $ref: "#/components/responses/Error"
  /downloadclients:
    get:
      operationId: listDownloadClients
      summary: Download clients with their last status (administrators)
      tags: [downloadclients]
      responses:
        "200":
          description: Clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DownloadClient"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createDownloadClient
      summary: Add a download client (administrators)
      tags: [downloadclients]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadClientInput"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadClient"
        default:
          $ref: "#/components/responses/Error"
  /downloadclients/implementations:
    get:
      operationId: listDownloadClientImplementations
      summary: Supported clients, the fields each needs and what each can do (administrators)
      tags: [downloadclients]
      responses:
        "200":
          description: Implementations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DownloadClientImplementation"
        default:
          $ref: "#/components/responses/Error"
  /downloadclients/test:
    post:
      operationId: testDownloadClient
      summary: Test a client configuration (administrators)
      description: |
        Always answers 200 with the outcome. With `id`, password and API key left out
        are taken from that stored client. `errorCode` is one of `auth_failed`,
        `unreachable`, `tls_untrusted`, `wrong_url`, `address_blocked`, `client_error`,
        `unsupported`, `invalid` or `category_missing` (then `ok` is true and
        `missingCategories` lists them).
      tags: [downloadclients]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadClientTestRequest"
      responses:
        "200":
          description: Outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadClientTestResult"
        default:
          $ref: "#/components/responses/Error"
  /downloadclients/settings:
    get:
      operationId: getDownloadSettings
      summary: Download tracking settings (administrators)
      tags: [downloadclients]
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadSettings"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateDownloadSettings
      summary: Change download tracking settings (administrators)
      tags: [downloadclients]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDownloadSettings"
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadSettings"
        default:
          $ref: "#/components/responses/Error"
  /downloadclients/{id}:
    get:
      operationId: getDownloadClient
