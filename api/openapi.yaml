        - {name: path, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 4096}}
        - {name: seriesId, in: query, required: false, schema: {type: integer, format: int64}}
      responses:
        "200":
          description: Files with their series, episodes and verdict
          content:
            application/json:
              schema:
                type: array
