          $ref: "#/components/responses/Error"
    put:
      operationId: updateSubtitleTranslationSettings
      summary: Change translation options (administrators)
      tags: [subtitles]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SubtitleTranslationSettingsInput"}
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SubtitleTranslationSettings"}
        default:
          $ref: "#/components/responses/Error"
  /subtitles/items/{ref}/translate:
    parameters:
      - $ref: "#/components/parameters/SubtitleItemRef"
