    parameters:
      - $ref: "#/components/parameters/SubtitleTranslatorName"
    post:
      operationId: resetSubtitleTranslatorHealth
      summary: Clear a translation service's backoff (managers)
      tags: [subtitles]
      responses:
        "200":
          description: Reset
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SubtitleTranslator"}
        default:
          $ref: "#/components/responses/Error"
  /subtitles/translation:
    get:
      operationId: getSubtitleTranslationSettings
      summary: Translation options (administrators)
      tags: [subtitles]
      responses:
        "200":
          description: Options
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SubtitleTranslationSettings"}
