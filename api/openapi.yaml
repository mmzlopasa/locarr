          application/json:
            schema:
              type: object
              properties:
                text: {type: string, maxLength: 500}
                from: {type: string, maxLength: 10}
                to: {type: string, maxLength: 10}
      responses:
        "200":
          description: The translation
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SubtitleTranslatorTest"}
        default:
          $ref: "#/components/responses/Error"
