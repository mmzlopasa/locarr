        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateCustomFormat
      summary: Replace a custom format (administrators)
      tags: [customformats]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
