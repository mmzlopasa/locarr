      tags: [queue]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriorityRequest"
      responses:
        "204":
          description: Moved
        default:
          $ref: "#/components/responses/Error"
  /queue/{id}/events:
    get:
      operationId: listQueueItemEvents
      summary: State history of one download (library managers)
      tags: [queue]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
