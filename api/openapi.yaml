          description: missing = not running or not reachable; unauthorized = the token differs.
        url:
          type: string
        message:
          type: string
        command:
          type: string
          description: The command that starts the browser next to a compose install.
        version:
          type: string
          description: Version of the browser's control server.
        chromium:
          type: string
          description: Chromium version, once the browser has started.
        running:
          type: boolean
          description: Chromium is running (it stops when idle and starts on demand).
        sandbox:
          type: boolean
          description: Chromium runs with its own sandbox.
        tabs:
          type: integer
        tabsInUse:
          type: integer
        solves:
          type: integer
        restarts:
          type: integer
        lastSolve:
          $ref: "#/components/schemas/IndexerBrowserSolve"
    IndexerBrowserSolve:
      type: object
      required: [at, host, outcome, elapsedMs]
      properties:
        at:
          type: string
          format: date-time
        host:
          type: string
        outcome:
          type: string
          description: solved, human, timeout, blocked, refused, error, browser_missing or browser_failed.
        message:
          type: string
        elapsedMs:
          type: integer
          format: int64
    IndexerBrowserTestRequest:
      type: object
      properties:
        url:
          type: string
          maxLength: 2000
          description: A page to open instead of the built-in test page.
        variant:
          type: string
          enum: [js, human]
          description: Which built-in test page (default js).
    IndexerBrowserTestResult:
      type: object
      required: [passed, outcome, elapsedMs, challenged, cookies]
      properties:
        passed:
          type: boolean
        outcome:
          type: string
          description: solved, human, timeout, blocked, refused or error.
        message:
          type: string
        title:
          type: string
        challenged:
          type: boolean
          description: A browser check was seen on the way.
        cookies:
          type: integer
          description: Cookies the page set.
        elapsedMs:
          type: integer
          format: int64
    IndexerCatalog:
      type: object
      required: [definitions, presets, errors, customDir]
      properties:
        definitions:
          type: array
          items:
            $ref: "#/components/schemas/IndexerDefinition"
        presets:
          type: array
          items:
            $ref: "#/components/schemas/UsenetPreset"
        errors:
          type: array
          description: Custom definition files that could not be loaded.
          items:
            $ref: "#/components/schemas/IndexerDefinitionError"
        customDir:
          type: string
          description: The folder custom definitions are read from.
    IndexerDefinitionError:
      type: object
      required: [file, message]
      properties:
        file:
          type: string
        message:
          type: string
    IndexerDefinition:
      type: object
      required: [id, name, description, version, builtin, overrides, protocol, links, verified, challenge, flaresolverr, rss,
        searching, categories, settings, indexerIds, aliases]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        version:
          type: integer
        builtin:
          type: boolean
        overrides:
          type: boolean
        adult:
          type: boolean
          description: >-
            The site carries only adult content: it answers adult searches and RSS only. Such definitions are
            listed only while the adult library is on.
        file:
          type: string
          description: "For a custom definition: its file name in the custom folder."
        protocol:
          $ref: "#/components/schemas/Protocol"
        language:
          type: string
        links:
          type: array
          description: The site's addresses; the first is the default, the others known mirrors.
          items:
            type: string
        verified:
          type: string
          description: How the definition was written and checked.
        challenge:
          type: string
          enum: [never, sometimes, always]
          description: Whether the site shows a browser check (passed by the built-in browser or FlareSolverr).
        flaresolverr:
          type: string
          enum: [never, sometimes, always]
          deprecated: true
          description: Old name of `challenge`, always equal to it.
        rateLimit:
          $ref: "#/components/schemas/IndexerRateLimit"
        rss:
          type: boolean
          description: The site lists its latest releases (RSS sync).
        searching:
          type: array
          items:
            $ref: "#/components/schemas/IndexerSearchCap"
        categories:
          type: array
          description: Newznab categories the site's categories map onto.
          items:
            $ref: "#/components/schemas/IndexerCategory"
        settings:
          type: array
          items:
            $ref: "#/components/schemas/IndexerDefinitionSetting"
        aliases:
          type: array
          items:
            type: string
        indexerIds:
          type: array
          description: Indexers that use this definition.
          items:
            type: integer
            format: int64
    IndexerRateLimit:
      type: object
      required: [requests, periodSeconds]
      properties:
        requests:
          type: integer
        periodSeconds:
          type: integer
    IndexerDefinitionSetting:
      type: object
