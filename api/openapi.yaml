          application/json:
            schema: {$ref: "#/components/schemas/SubtitleProfileInput"}
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SubtitleProfile"}
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteSubtitleProfile
      summary: Delete a subtitle language profile (administrators)
      description: A profile that is a default cannot be deleted (`subtitle_profile_in_use`); items that used it fall back to the default.
      tags: [subtitles]
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
  /subtitles/settings:
    get:
      operationId: getSubtitleSettings
      summary: Subtitle options (administrators)
      tags: [subtitles]
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SubtitleSettings"}
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateSubtitleSettings
      summary: Change subtitle options (administrators)
      tags: [subtitles]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SubtitleSettingsInput"}
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SubtitleSettings"}
        default:
          $ref: "#/components/responses/Error"
  /subtitles/providers:
    get:
      operationId: listSubtitleProviders
      summary: Subtitle providers with health and quota (managers)
      tags: [subtitles]
      responses:
        "200":
