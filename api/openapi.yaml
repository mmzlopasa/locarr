        tokens are fetched through that indexer (its credentials, grab limit and
        seeding goals apply).
      properties:
        downloadUrl:
          type: string
          maxLength: 8192
          description: An http(s) link to a .torrent or .nzb, or a magnet link.
        downloadToken:
          type: string
          maxLength: 8192
          description: The `token` of a search result's `downloadLink` (needs `indexerId`).
        protocol:
          $ref: "#/components/schemas/DownloadProtocol"
        title:
          type: string
          minLength: 1
          maxLength: 500
        indexerId:
          type: integer
          format: int64
        indexer:
          type: string
          maxLength: 200
        guid:
          type: string
          maxLength: 2000
        mediaKind:
          $ref: "#/components/schemas/MediaKind"
        itemRef:
          description: Opaque JSON for the importer (up to 16 KiB).
        tags:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 50
        clientId:
          type: integer
          format: int64
        seedRatio:
          type: number
          format: double
          minimum: 0
          description: Seeding goal from the indexer settings (overrides the client's).
        seedTimeMinutes:
          type: integer
          minimum: 0
        publishedAt:
          type: string
          format: date-time
