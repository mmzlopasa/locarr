openapi: 3.1.0
info:
  title: Locarr API
  version: 0.1.0
  description: |
    Locarr API. This file is the single source of truth: the server interfaces (ogen)
    and the web client types (openapi-typescript) are generated from it by
    `scripts/gen-api.sh`.

    Authentication: `Authorization: Bearer <token>` with a session token (from
    `/auth/login` or `/setup`) or an API key (`lk_…`). API keys may also be sent as
    `X-Api-Key`. The web client uses the HttpOnly `locarr_session` cookie instead
    (`useCookie: true`). Read-only API keys may only call `GET` operations.

    Every error under `/api` is JSON: `{"code": "...", "message": "..."}`. `code`
    is stable and meant for clients; `message` is English text for logs.
servers:
  - url: /api/v1
tags:
  - name: system
  - name: setup
  - name: auth
  - name: sessions
  - name: apikeys
  - name: twofactor
  - name: users
  - name: settings
  - name: rootfolders
  - name: filesystem
  - name: indexers
  - name: search
  - name: downloadclients
  - name: remotepathmappings
  - name: queue
security:
  - sessionToken: []
paths:
  /system/info:
    get:
      operationId: getSystemInfo
      summary: Public server information
      description: Unauthenticated. Clients use it to check a server address and whether first-run setup is needed.
      tags: [system]
      security: []
      responses:
        "200":
          description: Server information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
        default:
          $ref: "#/components/responses/Error"
  /system/status:
    get:
      operationId: getSystemStatus
      summary: Runtime status (administrators)
      tags: [system]
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        default:
          $ref: "#/components/responses/Error"
  /system/tasks:
    get:
      operationId: listTasks
      summary: Scheduled tasks and recent job history (administrators)
      tags: [system]
      parameters:
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/JobState"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        default:
          $ref: "#/components/responses/Error"
  /system/tasks/{name}/run:
    post:
      operationId: runTask
      summary: Run a scheduled task now (administrators)
      description: Queues the task unless a run of it is already queued or running; then that run is returned.
      tags: [system]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
      responses:
        "202":
          description: Queued (or already queued)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        default:
          $ref: "#/components/responses/Error"
  /system/jobs/{id}/cancel:
    post:
      operationId: cancelJob
      summary: Cancel a queued or running job (administrators)
      tags: [system]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Cancelled (a running job stops at its next check)
        default:
          $ref: "#/components/responses/Error"
  /setup:
    post:
      operationId: setup
      summary: Create the first administrator
      description: |
        Only works while no administrator exists. Needs the setup code the server
        prints to its log on start. Signs the new administrator in.
      tags: [setup]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        default:
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      operationId: login
      summary: Sign in
      description: |
        When the account has two-factor authentication on and neither `totpCode` nor
        `recoveryCode` is given, the answer is 401 with code `totp_required`; send the
        same request again with a code.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        default:
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      tags: [auth]
      responses:
        "204":
          description: Signed out
          headers:
            Set-Cookie:
              description: Clears the web session cookie.
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /auth/me:
    get:
      operationId: getMe
      summary: The signed-in user
      tags: [auth]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateMe
      summary: Change own preferences
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
  /auth/password:
    post:
      operationId: changePassword
      summary: Change own password
      description: Signs out every other session of the account; the current one stays.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Changed
        default:
          $ref: "#/components/responses/Error"
  /auth/sessions:
    get:
      operationId: listSessions
      summary: Own signed-in devices
      tags: [sessions]
      responses:
        "200":
          description: Sessions, most recently used first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      summary: Sign out a device
      tags: [sessions]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Revoked
        default:
          $ref: "#/components/responses/Error"
  /auth/apikeys:
    get:
      operationId: listApiKeys
      summary: Own API keys
      tags: [apikeys]
      responses:
        "200":
          description: API keys (never the key itself)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createApiKey
      summary: Create an API key
      description: The key is returned once and cannot be shown again. Needs a session (not an API key).
      tags: [apikeys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiKey"
        default:
          $ref: "#/components/responses/Error"
  /auth/apikeys/{id}:
    delete:
      operationId: deleteApiKey
      summary: Revoke an API key
      tags: [apikeys]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Revoked
        default:
          $ref: "#/components/responses/Error"
  /auth/totp/setup:
    post:
      operationId: startTotpSetup
      summary: Start two-factor setup
      description: Returns a new secret to add to an authenticator app. Two-factor is on only after `/auth/totp/enable`.
      tags: [twofactor]
      responses:
        "200":
          description: Secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpSetup"
        default:
          $ref: "#/components/responses/Error"
  /auth/totp/enable:
    post:
      operationId: enableTotp
      summary: Confirm two-factor setup with a code
      tags: [twofactor]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCodeRequest"
      responses:
        "200":
          description: Two-factor is on; recovery codes are shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        default:
          $ref: "#/components/responses/Error"
  /auth/totp/disable:
    post:
      operationId: disableTotp
      summary: Turn two-factor off
      tags: [twofactor]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirm"
      responses:
        "204":
          description: Two-factor is off
        default:
          $ref: "#/components/responses/Error"
  /auth/totp/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      summary: Replace the recovery codes
      tags: [twofactor]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirm"
      responses:
        "200":
          description: New recovery codes (the old ones stop working)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        default:
          $ref: "#/components/responses/Error"
  /users:
    get:
      operationId: listUsers
      summary: All users (administrators)
      tags: [users]
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createUser
      summary: Create a user (administrators)
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
  /users/{id}:
    get:
      operationId: getUser
      summary: One user (administrators)
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateUser
      summary: Change role, permissions or disable a user (administrators)
      description: The last enabled administrator cannot be demoted or disabled.
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteUser
      summary: Delete a user (administrators)
      description: Not the caller's own account and not the last enabled administrator.
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
  /users/{id}/password:
    post:
      operationId: resetUserPassword
      summary: Set a user's password (administrators)
      description: Signs the user out everywhere and clears an account lockout.
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password set
        default:
          $ref: "#/components/responses/Error"
  /settings:
    get:
      operationId: getSettings
      summary: Server settings (administrators)
      description: Secret fields only say whether they are set; their values never leave the server.
      tags: [settings]
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateSettings
      summary: Change server settings (administrators)
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequest"
      responses:
        "200":
          description: Settings after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        default:
          $ref: "#/components/responses/Error"
  /rootfolders:
    get:
      operationId: listRootFolders
      summary: Root folders with free space (administrators)
      tags: [rootfolders]
      responses:
        "200":
          description: Root folders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RootFolder"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createRootFolder
      summary: Add a root folder (administrators)
      description: The folder must exist inside one of the allowed data roots (`LOCARR_DATA_ROOTS`).
      tags: [rootfolders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRootFolderRequest"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootFolder"
        default:
          $ref: "#/components/responses/Error"
  /rootfolders/{id}:
    delete:
      operationId: deleteRootFolder
      summary: Remove a root folder (administrators)
      description: Only forgets the folder; nothing on disk is touched.
      tags: [rootfolders]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /filesystem:
    get:
      operationId: browseFilesystem
      summary: List folders inside the allowed data roots (administrators)
      description: Without `path`, lists the data roots themselves.
      tags: [filesystem]
      parameters:
        - name: path
          in: query
          required: false
          schema:
            type: string
            maxLength: 4096
      responses:
        "200":
          description: Folders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderListing"
        default:
          $ref: "#/components/responses/Error"
  /indexers:
    get:
      operationId: listIndexers
      summary: Indexers with their health (administrators)
      tags: [indexers]
      responses:
        "200":
          description: Indexers, by priority then name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Indexer"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createIndexer
      summary: Add a Torznab or Newznab indexer (administrators)
      description: |
        Categories left empty are filled from the indexer's capabilities when they
        can be fetched. The API key is write-only.
      tags: [indexers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndexerInput"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Indexer"
        default:
          $ref: "#/components/responses/Error"
  /indexers/{id}:
    get:
      operationId: getIndexer
      summary: One indexer (administrators)
      tags: [indexers]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Indexer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Indexer"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateIndexer
      summary: Change an indexer (administrators)
      description: Write-only fields (`apiKey`, `proxyPassword`) keep their stored value when absent; an empty string removes it.
      tags: [indexers]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndexerInput"
      responses:
        "200":
          description: Indexer after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Indexer"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteIndexer
      summary: Remove an indexer (administrators)
      tags: [indexers]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /indexers/{id}/test:
    post:
      operationId: testIndexer
      summary: Test a saved indexer (administrators)
      description: Fetches the capabilities and runs a probe search. Success clears the indexer's failures; the capabilities are stored.
      tags: [indexers]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Test result (also when the indexer failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexerTestResult"
        default:
          $ref: "#/components/responses/Error"
  /indexers/{id}/health/reset:
    post:
      operationId: resetIndexerHealth
      summary: Clear failures and backoff (administrators)
      tags: [indexers]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Indexer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Indexer"
        default:
          $ref: "#/components/responses/Error"
  /indexers/{id}/download:
    get:
      operationId: downloadRelease
      summary: Download a release file through the server (administrators and managers)
      description: |
        `token` comes from a search result's `downloadLink`. The server fetches the
        .torrent or .nzb with the indexer's credentials, so the API key never
        reaches the browser. Counts as a grab for the indexer's daily limit.
      tags: [indexers]
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: token
          in: query
          required: true
          schema:
            type: string
            maxLength: 8192
      responses:
        "200":
          description: The release file
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /indexers/test:
    post:
      operationId: testIndexerConfig
      summary: Test an indexer configuration before saving it (administrators)
      description: When `indexerId` is set, missing write-only fields are taken from that saved indexer.
      tags: [indexers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndexerTestRequest"
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexerTestResult"
        default:
          $ref: "#/components/responses/Error"
  /indexers/settings:
    get:
      operationId: getIndexerSettings
      summary: Indexer-wide settings (administrators)
      tags: [indexers]
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexerSettings"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateIndexerSettings
      summary: Change indexer-wide settings (administrators)
      tags: [indexers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIndexerSettingsRequest"
      responses:
        "200":
          description: Settings after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexerSettings"
        default:
          $ref: "#/components/responses/Error"
  /indexers/sources:
    get:
      operationId: listIndexerSources
      summary: Prowlarr and Jackett instances indexers are imported from (administrators)
      tags: [indexers]
      responses:
        "200":
          description: Sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IndexerSource"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createIndexerSource
      summary: Add a Prowlarr or Jackett source and import its indexers (administrators)
      description: Imports every indexer the source lists except those in `exclude`. Nothing is changed on the source.
      tags: [indexers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndexerSourceInput"
      responses:
        "201":
          description: Added and synced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexerSourceSyncResult"
        default:
          $ref: "#/components/responses/Error"
  /indexers/sources/preview:
    post:
      operationId: previewIndexerSource
      summary: List what a Prowlarr or Jackett source would import (administrators)
      tags: [indexers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndexerSourcePreviewRequest"
      responses:
        "200":
          description: Preview; nothing is saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexerSourcePreview"
        default:
          $ref: "#/components/responses/Error"
  /indexers/sources/{id}:
    delete:
      operationId: deleteIndexerSource
      summary: Forget a source (administrators)
      description: Its imported indexers stay and become ordinary indexers.
      tags: [indexers]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /indexers/sources/{id}/sync:
    post:
      operationId: syncIndexerSource
      summary: Sync a source again (administrators)
      description: Adds indexers that are new on the source, updates changed ones and disables (never deletes) those the source no longer lists.
      tags: [indexers]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexerSourceSyncResult"
        default:
          $ref: "#/components/responses/Error"
  /search:
    get:
      operationId: search
      summary: Search every eligible indexer and wait for all answers
      description: |
        Indexers are asked in parallel, each with its own timeout and request limit.
        Results are de-duplicated by GUID and info hash. Download links and magnets are
        only included for administrators and managers.
      tags: [search]
      parameters:
        - $ref: "#/components/parameters/SearchQ"
        - $ref: "#/components/parameters/SearchType"
        - $ref: "#/components/parameters/SearchCategories"
        - $ref: "#/components/parameters/SearchIndexerIds"
        - $ref: "#/components/parameters/SearchImdbId"
        - $ref: "#/components/parameters/SearchTmdbId"
        - $ref: "#/components/parameters/SearchTvdbId"
        - $ref: "#/components/parameters/SearchTvmazeId"
        - $ref: "#/components/parameters/SearchSeason"
        - $ref: "#/components/parameters/SearchEpisode"
        - $ref: "#/components/parameters/SearchArtist"
        - $ref: "#/components/parameters/SearchAlbum"
        - $ref: "#/components/parameters/SearchAuthor"
        - $ref: "#/components/parameters/SearchTitle"
        - $ref: "#/components/parameters/SearchLimit"
        - $ref: "#/components/parameters/SearchOffset"
      responses:
        "200":
          description: Results of every indexer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        default:
          $ref: "#/components/responses/Error"
  /search/stream:
    get:
      operationId: searchStream
      summary: Search every eligible indexer, streaming results as they arrive
      description: |
        Same parameters as `/search`. The answer is a Server-Sent Events stream
        (`text/event-stream`). Each event's `data` is one line of JSON:

        - `event: indexer` — one indexer answered (or was skipped): a `SearchStreamIndexerEvent`
          with that indexer's status and its releases not already sent.
        - `event: done` — every indexer is finished: a `SearchStreamDone`. The stream then ends.

        Browsers can read it with `EventSource` (the session cookie is sent) or `fetch`.
      tags: [search]
      parameters:
        - $ref: "#/components/parameters/SearchQ"
        - $ref: "#/components/parameters/SearchType"
        - $ref: "#/components/parameters/SearchCategories"
        - $ref: "#/components/parameters/SearchIndexerIds"
        - $ref: "#/components/parameters/SearchImdbId"
        - $ref: "#/components/parameters/SearchTmdbId"
        - $ref: "#/components/parameters/SearchTvdbId"
        - $ref: "#/components/parameters/SearchTvmazeId"
        - $ref: "#/components/parameters/SearchSeason"
        - $ref: "#/components/parameters/SearchEpisode"
        - $ref: "#/components/parameters/SearchArtist"
        - $ref: "#/components/parameters/SearchAlbum"
        - $ref: "#/components/parameters/SearchAuthor"
        - $ref: "#/components/parameters/SearchTitle"
        - $ref: "#/components/parameters/SearchLimit"
        - $ref: "#/components/parameters/SearchOffset"
      responses:
        "200":
          description: Server-Sent Events
          content:
            text/event-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /search/log:
    get:
      operationId: listSearchLog
      summary: Recent searches with per-indexer outcomes (administrators)
      tags: [search]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: itemRef
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchLogEntry"
        default:
          $ref: "#/components/responses/Error"
  /downloadclients:
    get:
      operationId: listDownloadClients
      summary: Download clients with their last status (administrators)
      tags: [downloadclients]
      responses:
        "200":
          description: Clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DownloadClient"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createDownloadClient
      summary: Add a download client (administrators)
      tags: [downloadclients]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadClientInput"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadClient"
        default:
          $ref: "#/components/responses/Error"
  /downloadclients/implementations:
    get:
      operationId: listDownloadClientImplementations
      summary: Supported clients, the fields each needs and what each can do (administrators)
      tags: [downloadclients]
      responses:
        "200":
          description: Implementations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DownloadClientImplementation"
        default:
          $ref: "#/components/responses/Error"
  /downloadclients/test:
    post:
      operationId: testDownloadClient
      summary: Test a client configuration (administrators)
      description: |
        Always answers 200 with the outcome. With `id`, password and API key left out
        are taken from that stored client. `errorCode` is one of `auth_failed`,
        `unreachable`, `tls_untrusted`, `wrong_url`, `address_blocked`, `client_error`,
        `unsupported`, `invalid` or `category_missing` (then `ok` is true and
        `missingCategories` lists them).
      tags: [downloadclients]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadClientTestRequest"
      responses:
        "200":
          description: Outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadClientTestResult"
        default:
          $ref: "#/components/responses/Error"
  /downloadclients/settings:
    get:
      operationId: getDownloadSettings
      summary: Download tracking settings (administrators)
      tags: [downloadclients]
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadSettings"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateDownloadSettings
      summary: Change download tracking settings (administrators)
      tags: [downloadclients]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDownloadSettings"
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadSettings"
        default:
          $ref: "#/components/responses/Error"
  /downloadclients/{id}:
    get:
      operationId: getDownloadClient
      summary: One download client (administrators)
      tags: [downloadclients]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadClient"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateDownloadClient
      summary: Replace a download client's settings (administrators)
      description: Leave `password` / `apiKey` out to keep them; send "" to clear.
      tags: [downloadclients]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadClientInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadClient"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteDownloadClient
      summary: Remove a download client (administrators)
      description: Nothing in the client is touched; its downloads stay in the history.
      tags: [downloadclients]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /downloadclients/{id}/categories:
    post:
      operationId: createDownloadClientCategories
      summary: Create the client's missing categories (administrators)
      tags: [downloadclients]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Categories that now exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedCategories"
        default:
          $ref: "#/components/responses/Error"
  /remotepathmappings:
    get:
      operationId: listRemotePathMappings
      summary: Remote path mappings (administrators)
      tags: [remotepathmappings]
      responses:
        "200":
          description: Mappings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RemotePathMapping"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createRemotePathMapping
      summary: Add a remote path mapping (administrators)
      description: The local path must lie inside the allowed data roots.
      tags: [remotepathmappings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemotePathMappingInput"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemotePathMapping"
        default:
          $ref: "#/components/responses/Error"
  /remotepathmappings/{id}:
    put:
      operationId: updateRemotePathMapping
      summary: Replace a remote path mapping (administrators)
      tags: [remotepathmappings]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemotePathMappingInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemotePathMapping"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteRemotePathMapping
      summary: Remove a remote path mapping (administrators)
      tags: [remotepathmappings]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /queue:
    get:
      operationId: getQueue
      summary: The download queue with live progress (library managers)
      description: |
        Tracked downloads that are still in a client, plus items other programs put in
        Locarr's categories (`unknown`: shown, never touched). Asking for the queue
        makes the tracker poll every few seconds for a short while.
      tags: [queue]
      parameters:
        - name: includeUnknown
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Queue"
        default:
          $ref: "#/components/responses/Error"
  /queue/refresh:
    post:
      operationId: refreshQueue
      summary: Poll every client now (library managers)
      tags: [queue]
      responses:
        "202":
          description: Polling
        default:
          $ref: "#/components/responses/Error"
  /queue/grab:
    post:
      operationId: grabRelease
      summary: Send a release to a download client (library managers)
      description: |
        The server fetches the .torrent / .nzb itself (size cap, timeout, no
        redirects to another host, no link-local or metadata addresses); magnet
        links go to the client directly. The client is chosen by protocol, tags
        and priority unless `clientId` is given. Errors: `no_download_client`,
        `already_queued`, `fetch_failed`, and the client errors of the test action.
      tags: [queue]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrabRequest"
      responses:
        "201":
          description: Sent to the client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueItem"
        default:
          $ref: "#/components/responses/Error"
  /queue/blocklist:
    get:
      operationId: listBlocklist
      summary: Blocked releases (library managers)
      tags: [queue]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 500
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlocklistEntry"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: addBlocklistEntry
      summary: Block a release (library managers)
      tags: [queue]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlocklistInput"
      responses:
        "201":
          description: Blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlocklistEntry"
        default:
          $ref: "#/components/responses/Error"
  /queue/blocklist/{id}:
    delete:
      operationId: deleteBlocklistEntry
      summary: Unblock a release (library managers)
      tags: [queue]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /queue/{id}:
    delete:
      operationId: removeQueueItem
      summary: Remove a download from its client (library managers)
      description: |
        `deleteData` also deletes the downloaded files (by the client, or by Locarr
        inside the data roots when the client cannot). `blocklist` blocks the release.
      tags: [queue]
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: deleteData
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: blocklist
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: reason
          in: query
          required: false
          schema:
            type: string
            maxLength: 500
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /queue/{id}/pause:
    post:
      operationId: pauseQueueItem
      summary: Pause a download (library managers)
      tags: [queue]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Paused
        default:
          $ref: "#/components/responses/Error"
  /queue/{id}/resume:
    post:
      operationId: resumeQueueItem
      summary: Resume a download (library managers)
      tags: [queue]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Resumed
        default:
          $ref: "#/components/responses/Error"
  /queue/{id}/priority:
    post:
      operationId: setQueueItemPriority
      summary: Move a download in its client's queue (library managers)
      tags: [queue]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriorityRequest"
      responses:
        "204":
          description: Moved
        default:
          $ref: "#/components/responses/Error"
  /queue/{id}/events:
    get:
      operationId: listQueueItemEvents
      summary: State history of one download (library managers)
      tags: [queue]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Events, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DownloadEvent"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      description: |
        A session token from /auth/login or /setup, or an API key (`lk_…`). The web client's
        HttpOnly `locarr_session` cookie and the `X-Api-Key` header are accepted too.
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    SearchQ:
      name: q
      in: query
      required: false
      description: Free text.
      schema:
        type: string
        maxLength: 300
    SearchType:
      name: type
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/SearchType"
    SearchCategories:
      name: categories
      in: query
      required: false
      description: Newznab category ids; empty = the indexer's categories for the search type.
      style: form
      explode: false
      schema:
        type: array
        maxItems: 50
        items:
          type: integer
          minimum: 1
    SearchIndexerIds:
      name: indexerIds
      in: query
      required: false
      description: Only these indexers; empty = every enabled one.
      style: form
      explode: false
      schema:
        type: array
        maxItems: 200
        items:
          type: integer
          format: int64
          minimum: 1
    SearchImdbId:
      name: imdbId
      in: query
      required: false
      schema:
        type: string
        pattern: "^(tt)?[0-9]{1,10}$"
    SearchTmdbId:
      name: tmdbId
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
    SearchTvdbId:
      name: tvdbId
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
    SearchTvmazeId:
      name: tvmazeId
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
    SearchSeason:
      name: season
      in: query
      required: false
      schema:
        type: string
        maxLength: 20
    SearchEpisode:
      name: episode
      in: query
      required: false
      schema:
        type: string
        maxLength: 20
    SearchArtist:
      name: artist
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
    SearchAlbum:
      name: album
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
    SearchAuthor:
      name: author
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
    SearchTitle:
      name: title
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
    SearchLimit:
      name: limit
      in: query
      required: false
      description: Results asked from each indexer (capped by its own maximum).
      schema:
        type: integer
        minimum: 1
        maximum: 1000
    SearchOffset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 100000
  responses:
    SignedIn:
      description: Signed in
      headers:
        Set-Cookie:
          description: HttpOnly session cookie, only when useCookie was requested.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthResult"
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code, e.g. `invalid_credentials`, `totp_required`, `forbidden`.
        message:
          type: string
    Language:
      type: string
      enum: [en, hr]
    Role:
      type: string
      enum: [admin, manager, requester]
      description: |
        `admin` can do everything. `manager` manages the library and requests (as its
        permissions allow). `requester` only asks for titles.
    Username:
      type: string
      minLength: 1
      maxLength: 64
      description: Case-insensitive; letters, digits, space and . _ - @
    Password:
      type: string
      minLength: 8
      maxLength: 256
    SystemInfo:
      type: object
      required: [product, instanceName, version, commit, startedAt, setupRequired]
      properties:
        product:
          type: string
        instanceName:
          type: string
        version:
          type: string
        commit:
          type: string
        startedAt:
          type: string
          format: date-time
        setupRequired:
          type: boolean
          description: True while no administrator exists.
    SystemStatus:
      type: object
      required: [version, commit, goVersion, os, arch, startedAt, uptimeSeconds, configDir, databaseSizeBytes, dataRoots]
      properties:
        version:
          type: string
        commit:
          type: string
        goVersion:
          type: string
        os:
          type: string
        arch:
          type: string
        startedAt:
          type: string
          format: date-time
        uptimeSeconds:
          type: integer
          format: int64
        configDir:
          type: string
        databaseSizeBytes:
          type: integer
          format: int64
          description: Database file plus its write-ahead log.
        dataRoots:
          type: array
          items:
            type: string
    JobState:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    Job:
      type: object
      required: [id, kind, queue, state, attempt, maxAttempts, runAt, createdAt]
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
        queue:
          type: string
        state:
          $ref: "#/components/schemas/JobState"
        attempt:
          type: integer
        maxAttempts:
          type: integer
        runAt:
          type: string
          format: date-time
          description: When a queued job is due (for a retry, after its backoff).
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        error:
          type: string
          description: The last error, if any attempt failed.
        uniqueKey:
          type: string
    ScheduledTask:
      type: object
      required: [name, kind, intervalSeconds, nextRunAt]
      properties:
        name:
          type: string
        kind:
          type: string
        intervalSeconds:
          type: integer
          format: int64
        nextRunAt:
          type: string
          format: date-time
        lastRunAt:
          type: string
          format: date-time
        lastState:
          $ref: "#/components/schemas/JobState"
    TaskList:
      type: object
      required: [scheduled, jobs]
      properties:
        scheduled:
          type: array
          items:
            $ref: "#/components/schemas/ScheduledTask"
        jobs:
          type: array
          description: Most recent first.
          items:
            $ref: "#/components/schemas/Job"
    DeviceInfo:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        client:
          type: string
          maxLength: 100
    SetupRequest:
      type: object
      required: [setupCode, username, password]
      properties:
        setupCode:
          type: string
          maxLength: 64
        username:
          $ref: "#/components/schemas/Username"
        password:
          $ref: "#/components/schemas/Password"
        language:
          $ref: "#/components/schemas/Language"
        instanceName:
          type: string
          maxLength: 100
        device:
          $ref: "#/components/schemas/DeviceInfo"
        useCookie:
          type: boolean
          description: Web clients set this to get the HttpOnly cookie instead of a token in the body.
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 64
        password:
          type: string
          maxLength: 256
        totpCode:
          type: string
          maxLength: 16
        recoveryCode:
          type: string
          maxLength: 32
        device:
          $ref: "#/components/schemas/DeviceInfo"
        useCookie:
          type: boolean
    AuthResult:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
          description: The session token, only when useCookie was not requested.
    Permissions:
      type: object
      description: What a non-administrator may do. Administrators may do everything regardless.
      required: [requestMovies, requestSeries, requestMusic, autoApprove, request4k, manageLibrary, manageRequests]
      properties:
        requestMovies:
          type: boolean
        requestSeries:
          type: boolean
        requestMusic:
          type: boolean
        autoApprove:
          type: boolean
          description: Requests are approved without an administrator.
        request4k:
          type: boolean
        manageLibrary:
          type: boolean
          description: Add, edit and search titles.
        manageRequests:
          type: boolean
          description: Approve and decline other users' requests.
    User:
      type: object
      required: [id, username, role, permissions, language, disabled, totpEnabled, createdAt]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        permissions:
          $ref: "#/components/schemas/Permissions"
        language:
          $ref: "#/components/schemas/Language"
        disabled:
          type: boolean
        totpEnabled:
          type: boolean
        lockedUntil:
          type: string
          format: date-time
          description: Set while the account is locked after failed sign-ins.
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
    UpdateMeRequest:
      type: object
      properties:
        language:
          $ref: "#/components/schemas/Language"
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          maxLength: 256
        newPassword:
          $ref: "#/components/schemas/Password"
    Session:
      type: object
      required: [id, deviceName, client, ip, createdAt, lastSeenAt, current]
      properties:
        id:
          type: integer
          format: int64
        deviceName:
          type: string
        client:
          type: string
        ip:
          type: string
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        current:
          type: boolean
    ApiKey:
      type: object
      required: [id, name, prefix, readOnly, createdAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        prefix:
          type: string
