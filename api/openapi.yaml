          maxLength: 64
        series:
          type: string
          maxLength: 64
        music:
          type: string
          maxLength: 64
    DownloadClientStatus:
      type: object
      required: [ok]
      description: The last poll. Absent `checkedAt` = not polled yet (or disabled).
      properties:
        ok: {type: boolean}
        checkedAt:
          type: string
          format: date-time
        errorCode: {type: string}
        error: {type: string}
        version: {type: string}
        freeSpaceBytes:
          type: integer
          format: int64
        pathChecks:
          type: array
          description: The client's default and category folders and whether Locarr sees them (administrators only).
          items:
            $ref: "#/components/schemas/ClientPathCheck"
    ClientPathCheck:
      type: object
      required: [clientPath, visible]
      properties:
        category:
          type: string
          description: Absent for the client's default folder.
        clientPath:
          type: string
          description: The folder as the client sees it.
        visible: {type: boolean}
        localPath:
          type: string
          description: Where Locarr sees it (when visible).
        suggestion:
          $ref: "#/components/schemas/PathMappingSuggestion"
    PathMappingSuggestion:
      type: object
      description: |
        A remote path mapping Locarr worked out by itself. It is never added without the
        user: add it with `POST /remotepathmappings` (or `PUT` on `replacesMappingId`).
      required: [host, remotePath, localPath, clientPath, foundAt, source, downloadIds]
      properties:
        clientId:
          type: integer
          format: int64
        clientName: {type: string}
        host: {type: string}
        remotePath: {type: string}
        localPath: {type: string}
        clientPath:
          type: string
          description: A path the client reported.
        foundAt:
          type: string
          description: Where Locarr found the same content (or a folder of the same name).
        source:
          type: string
          enum: [download, folder]
          description: "`download`: a finished download matched by name and size; `folder`: only a folder of the same name."
        replacesMappingId:
          type: integer
          format: int64
          description: A mapping for the same host and remote path exists but points elsewhere.
        downloadIds:
          type: array
          items:
            type: integer
            format: int64
    DownloadClient:
      type: object
      required: [id, name, implementation, protocol, enabled, priority, host, port, useTls, allowSelfSigned, urlBase, username,
        password, apiKey, directory, categories, recentPriority, olderPriority, initialState, removeCompleted, sequential,
        firstLastPiece, tags, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        name: {type: string}
        implementation: {type: string}
        protocol:
          $ref: "#/components/schemas/DownloadProtocol"
        enabled: {type: boolean}
        priority: {type: integer}
        host: {type: string}
        port: {type: integer}
        useTls: {type: boolean}
        allowSelfSigned: {type: boolean}
        urlBase: {type: string}
        username: {type: string}
        password:
          $ref: "#/components/schemas/SecretState"
        apiKey:
          $ref: "#/components/schemas/SecretState"
        directory: {type: string}
        categories:
          $ref: "#/components/schemas/DownloadClientCategories"
        recentPriority:
