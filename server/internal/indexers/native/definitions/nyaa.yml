id: nyaa
name: Nyaa
description: Anime, live action, music and literature from East Asia, through the site's RSS search.
version: 1
language: en
links:
  - https://nyaa.si
verified: >-
  Written from nyaa.si's RSS output (/?page=rss with q, c and f) observed on 2026-11-23.
  Magnets are built from nyaa:infoHash: robots.txt forbids /download.
flaresolverr: never
rateLimit: {requests: 12, periodSeconds: 60}
delayMillis: 2000
aliases: [nyaa, nyaasi, "nyaa.si"]
modes:
  search: [q]
  tv: [q, season, ep]
  movie: [q]
  music: [q]
  book: [q]
categories:
  - {id: "1_0", cat: 5070, desc: Anime}
  - {id: "1_2", cat: 5070, desc: Anime - English-translated}
  - {id: "1_3", cat: 5070, desc: Anime - Non-English-translated}
  - {id: "1_4", cat: 5070, desc: Anime - Raw}
  - {id: "2_0", cat: 3000, desc: Audio}
  - {id: "2_1", cat: 3040, desc: Audio - Lossless}
  - {id: "2_2", cat: 3010, desc: Audio - Lossy}
  - {id: "3_0", cat: 7000, desc: Literature}
  - {id: "4_0", cat: 5000, desc: Live Action}
settings:
  - name: filter
    type: select
    label: Filter
    default: "0"
    options: {"0": No filter, "1": No remakes, "2": Trusted only}
search:
  requests:
    - path: '/?page=rss&q={{ .Keywords | urlquery }}&c={{ first .Categories "0_0" }}&f={{ .Config.filter }}'
  response: xml
  rows: item
  fields:
    title: {select: title}
    details: {select: guid}
    infohash: {select: infohash}
    size: {select: size}
    date: {select: pubdate}
    seeders: {select: seeders}
    leechers: {select: leechers}
    grabs: {select: downloads}
    category: {select: categoryid}
test:
  query: frieren
